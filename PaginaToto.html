<script>
/* ===== js/auth.js ===== */
/* ============================================================================
 * auth.js  —  Login con email + contraseña (versión online)
 * ----------------------------------------------------------------------------
 * - Si no hay Supabase configurado -> App.auth.enabled = false (modo local).
 * - Muestra la pantalla de login hasta que el usuario entra.
 * - Bloquea a los usuarios desactivados.
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el;

  if (!App.sb) { App.auth = { enabled: false }; return; }
  var sb = App.sb;
  var readyCb = null;
  var recovering = false; // true mientras se está por el link de "olvidé mi contraseña"

  function fullScreen(node) {
    document.body.innerHTML = '';
    var wrap = el('div', { class: 'auth-screen' }, [node]);
    document.body.appendChild(wrap);
  }

  function card(children) {
    return el('div', { class: 'auth-card' }, [
      el('div', { class: 'auth-brand' }, [
        el('span', { class: 'auth-logo', text: '🚘' }),
        el('strong', { text: 'PaginaToto' })
      ])
    ].concat(children));
  }

  function loginScreen(msg) {
    var email = ui.input({ type: 'email', placeholder: 'tu@email.com', autocomplete: 'username', inputmode: 'email' });
    var pass = ui.input({ type: 'password', placeholder: 'Contraseña', autocomplete: 'current-password' });
    var err = el('p', { class: 'auth-err', text: msg || '' });
    // type="submit" implícito: el propio submit del <form> ya llama a submit();
    // si acá también tuviera onclick, un solo click dispararía el login dos veces.
    var btn = el('button', { type: 'submit', class: 'btn btn-primary auth-btn', text: 'Entrar' });

    var form = el('form', { class: 'auth-form', onsubmit: function (e) { e.preventDefault(); submit(); } }, [
      ui.field('Email', email),
      ui.field('Contraseña', pass),
      err,
      btn,
      el('p', { class: 'auth-hint', text: '¿No podés entrar? Pedile al administrador que te dé de alta o te resetee la contraseña.' })
    ]);

    fullScreen(card([el('h2', { text: 'Iniciar sesión' }), form]));
    setTimeout(function () { email.focus(); }, 50);

    function submit() {
      var e = email.value.trim().toLowerCase(), p = pass.value;
      if (!e || !p) { err.textContent = 'Completá email y contraseña.'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
      sb.auth.signInWithPassword({ email: e, password: p }).then(function (res) {
        if (res.error) {
          err.textContent = 'Email o contraseña incorrectos.';
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        start();
      });
    }
  }

  function blockedScreen(profile) {
    return card([
      el('h2', { text: 'Tu usuario está desactivado' }),
      el('p', { class: 'auth-hint', text: 'El administrador todavía no te habilitó o te dio de baja. Contactalo.' }),
      el('button', { class: 'btn btn-ghost auth-btn', text: 'Salir', onclick: function () { sb.auth.signOut().then(function () { location.reload(); }); } })
    ]);
  }

  function errorScreen(txt) {
    return card([
      el('h2', { text: 'No se pudo conectar' }),
      el('p', { class: 'auth-hint', text: txt || 'Revisá tu conexión a internet y volvé a intentar.' }),
      el('button', { class: 'btn btn-primary auth-btn', text: 'Reintentar', onclick: function () { location.reload(); } })
    ]);
  }

  // Pantalla para elegir nueva contraseña, después de tocar el link de recuperación del mail
  function recoveryScreen(msg) {
    var p1 = ui.input({ type: 'password', placeholder: 'Nueva contraseña', autocomplete: 'new-password' });
    var p2 = ui.input({ type: 'password', placeholder: 'Repetir contraseña', autocomplete: 'new-password' });
    var err = el('p', { class: 'auth-err', text: msg || '' });
    var btn = el('button', { type: 'submit', class: 'btn btn-primary auth-btn', text: 'Guardar contraseña' });

    var form = el('form', { class: 'auth-form', onsubmit: function (e) { e.preventDefault(); submit(); } }, [
      ui.field('Nueva contraseña', p1),
      ui.field('Repetir contraseña', p2),
      err,
      btn,
      el('p', { class: 'auth-hint', text: 'Elegí una contraseña de 6 caracteres o más.' })
    ]);

    fullScreen(card([el('h2', { text: 'Elegí tu nueva contraseña' }), form]));
    setTimeout(function () { p1.focus(); }, 50);

    function submit() {
      var a = p1.value, b = p2.value;
      if (!a || a.length < 6) { err.textContent = 'La contraseña tiene que tener 6 caracteres o más.'; return; }
      if (a !== b) { err.textContent = 'Las contraseñas no coinciden.'; return; }
      btn.disabled = true; btn.textContent = 'Guardando…'; err.textContent = '';
      sb.auth.updateUser({ password: a }).then(function (res) {
        if (res.error) {
          err.textContent = 'No se pudo cambiar la contraseña: ' + res.error.message;
          btn.disabled = false; btn.textContent = 'Guardar contraseña';
          return;
        }
        recovering = false;
        start();
      });
    }
  }

  function loadProfile() {
    return sb.auth.getUser().then(function (res) {
      var user = res.data && res.data.user;
      if (!user) return null;
      return sb.from('profiles').select('*').eq('id', user.id).single().then(function (p) {
        var base = { id: user.id, email: user.email, nombre: '', role: 'usuario', activo: false };
        return Object.assign(base, p.data || {}, { authEmail: user.email });
      });
    });
  }

  function start() {
    if (recovering) { recoveryScreen(); return; }
    fullScreen(card([el('h2', { text: 'Cargando…' })]));
    loadProfile().then(function (p) {
      if (recovering) { recoveryScreen(); return; }
      if (!p) { loginScreen(); return; }
      if (!p.activo) { fullScreen(blockedScreen(p)); return; }
      App.auth.profile = p;
      document.body.innerHTML = '';
      if (readyCb) readyCb(p);
    }).catch(function (e) {
      if (recovering) { recoveryScreen(); return; }
      console.error('auth start', e);
      fullScreen(errorScreen());
    });
  }

  App.auth = {
    enabled: true,
    profile: null,
    isAdmin: function () { return !!(App.auth.profile && App.auth.profile.role === 'admin'); },
    logout: function () { sb.auth.signOut().then(function () { location.reload(); }); },
    boot: function (cb) { readyCb = cb; start(); },
    reloadProfile: function () { return loadProfile().then(function (p) { if (p) App.auth.profile = p; return p; }); },
    // llama a la Edge Function que administra usuarios (solo admin)
    adminApi: function (action, payload) {
      return sb.functions.invoke('admin-users', { body: Object.assign({ action: action }, payload || {}) })
        .then(function (res) {
          if (res.error) {
            var msg = (res.error && res.error.message) || 'Error';
            try { if (res.data && res.data.error) msg = res.data.error; } catch (e) {}
            throw new Error(msg);
          }
          if (res.data && res.data.error) throw new Error(res.data.error);
          return res.data;
        });
    }
  };

  sb.auth.onAuthStateChange(function (evt) {
    if (evt === 'PASSWORD_RECOVERY') { recovering = true; recoveryScreen(); return; }
    if (evt === 'SIGNED_OUT') location.reload();
  });
})();
</script>
<script>
/* ===== js/sync.js ===== */
/* ============================================================================
 * sync.js  —  Sincroniza el estado con Supabase (carga + tiempo real + guardado)
 * ----------------------------------------------------------------------------
 * Estrategia: cada entidad (vehículo, movimiento, recordatorio, gasto fijo) es
 * una fila con su objeto completo en JSON. Al cambiar algo localmente se hace
 * un "diff" contra la última versión sincronizada y se suben sólo los cambios.
 * Realtime avisa de los cambios de otros usuarios y se aplican al estado local.
 * ==========================================================================*/
(function () {
  'use strict';
  if (!App.sb) { App.data = null; return; }
  var sb = App.sb, store = App.store;

  var shadow = null;           // clon del estado tal como está en la nube
  var pushTimer = null;
  var applyingRemote = false;
  var TABLES = ['vehicles', 'history', 'reminders', 'fixed_expenses'];
  var ARR = { vehicles: 'vehicles', history: 'history', reminders: 'reminders', fixed_expenses: 'fixedExpenses' };
  var pendingMigration = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function j(o) { return JSON.stringify(o); }

  /* ------------------------------- carga ------------------------------ */
  function loadAll() {
    return Promise.all([
      sb.from('vehicles').select('data'),
      sb.from('history').select('data'),
      sb.from('reminders').select('data'),
      sb.from('fixed_expenses').select('data'),
      sb.from('kv').select('k,data')
    ]).then(function (res) {
      res.forEach(function (r) { if (r.error) throw r.error; });
      var st = store.blankState();
      st.vehicles = (res[0].data || []).map(function (r) { return r.data; });
      st.history = (res[1].data || []).map(function (r) { return r.data; });
      st.reminders = (res[2].data || []).map(function (r) { return r.data; });
      st.fixedExpenses = (res[3].data || []).map(function (r) { return r.data; });
      (res[4].data || []).forEach(function (r) {
        if (r.k === 'settings') st.settings = Object.assign(st.settings, r.data || {});
        if (r.k === 'meta') st.meta = Object.assign(st.meta, r.data || {});
      });

      var vacio = !st.vehicles.length && !st.history.length && !st.reminders.length && !st.fixedExpenses.length;
      var local = null;
      try { local = JSON.parse(localStorage.getItem('paginaToto:v1') || 'null'); } catch (e) {}
      if (vacio && local && (local.vehicles || []).length) pendingMigration = local;

      applyingRemote = true;
      try { store.hydrate(st); } finally { applyingRemote = false; }
      shadow = clone(store.getState());
      subscribe();
    });
  }

  /* ----------------------------- tiempo real -------------------------- */
  function subscribe() {
    var ch = sb.channel('paginatoto-db');
    TABLES.concat(['kv']).forEach(function (t) {
      ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, function (payload) { onRemote(t, payload); });
    });
    ch.subscribe();
  }

  function onRemote(table, payload) {
    var st = store.getState();
    applyingRemote = true;
    try {
      if (table === 'kv') {
        if (payload.eventType === 'DELETE') return;
        var kk = payload.new.k;
        if (kk === 'settings') st.settings = Object.assign({}, st.settings, payload.new.data);
        else if (kk === 'meta') st.meta = Object.assign({}, st.meta, payload.new.data);
      } else {
        var arr = st[ARR[table]];
        if (payload.eventType === 'DELETE') {
          var oid = payload.old && payload.old.id;
          var i = -1; arr.forEach(function (x, k) { if (x.id === oid) i = k; });
          if (i >= 0) arr.splice(i, 1);
        } else {
          var d = payload.new.data;
          var jx = -1; arr.forEach(function (x, k) { if (x.id === d.id) jx = k; });
          if (jx >= 0) arr[jx] = d; else arr.push(d);
        }
      }
      shadow = clone(st);
      store.notify();
    } catch (e) {
      console.error('sync onRemote', e);
    } finally {
      applyingRemote = false;
    }
  }

  /* ------------------------ guardar (diff + subir) ------------------- */
  function onLocalChange(state) {
    if (applyingRemote) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { flush(state); }, 400);
  }

  function diffArr(table, cur, old, ops, tsField) {
    var oldById = {}; (old || []).forEach(function (x) { oldById[x.id] = x; });
    var curIds = {};
    (cur || []).forEach(function (x) {
      curIds[x.id] = true;
      var prev = oldById[x.id];
      if (!prev || j(prev) !== j(x)) {
        var row = { id: x.id, data: x };
        if (tsField) row.ts = x[tsField] || 0;
        ops.up[table].push(row);
      }
    });
    (old || []).forEach(function (x) { if (!curIds[x.id]) ops.del[table].push(x.id); });
  }

  function flush(state) {
    if (!shadow) shadow = clone(state);
    var ops = { up: { vehicles: [], history: [], reminders: [], fixed_expenses: [], kv: [] },
                del: { vehicles: [], history: [], reminders: [], fixed_expenses: [], kv: [] } };
    diffArr('vehicles', state.vehicles, shadow.vehicles, ops);
    diffArr('history', state.history, shadow.history, ops, 'ts');
    diffArr('reminders', state.reminders, shadow.reminders, ops);
    diffArr('fixed_expenses', state.fixedExpenses, shadow.fixedExpenses, ops);
    if (j(state.settings) !== j(shadow.settings)) ops.up.kv.push({ k: 'settings', data: state.settings });
    if (j(state.meta) !== j(shadow.meta)) ops.up.kv.push({ k: 'meta', data: state.meta });

    var promises = [];
    Object.keys(ops.up).forEach(function (t) {
      var key = t === 'kv' ? 'k' : 'id';
      if (ops.up[t].length) promises.push(sb.from(t).upsert(ops.up[t], { onConflict: key }));
      if (ops.del[t].length) promises.push(sb.from(t).delete().in(key, ops.del[t]));
    });
    if (!promises.length) { shadow = clone(state); return Promise.resolve(true); }

    return Promise.all(promises).then(function (results) {
      var bad = null;
      results.forEach(function (r) { if (r && r.error) bad = r.error; });
      if (bad) throw bad;
      shadow = clone(state);
      return true;
    }).catch(function (e) {
      console.error('sync flush', e);
      App.ui && App.ui.toast('No se pudo guardar en la nube. Revisá internet.', 'error');
      // reintenta solo en unos segundos (por si fue un corte momentáneo de internet)
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () { flush(store.getState()); }, 8000);
      return false;
    });
  }

  /* --------------------------- migración inicial -------------------- */
  function pendingMigrationInfo() {
    if (!pendingMigration) return null;
    return { autos: (pendingMigration.vehicles || []).length, recordatorios: (pendingMigration.reminders || []).length };
  }
  function doMigration() {
    if (!pendingMigration) return Promise.resolve();
    var st = store.migrate(pendingMigration);
    pendingMigration = null;
    applyingRemote = true;
    try { store.hydrate(st); } finally { applyingRemote = false; }
    return flush(store.getState()).then(function (ok) {
      if (ok) App.ui && App.ui.toast('Datos subidos a la nube', 'success');
    });
  }
  function skipMigration() { pendingMigration = null; }

  App.data = {
    loadAll: loadAll,
    onLocalChange: onLocalChange,
    flushNow: function () { if (pushTimer) clearTimeout(pushTimer); return flush(store.getState()); },
    pendingMigrationInfo: pendingMigrationInfo,
    doMigration: doMigration,
    skipMigration: skipMigration
  };
})();
</script>
<script>
/* ===== js/forms.js ===== */
/* ============================================================================
 * forms.js  —  Formularios: vehículo, compra, venta, gasto, reserva,
 *              gasto del negocio, recordatorio
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, store = App.store;

  var COMBUSTIBLES = ['Nafta', 'Diésel', 'GNC', 'Híbrido', 'Eléctrico', 'Nafta/GNC'];
  var CHECKLIST_ITEMS = [
    ['mecanica', 'Mecánica revisada'],
    ['aceite', 'Aceite cambiado'],
    ['frenos', 'Frenos revisados'],
    ['neumaticos', 'Neumáticos revisados'],
    ['luces', 'Luces revisadas'],
    ['aire', 'Aire acondicionado'],
    ['interior', 'Interior'],
    ['exterior', 'Exterior'],
    ['documentacion', 'Documentación'],
    ['transferencia', 'Transferencia']
  ];

  function opt(v, l) { return { value: v, label: l }; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function isoD(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }

  /* --------- Constructor de cuotas (a pagar o a cobrar) ------------- */
  function cuotaBuilder(getMoneda, opts) {
    opts = opts || {};
    var cobro = !!opts.cobro;
    var kDone = cobro ? 'cobrada' : 'pagada';
    var kDate = cobro ? 'fechaCobro' : 'fechaPago';
    var lblDone = cobro ? 'Cobrada' : 'Pagada';
    var cuotas = (opts.initial || []).map(function (c) { return Object.assign({}, c); });
    var box = el('div', { class: 'cuotas-builder' });
    var fCant = ui.input({ inputmode: 'numeric', placeholder: 'Cuotas', style: 'max-width:100px' });
    var fMonto = ui.input({ inputmode: 'decimal', placeholder: 'Monto c/u', style: 'max-width:150px' });
    var fPrimer = ui.input({ type: 'date', value: store.todayISO(), style: 'max-width:160px' });
    var gen = el('button', {
      type: 'button', class: 'btn btn-sm btn-ghost', text: 'Generar cuotas', onclick: function () {
        var n = parseInt(fCant.value, 10), monto = store.num(fMonto.value);
        if (!n || n < 1) { ui.toast('Poné cuántas cuotas', 'error'); return; }
        var base = App.finance.parseDate(fPrimer.value) || new Date();
        cuotas = [];
        for (var i = 0; i < n; i++) {
          var d = new Date(base.getFullYear(), base.getMonth() + i, base.getDate());
          var c = { id: store.uid(cobro ? 'cc' : 'c'), numero: i + 1, monto: monto, vencimiento: isoD(d) };
          c[kDone] = false; c[kDate] = null;
          cuotas.push(c);
        }
        render();
      }
    });
    function render() {
      ui.clear(box);
      if (!cuotas.length) { box.appendChild(el('p', { class: 'form-help', text: 'Todavía no generaste cuotas. Poné la cantidad, el monto y desde cuándo, y tocá "Generar cuotas".' })); return; }
      var totalEl = el('div', { class: 'cuota-total' });
      cuotas.forEach(function (c, i) {
        var fM = ui.input({ inputmode: 'decimal', value: c.monto, style: 'max-width:130px' });
        fM.addEventListener('input', function () { c.monto = fM.value; upd(); });
        var fV = ui.input({ type: 'date', value: c.vencimiento, style: 'max-width:150px' });
        fV.addEventListener('input', function () { c.vencimiento = fV.value; });
        var cb = el('input', { type: 'checkbox' }); cb.checked = !!c[kDone];
        var fFP = ui.input({ type: 'date', value: c[kDate] || store.todayISO(), style: 'max-width:140px' });
        fFP.disabled = !c[kDone];
        cb.addEventListener('change', function () { c[kDone] = cb.checked; fFP.disabled = !cb.checked; c[kDate] = cb.checked ? fFP.value : null; });
        fFP.addEventListener('input', function () { c[kDate] = fFP.value; });
        box.appendChild(el('div', { class: 'cuota-row' }, [
          el('span', { class: 'cuota-num', text: 'Cuota ' + (i + 1) }),
          fM, fV,
          el('label', { class: 'check-inline' }, [cb, el('span', { text: lblDone })]),
          fFP,
          el('button', { type: 'button', class: 'mini-btn', text: '✕', title: 'Quitar', onclick: function () { cuotas.splice(i, 1); render(); } })
        ]));
      });
      box.appendChild(totalEl);
      function upd() {
        var t = cuotas.reduce(function (s, x) { return s + store.num(x.monto); }, 0);
        totalEl.textContent = 'Total en cuotas: ' + App.fmt.money(t, getMoneda());
      }
      upd();
    }
    render();
    return {
      section: el('div', {}, [el('div', { class: 'inline-fields' }, [fCant, fMonto, fPrimer, gen]), box]),
      render: render,
      getCuotas: function () { return cuotas.slice(); }
    };
  }

  /* --------- Bloque de comisión a un tercero (opcional) ------------ */
  function comisionBlock(com) {
    com = com || {};
    var fPersona = ui.input({ value: com.persona || '', placeholder: 'Quién la trajo (opcional)' });
    var monto = ui.money2('comision', com.monto || '', com.moneda || 'ARS');
    var cbPag = el('input', { type: 'checkbox' }); cbPag.checked = !!com.pagada;
    var wrap = el('div', { class: 'grid-2' }, [
      ui.field('Persona / contacto', fPersona),
      ui.field('Monto de la comisión', monto.wrap),
      ui.field('', el('label', { class: 'check-inline' }, [cbPag, el('span', { text: 'Ya se la pagué' })]))
    ]);
    return {
      wrap: wrap,
      get: function () {
        return store.num(monto.monto.value) > 0
          ? { persona: fPersona.value, monto: monto.monto.value, moneda: monto.moneda.value, pagada: cbPag.checked }
          : null;
      }
    };
  }

  /* ============================ FORM VEHÍCULO ============================ */
  function vehicleForm(vehicle) {
    var isEdit = !!vehicle;
    var v = vehicle || {};

    var fMarca = ui.input({ value: v.marca || '', required: true, placeholder: 'Toyota' });
    var fModelo = ui.input({ value: v.modelo || '', required: true, placeholder: 'Corolla' });
    var fAnio = ui.input({ value: v.anio || '', inputmode: 'numeric', placeholder: '2016' });
    var fPatente = ui.input({ value: v.patente || '', placeholder: 'AB123CD', style: 'text-transform:uppercase' });
    var fKm = ui.input({ value: v.km != null ? v.km : '', inputmode: 'numeric', placeholder: '98000' });
    var fComb = ui.select([opt('', '—')].concat(COMBUSTIBLES.map(function (c) { return opt(c, c); })), v.combustible || '');
    var fCaja = ui.select([opt('', '—'), opt('manual', 'Manual'), opt('automatica', 'Automática')], v.caja || '');
    var fVersion = ui.input({ value: v.version || '', placeholder: 'XEI 1.8 CVT' });
    var fEstado = ui.select([opt('stock', 'En stock'), opt('reservado', 'Reservado'), opt('vendido', 'Vendido')], v.estado || 'stock');
    var fDoc = ui.select([opt('completa', 'Completa'), opt('pendiente', 'Pendiente'), opt('transferencia', 'Transferencia pendiente'), opt('otro', 'Otro')], v.documentacion || 'pendiente');
    var pretendido = ui.money2('pretendido', v.precioPretendido || '', v.precioPretendidoMoneda || 'ARS');
    var fObs = ui.textarea({ value: v.observaciones || '', rows: 4, placeholder: 'Cualquier información relevante del vehículo...' });

    var checkState = Object.assign({}, v.checklist || {});
    var checkGrid = el('div', { class: 'check-grid' }, CHECKLIST_ITEMS.map(function (it) {
      var cb = el('input', { type: 'checkbox' });
      cb.checked = !!checkState[it[0]];
      cb.addEventListener('change', function () { checkState[it[0]] = cb.checked; });
      return el('label', { class: 'check-item' }, [cb, el('span', { text: it[1] })]);
    }));

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'form-section-title', text: 'Información básica' }),
      el('div', { class: 'grid-2' }, [
        ui.field('Marca *', fMarca),
        ui.field('Modelo *', fModelo),
        ui.field('Año', fAnio),
        ui.field('Patente', fPatente),
        ui.field('Kilometraje al comprarlo', fKm),
        ui.field('Combustible', fComb),
        ui.field('Tipo de caja', fCaja),
        ui.field('Versión', fVersion)
      ]),
      el('div', { class: 'form-section-title', text: 'Estado y documentación' }),
      el('div', { class: 'grid-2' }, [
        ui.field('Estado', fEstado),
        ui.field('Documentación', fDoc),
        ui.field('Precio pretendido (opcional)', pretendido.wrap, 'Se usa para estimar el valor del stock')
      ]),
      el('div', { class: 'form-section-title', text: 'Observaciones generales' }),
      ui.field('', fObs),
      el('div', { class: 'form-section-title', text: 'Checklist (opcional)' }),
      checkGrid
    ]);

    var m = ui.modal({
      title: isEdit ? 'Editar vehículo' : 'Registrar vehículo',
      size: 'lg',
      body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar cambios' : 'Registrar vehículo', onclick: submit })
      ]
    });

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fMarca.value.trim() || !fModelo.value.trim()) { ui.toast('Marca y modelo son obligatorios', 'error'); return; }
      submitted = true;
      var data = {
        marca: fMarca.value, modelo: fModelo.value, anio: fAnio.value, patente: fPatente.value,
        km: fKm.value, combustible: fComb.value, caja: fCaja.value, version: fVersion.value,
        estado: fEstado.value, documentacion: fDoc.value,
        precioPretendido: pretendido.monto.value, precioPretendidoMoneda: pretendido.moneda.value,
        observaciones: fObs.value, checklist: checkState
      };
      if (isEdit) {
        store.updateVehicle(v.id, data);
        ui.toast('Vehículo actualizado', 'success');
      } else {
        var nv = store.createVehicle(data);
        ui.toast('Vehículo registrado', 'success');
        m.close();
        App.router.go('vehiculo/' + nv.id);
        return;
      }
      m.close();
    }
    return m;
  }

  /* ============================ FORM COMPRA ============================= */
  function purchaseForm(vehicleId) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var p = v.purchase || {};

    var fFecha = ui.input({ type: 'date', value: p.fecha || store.todayISO() });
    var precio = ui.money2('precio', p.precio || '', p.moneda || 'ARS');
    var fCotiz = ui.input({ inputmode: 'decimal', value: p.cotizacionUSD || '', placeholder: '1500' });
    var cotizField = ui.field('Cotización del dólar al momento de la compra', fCotiz, 'Se guarda como valor histórico y no cambia luego');

    var fForma = ui.select([opt('transferencia', 'Transferencia'), opt('efectivo', 'Efectivo'), opt('mixto', 'Mitad transferencia / mitad efectivo'), opt('cuotas', 'En cuotas')], p.formaPago || 'transferencia');
    var fTransf = ui.input({ inputmode: 'decimal', value: p.montoTransferencia || '', placeholder: 'Monto transferencia' });
    var fEfec = ui.input({ inputmode: 'decimal', value: p.montoEfectivo || '', placeholder: 'Monto efectivo' });
    var mixtoBox = el('div', { class: 'grid-2' }, [ui.field('Monto por transferencia', fTransf), ui.field('Monto en efectivo', fEfec)]);

    var cb = cuotaBuilder(function () { return precio.moneda.value; }, { initial: p.cuotas });
    var cuotasSection = cb.section;

    var pr = p.proveedor || {};
    var fProvNom = ui.input({ value: pr.nombre || '', placeholder: 'Nombre (opcional)' });
    var fProvTel = ui.input({ value: pr.telefono || '', placeholder: 'Teléfono (opcional)' });
    var fProvNotas = ui.textarea({ value: pr.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    var comision = comisionBlock(p.comision);

    function syncForma() {
      var f = fForma.value;
      mixtoBox.hidden = f !== 'mixto';
      cuotasSection.hidden = f !== 'cuotas';
    }
    fForma.addEventListener('change', syncForma);
    function syncCotiz() { cotizField.hidden = precio.moneda.value !== 'ARS'; }
    precio.moneda.addEventListener('change', function () { syncCotiz(); cb.render(); });

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Fecha de compra', fFecha),
        ui.field('Precio de compra', precio.wrap)
      ]),
      cotizField,
      el('div', { class: 'form-section-title', text: 'Forma de pago' }),
      ui.field('', fForma),
      mixtoBox,
      cuotasSection,
      el('div', { class: 'form-section-title', text: 'Vendedor / proveedor (opcional)' }),
      el('div', { class: 'grid-2' }, [ui.field('Nombre', fProvNom), ui.field('Teléfono', fProvTel)]),
      ui.field('Otros datos', fProvNotas),
      el('div', { class: 'form-section-title', text: 'Comisión pagada a un tercero (opcional)' }),
      comision.wrap
    ]);

    var m = ui.modal({
      title: v.purchase ? 'Editar compra' : 'Registrar compra',
      size: 'lg', body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar compra', onclick: submit })
      ]
    });
    syncForma(); syncCotiz();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(precio.monto.value) <= 0) { ui.toast('Ingresá el precio de compra', 'error'); return; }
      if (precio.moneda.value === 'ARS' && store.num(fCotiz.value) <= 0) {
        ui.toast('Ingresá la cotización del dólar de la compra', 'error'); return;
      }
      submitted = true;
      var data = {
        fecha: fFecha.value, precio: precio.monto.value, moneda: precio.moneda.value,
        cotizacionUSD: fCotiz.value,
        formaPago: fForma.value,
        montoTransferencia: fTransf.value, montoEfectivo: fEfec.value,
        cuotas: fForma.value === 'cuotas' ? cb.getCuotas() : [],
        proveedor: { nombre: fProvNom.value, telefono: fProvTel.value, notas: fProvNotas.value },
        comision: comision.get()
      };
      store.setPurchase(v.id, data);
      ui.toast('Compra registrada', 'success');
      m.close();
    }
    return m;
  }

  /* ============================ FORM VENTA ============================= */
  function saleForm(vehicleId) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    if (!v.purchase) { ui.toast('Primero registrá la compra del vehículo', 'error'); return; }
    var s = v.sale || {};

    var fFecha = ui.input({ type: 'date', value: s.fecha || store.todayISO() });
    var precio = ui.money2('venta', s.precio || '', s.moneda || 'ARS');
    var fCotiz = ui.input({ inputmode: 'decimal', value: s.cotizacionUSD || '', placeholder: '1600' });
    var cotizField = ui.field('Cotización del dólar al momento de la venta', fCotiz, 'Valor histórico, no cambia luego');
    var fForma = ui.select([
      opt('transferencia', 'Transferencia'), opt('efectivo', 'Efectivo'),
      opt('mixto', 'Mitad transferencia / mitad efectivo'),
      opt('financiado', 'Financiado / con prenda (en cuotas)'),
      opt('vehiculo', 'Entrega de otro vehículo como parte de pago')
    ], s.formaCobro || 'transferencia');
    var fTransf = ui.input({ inputmode: 'decimal', value: s.montoTransferencia || '', placeholder: 'Monto transferencia' });
    var fEfec = ui.input({ inputmode: 'decimal', value: s.montoEfectivo || '', placeholder: 'Monto efectivo' });
    var mixtoBox = el('div', { class: 'grid-2' }, [ui.field('Monto por transferencia', fTransf), ui.field('Monto en efectivo', fEfec)]);

    // financiación (cuotas a cobrar)
    var f = s.financiacion || {};
    var finEntidad = ui.input({ value: f.entidad || '', placeholder: 'Banco / financiera / particular' });
    var finEntrega = ui.money2('finEntrega', f.entrega || '', f.moneda || (s.moneda || 'ARS'));
    var finNotas = ui.textarea({ value: f.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });
    var finCb = cuotaBuilder(function () { return finEntrega.moneda.value; }, { cobro: true, initial: f.cuotas });
    var finBox = el('div', { class: 'trade-in-box' }, [
      el('div', { class: 'grid-2' }, [ui.field('Entidad / quién financia', finEntidad), ui.field('Anticipo / entrega', finEntrega.wrap)]),
      el('p', { class: 'form-help', text: 'Cargá las cuotas que te van a pagar. La app te va a avisar cuando venza cada una.' }),
      finCb.section,
      ui.field('Notas', finNotas)
    ]);

    // trade-in
    var ti = s.tradeIn || {};
    var tiEnabled = el('input', { type: 'checkbox' });
    tiEnabled.checked = !!s.tradeIn;
    var tiMarca = ui.input({ value: ti.marca || '', placeholder: 'Marca' });
    var tiModelo = ui.input({ value: ti.modelo || '', placeholder: 'Modelo' });
    var tiAnio = ui.input({ value: ti.anio || '', inputmode: 'numeric', placeholder: 'Año' });
    var tiPat = ui.input({ value: ti.patente || '', placeholder: 'Patente', style: 'text-transform:uppercase' });
    var tiKm = ui.input({ value: ti.km || '', inputmode: 'numeric', placeholder: 'Kilometraje' });
    var tiValor = ui.money2('tiValor', ti.valor || '', ti.moneda || 'ARS');
    var tiObs = ui.textarea({ value: ti.observaciones || '', rows: 2, placeholder: 'Observaciones del vehículo recibido' });
    var difMonto = ui.money2('dif', s.diferencia ? s.diferencia.monto : '', s.diferencia ? s.diferencia.moneda : 'ARS');
    var tiLinkNote = el('p', { class: 'form-help' });
    if (ti.vehicleId) tiLinkNote.textContent = 'Este vehículo ya fue incorporado al stock. Editá sus datos desde su propia ficha.';

    var tiBox = el('div', { class: 'trade-in-box' }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Marca', tiMarca), ui.field('Modelo', tiModelo),
        ui.field('Año', tiAnio), ui.field('Patente', tiPat),
        ui.field('Kilometraje', tiKm), ui.field('Valor asignado', tiValor.wrap)
      ]),
      ui.field('Observaciones', tiObs),
      el('div', { class: 'form-section-title', text: 'Diferencia recibida' }),
      ui.field('Monto de la diferencia', difMonto.wrap, 'La diferencia que efectivamente cobraste, además del vehículo'),
      tiLinkNote
    ]);

    function syncForma() {
      var vf = fForma.value;
      mixtoBox.hidden = vf !== 'mixto';
      finBox.hidden = vf !== 'financiado';
      if (vf === 'financiado') { finCb.render(); }
      if (vf === 'vehiculo') { tiEnabled.checked = true; }
      syncTi();
    }
    function syncTi() {
      tiBox.hidden = !tiEnabled.checked;
      var inputs = tiBox.querySelectorAll('input,textarea,select,button');
      Array.prototype.forEach.call(inputs, function (i) { i.disabled = !!ti.vehicleId; });
    }
    tiEnabled.addEventListener('change', syncTi);
    fForma.addEventListener('change', syncForma);
    function syncCotiz() { cotizField.hidden = precio.moneda.value !== 'ARS'; }
    precio.moneda.addEventListener('change', syncCotiz);

    var cl = s.cliente || {};
    var clNom = ui.input({ value: cl.nombre || '', placeholder: 'Nombre (opcional)' });
    var clTel = ui.input({ value: cl.telefono || '', placeholder: 'Teléfono (opcional)' });
    var clNotas = ui.textarea({ value: cl.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    var comision = comisionBlock(s.comision);

    var preview = el('div', { class: 'sale-preview' });
    function updatePreview() {
      var m = App.finance.vehicleMetrics(v);
      var sRate = store.num(fCotiz.value) || App.finance.currentRate();
      var ventaARS = precio.moneda.value === 'USD' ? store.num(precio.monto.value) * sRate : store.num(precio.monto.value);
      var costo = m.inversionARS + m.comisionCompraARS + (store.num(comision.get() && comision.get().monto) || 0);
      var gan = ventaARS - costo;
      var rent = costo ? gan / costo * 100 : 0;
      ui.clear(preview);
      preview.appendChild(el('div', { class: 'sale-preview-row' }, [
        el('span', { text: 'Lo que pusiste (compra + gastos + comisión)' }), el('strong', { text: App.fmt.money(costo) })
      ]));
      preview.appendChild(el('div', { class: 'sale-preview-row' }, [
        el('span', { text: 'Ganancia estimada' }),
        el('strong', { class: gan >= 0 ? 'pos' : 'neg', text: App.fmt.money(gan) + '  (' + App.fmt.pct(rent) + ')' })
      ]));
    }
    [precio.monto, precio.moneda, fCotiz].forEach(function (i) { i.addEventListener('input', updatePreview); i.addEventListener('change', updatePreview); });

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [ui.field('Fecha de venta', fFecha), ui.field('Precio de venta', precio.wrap)]),
      cotizField,
      preview,
      el('div', { class: 'form-section-title', text: 'Forma de cobro' }),
      ui.field('', fForma),
      mixtoBox,
      finBox,
      el('div', { class: 'form-section-title', text: 'Vehículo recibido como parte de pago' }),
      el('label', { class: 'check-inline' }, [tiEnabled, el('span', { text: 'Se recibió otro vehículo como parte de pago' })]),
      tiBox,
      el('div', { class: 'form-section-title', text: 'Cliente (opcional)' }),
      el('div', { class: 'grid-2' }, [ui.field('Nombre', clNom), ui.field('Teléfono', clTel)]),
      ui.field('Otros datos', clNotas),
      el('div', { class: 'form-section-title', text: 'Comisión pagada a un tercero (opcional)' }),
      comision.wrap
    ]);

    var m = ui.modal({
      title: v.sale ? 'Editar venta' : 'Registrar venta',
      size: 'lg', body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar venta', onclick: submit })
      ]
    });
    syncForma(); syncCotiz(); updatePreview();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(precio.monto.value) <= 0) { ui.toast('Ingresá el precio de venta', 'error'); return; }
      if (precio.moneda.value === 'ARS' && store.num(fCotiz.value) <= 0) { ui.toast('Ingresá la cotización del dólar de la venta', 'error'); return; }
      var tradeIn = null;
      if (tiEnabled.checked && !ti.vehicleId) {
        if (!tiMarca.value.trim() || !tiModelo.value.trim()) { ui.toast('Completá marca y modelo del vehículo recibido', 'error'); return; }
        if (store.num(tiValor.monto.value) <= 0) { ui.toast('Ingresá el valor asignado al vehículo recibido', 'error'); return; }
        tradeIn = {
          enabled: true, marca: tiMarca.value, modelo: tiModelo.value, anio: tiAnio.value,
          patente: tiPat.value, km: tiKm.value, valor: tiValor.monto.value, moneda: tiValor.moneda.value,
          observaciones: tiObs.value
        };
      } else if (ti.vehicleId) {
        tradeIn = { enabled: true, vehicleId: ti.vehicleId, marca: ti.marca, modelo: ti.modelo, anio: ti.anio, patente: ti.patente, km: ti.km, valor: ti.valor, moneda: ti.moneda, observaciones: ti.observaciones };
      }
      var financiacion = null;
      if (fForma.value === 'financiado') {
        var fc = finCb.getCuotas();
        if (!fc.length) { ui.toast('Cargá las cuotas de la financiación', 'error'); return; }
        financiacion = {
          enabled: true, entidad: finEntidad.value, entrega: finEntrega.monto.value, moneda: finEntrega.moneda.value,
          notas: finNotas.value, cuotas: fc
        };
      }
      submitted = true;
      var data = {
        fecha: fFecha.value, precio: precio.monto.value, moneda: precio.moneda.value, cotizacionUSD: fCotiz.value,
        formaCobro: fForma.value, montoTransferencia: fTransf.value, montoEfectivo: fEfec.value,
        cliente: { nombre: clNom.value, telefono: clTel.value, notas: clNotas.value },
        tradeIn: tradeIn,
        financiacion: financiacion,
        comision: comision.get(),
        diferencia: (tiEnabled.checked && store.num(difMonto.monto.value) > 0) ? { monto: difMonto.monto.value, moneda: difMonto.moneda.value } : null
      };
      store.setSale(v.id, data);
      ui.toast('Venta registrada', 'success');
      m.close();
    }
    return m;
  }

  /* ============================ FORM RESERVA ========================== */
  function reservationForm(vehicleId) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var r = v.reservation || {};
    var isEdit = !!v.reservation;

    var fFecha = ui.input({ type: 'date', value: r.fecha || store.todayISO() });
    var sena = ui.money2('sena', r.monto || '', r.moneda || 'ARS');
    var fVence = ui.input({ type: 'date', value: r.vence || '' });
    var fClienteNom = ui.input({ value: (r.cliente && r.cliente.nombre) || '', placeholder: 'Nombre' });
    var fClienteTel = ui.input({ value: (r.cliente && r.cliente.telefono) || '', placeholder: 'Teléfono' });
    var fNotas = ui.textarea({ value: r.notas || '', rows: 2, placeholder: 'Cómo pagó la seña, qué falta, etc.' });

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Fecha de la reserva', fFecha),
        ui.field('Seña recibida', sena.wrap)
      ]),
      ui.field('Vence el (opcional)', fVence, 'La app te avisa cuando se acerque o pase esta fecha'),
      el('div', { class: 'form-section-title', text: 'Cliente' }),
      el('div', { class: 'grid-2' }, [ui.field('Nombre', fClienteNom), ui.field('Teléfono', fClienteTel)]),
      ui.field('Notas', fNotas)
    ]);

    var footer = [
      isEdit ? el('button', { class: 'btn btn-danger-ghost', text: 'Cancelar reserva', onclick: function () {
        m.close();
        ui.confirm({ title: 'Cancelar reserva', message: 'El auto vuelve a stock. ¿Seguro?', danger: true, confirmText: 'Cancelar reserva' })
          .then(function (ok) { if (ok) { store.cancelReservation(v.id); ui.toast('Reserva cancelada'); App.router.render(); } });
      } }) : null,
      el('button', { class: 'btn btn-ghost', text: 'Cerrar', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar' : 'Reservar', onclick: submit })
    ];
    var m = ui.modal({ title: isEdit ? 'Editar reserva' : 'Reservar vehículo', body: body, footer: footer });

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(sena.monto.value) <= 0) { ui.toast('Ingresá el monto de la seña', 'error'); return; }
      submitted = true;
      store.setReservation(v.id, {
        fecha: fFecha.value, monto: sena.monto.value, moneda: sena.moneda.value, vence: fVence.value,
        cliente: { nombre: fClienteNom.value, telefono: fClienteTel.value },
        notas: fNotas.value
      });
      ui.toast(isEdit ? 'Reserva actualizada' : 'Vehículo reservado', 'success');
      m.close();
    }
    return m;
  }

  /* ========================= FORM GASTO (por auto) ==================== */
  function expenseForm(vehicleId, expense) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var e = expense || {};
    var monto = ui.money2('gasto', e.monto || '', e.moneda || 'ARS');
    var fFecha = ui.input({ type: 'date', value: e.fecha || store.todayISO() });
    var fCotiz = ui.input({ inputmode: 'decimal', value: e.cotizacionUSD || '', placeholder: 'Cotización (si es en USD)' });
    var cotizField = ui.field('Cotización del dólar (opcional)', fCotiz, 'Si el gasto es en dólares y querés fijar una cotización distinta a la de la compra');
    var fObs = ui.textarea({ value: e.observacion || '', rows: 3, placeholder: 'Ej: 200 lucas en el vidrio delantero y cambio de aceite.' });
    function syncCotiz() { cotizField.hidden = monto.moneda.value !== 'USD'; }
    monto.moneda.addEventListener('change', syncCotiz);

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [ui.field('Monto', monto.wrap), ui.field('Fecha', fFecha)]),
      cotizField,
      ui.field('Observación', fObs)
    ]);
    var m = ui.modal({
      title: expense ? 'Editar gasto' : 'Agregar gasto',
      body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar gasto', onclick: submit })
      ]
    });
    syncCotiz();
    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(monto.monto.value) <= 0) { ui.toast('Ingresá el monto del gasto', 'error'); return; }
      submitted = true;
      var data = { monto: monto.monto.value, moneda: monto.moneda.value, fecha: fFecha.value, cotizacionUSD: fCotiz.value, observacion: fObs.value };
      if (expense) store.updateExpense(v.id, e.id, data);
      else store.addExpense(v.id, data);
      ui.toast('Gasto guardado', 'success');
      m.close();
    }
    return m;
  }

  /* ==================== FORM GASTO DEL NEGOCIO (fijo) ================= */
  var GASTO_CATS = [
    ['alquiler', 'Alquiler del local'],
    ['sueldos', 'Sueldos'],
    ['seguros', 'Seguros / flota'],
    ['patentes', 'Patentes e impuestos'],
    ['servicios', 'Servicios (luz, internet…)'],
    ['publicidad', 'Publicidad'],
    ['otro', 'Otro']
  ];
  function fixedExpenseForm(fixed) {
    var f = fixed || {};
    var isEdit = !!fixed;

    var fConcepto = ui.input({ value: f.concepto || '', required: true, placeholder: 'Ej: Alquiler del local' });
    var fCat = ui.select(GASTO_CATS.map(function (c) { return opt(c[0], c[1]); }), f.categoria || 'otro');
    var monto = ui.money2('fijo', f.monto || '', f.moneda || 'ARS');
    var fCotiz = ui.input({ inputmode: 'decimal', value: f.cotizacionUSD || '', placeholder: 'Cotización (si es en USD)' });
    var cotizField = ui.field('Cotización del dólar (opcional)', fCotiz);
    var fFrec = ui.select([opt('mensual', 'Todos los meses'), opt('unica', 'Una sola vez')], f.frecuencia || 'mensual');
    var fFecha = ui.input({ type: 'date', value: f.fecha || store.todayISO() });
    var fechaField = ui.field('Desde', fFecha);
    var fHasta = ui.input({ type: 'date', value: f.hasta || '' });
    var hastaField = ui.field('Hasta (opcional)', fHasta, 'Si el gasto dejó de correr, poné la fecha');
    var fNotas = ui.textarea({ value: f.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    function sync() {
      var mensual = fFrec.value === 'mensual';
      fechaField.querySelector('.field-label').textContent = mensual ? 'Desde' : 'Fecha del gasto';
      hastaField.hidden = !mensual;
      cotizField.hidden = monto.moneda.value !== 'USD';
    }
    fFrec.addEventListener('change', sync);
    monto.moneda.addEventListener('change', sync);

    var body = el('div', { class: 'form-grid' }, [
      ui.field('Concepto *', fConcepto),
      el('div', { class: 'grid-2' }, [ui.field('Categoría', fCat), ui.field('Monto', monto.wrap)]),
      cotizField,
      el('div', { class: 'grid-2' }, [ui.field('¿Cada cuánto?', fFrec), fechaField]),
      hastaField,
      ui.field('Notas', fNotas)
    ]);

    var footer = [
      isEdit ? el('button', { class: 'btn btn-danger-ghost', text: 'Eliminar', onclick: function () {
        m.close();
        ui.confirm({ title: 'Eliminar gasto', message: '¿Eliminar "' + (f.concepto || 'este gasto') + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeFixedExpense(f.id); ui.toast('Gasto eliminado'); } });
      } }) : null,
      el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar' : 'Agregar', onclick: submit })
    ];
    var m = ui.modal({ title: isEdit ? 'Editar gasto del negocio' : 'Nuevo gasto del negocio', body: body, footer: footer });
    sync();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fConcepto.value.trim()) { ui.toast('Poné un concepto', 'error'); return; }
      if (store.num(monto.monto.value) <= 0) { ui.toast('Ingresá el monto', 'error'); return; }
      submitted = true;
      var data = {
        concepto: fConcepto.value, categoria: fCat.value, monto: monto.monto.value, moneda: monto.moneda.value,
        cotizacionUSD: fCotiz.value, frecuencia: fFrec.value, fecha: fFecha.value, hasta: fHasta.value, notas: fNotas.value
      };
      if (isEdit) { store.updateFixedExpense(f.id, data); ui.toast('Gasto actualizado', 'success'); }
      else { store.addFixedExpense(data); ui.toast('Gasto agregado', 'success'); }
      m.close();
    }
    return m;
  }

  /* ========================= FORM RECORDATORIO ======================= */
  var REM_TIPOS = [
    ['tarea', 'Tarea'],
    ['mantenimiento', 'Mantenimiento / Service'],
    ['tramite', 'Trámite / Documentación'],
    ['pago', 'Pago de cuota'],
    ['turno', 'Turno con cliente'],
    ['gestoria', 'Gestoría / Transferencia'],
    ['stock', 'Stock'],
    ['otro', 'Otro']
  ];
  var REM_REPEAT = [
    ['none', 'No repetir'],
    ['daily', 'Todos los días'],
    ['weekly', 'Todas las semanas'],
    ['monthly', 'Todos los meses'],
    ['yearly', 'Todos los años']
  ];

  function reminderForm(reminder, presetDate) {
    var isEdit = !!reminder;
    var r = reminder || {};

    var fTitulo = ui.input({ value: r.titulo || '', required: true, placeholder: 'Ej: Llamar al gestor por la transferencia' });
    var fFecha = ui.input({ type: 'date', value: r.fecha || presetDate || store.todayISO() });
    var fHora = ui.input({ type: 'time', value: r.hora || '' });
    var fTipo = ui.select(REM_TIPOS.map(function (t) { return opt(t[0], t[1]); }), r.tipo || 'tarea');
    var fRepeat = ui.select(REM_REPEAT.map(function (t) { return opt(t[0], t[1]); }), r.repeat || 'none');
    var fNota = ui.textarea({ value: r.nota || '', rows: 3, placeholder: 'Detalle o nota (opcional)' });

    var body = el('div', { class: 'form-grid' }, [
      ui.field('Título *', fTitulo),
      el('div', { class: 'grid-2' }, [ui.field('Fecha *', fFecha), ui.field('Hora (opcional)', fHora)]),
      el('div', { class: 'grid-2' }, [ui.field('Tipo', fTipo), ui.field('Repetir', fRepeat)]),
      ui.field('Descripción / nota (opcional)', fNota)
    ]);

    var footer = [
      isEdit ? el('button', { class: 'btn btn-danger-ghost', text: 'Eliminar', onclick: function () {
        m.close();
        ui.confirm({ title: 'Eliminar recordatorio', message: '¿Eliminar "' + (r.titulo || 'este recordatorio') + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeReminder(r.id); ui.toast('Recordatorio eliminado'); } });
      } }) : null,
      el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar' : 'Crear recordatorio', onclick: submit })
    ];

    var m = ui.modal({ title: isEdit ? 'Editar recordatorio' : 'Nuevo recordatorio', body: body, footer: footer });

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fTitulo.value.trim()) { ui.toast('El título es obligatorio', 'error'); return; }
      if (!fFecha.value) { ui.toast('La fecha es obligatoria', 'error'); return; }
      submitted = true;
      var data = { titulo: fTitulo.value, fecha: fFecha.value, hora: fHora.value, tipo: fTipo.value, nota: fNota.value, repeat: fRepeat.value };
      if (isEdit) { store.updateReminder(r.id, data); ui.toast('Recordatorio actualizado', 'success'); }
      else { store.addReminder(data); ui.toast('Recordatorio creado', 'success'); }
      m.close();
    }
    return m;
  }

  window.App = window.App || {};
  App.forms = {
    vehicleForm: vehicleForm, purchaseForm: purchaseForm, saleForm: saleForm, expenseForm: expenseForm,
    reservationForm: reservationForm, fixedExpenseForm: fixedExpenseForm,
    reminderForm: reminderForm, CHECKLIST_ITEMS: CHECKLIST_ITEMS,
    REM_TIPOS: REM_TIPOS, REM_REPEAT: REM_REPEAT, GASTO_CATS: GASTO_CATS
  };
})();
</script>
<script>
/* ===== js/views1.js ===== */
/* ============================================================================
 * views1.js  —  Dashboard y ficha de vehículo
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, fmt = App.fmt, store = App.store, fin = App.finance;

  /* estado de filtros y búsqueda (compartido con la búsqueda global) */
  var filters = {
    q: '', marca: '', modelo: '', anio: '', estado: '', vendido: '',
    precioMin: '', precioMax: '', gananciaMin: '', gananciaMax: '',
    compraDesde: '', compraHasta: '', ventaDesde: '', ventaHasta: '',
    sort: 'reciente'
  };
  App.filters = filters;

  function matchVehicle(v) {
    var m = fin.vehicleMetrics(v);
    var name = store.vehicleName(v).toLowerCase();
    if (filters.q) {
      var q = filters.q.toLowerCase().trim();
      var hay = [name, v.marca, v.modelo, String(v.anio || ''), v.patente, v.version, store.estadoLabel(v.estado)]
        .filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (filters.marca && (v.marca || '').toLowerCase() !== filters.marca.toLowerCase()) return false;
    if (filters.modelo && (v.modelo || '').toLowerCase().indexOf(filters.modelo.toLowerCase()) === -1) return false;
    if (filters.anio && String(v.anio || '') !== String(filters.anio)) return false;
    if (filters.estado && v.estado !== filters.estado) return false;
    if (filters.vendido === 'si' && v.estado !== 'vendido') return false;
    if (filters.vendido === 'no' && v.estado === 'vendido') return false;
    var precio = m.vendido ? m.ventaARS : m.inversionARS;
    if (filters.precioMin && precio < store.num(filters.precioMin)) return false;
    if (filters.precioMax && precio > store.num(filters.precioMax)) return false;
    if (filters.gananciaMin && (!m.vendido || m.gananciaARS < store.num(filters.gananciaMin))) return false;
    if (filters.gananciaMax && m.vendido && m.gananciaARS > store.num(filters.gananciaMax)) return false;
    if (filters.compraDesde && (!v.purchase || v.purchase.fecha < filters.compraDesde)) return false;
    if (filters.compraHasta && (!v.purchase || v.purchase.fecha > filters.compraHasta)) return false;
    if (filters.ventaDesde && (!v.sale || v.sale.fecha < filters.ventaDesde)) return false;
    if (filters.ventaHasta && (!v.sale || v.sale.fecha > filters.ventaHasta)) return false;
    return true;
  }

  function sortVehicles(list) {
    var s = filters.sort;
    var arr = list.slice();
    arr.sort(function (a, b) {
      var ma = fin.vehicleMetrics(a), mb = fin.vehicleMetrics(b);
      switch (s) {
        case 'antiguo': return (a.purchase ? a.purchase.fecha : '9999').localeCompare(b.purchase ? b.purchase.fecha : '9999');
        case 'reciente': return (b.purchase ? b.purchase.fecha : '0000').localeCompare(a.purchase ? a.purchase.fecha : '0000') || b.createdAt - a.createdAt;
        case 'ganancia-desc': return mb.gananciaARS - ma.gananciaARS;
        case 'ganancia-asc': return ma.gananciaARS - mb.gananciaARS;
        case 'precio-desc': return (mb.vendido ? mb.ventaARS : mb.inversionARS) - (ma.vendido ? ma.ventaARS : ma.inversionARS);
        case 'precio-asc': return (ma.vendido ? ma.ventaARS : ma.inversionARS) - (mb.vendido ? mb.ventaARS : mb.inversionARS);
        default: return b.createdAt - a.createdAt;
      }
    });
    return arr;
  }

  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  // Tarjeta "Origen: parte de pago" — de dónde vino este vehículo, cuánto costó
  // tomarlo, y el margen potencial (en stock) o la ganancia realizada (vendido).
  // Reutiliza los mismos números que ya calcula vehicleMetrics para cualquier
  // vehículo — no inventa una fórmula nueva.
  function origenCard(v, m) {
    var orig = v.origin.saleVehicleId ? store.getVehicle(v.origin.saleVehicleId) : null;
    var rows = [
      ['Recibido en la venta de', orig ? store.vehicleName(orig) : 'una operación que ya no existe'],
      ['Costo de toma', fmt.money(m.compraARS)]
    ];
    if (!m.vendido) {
      rows.push(['Valor estimado de venta', v.precioPretendido ? fmt.money(v.precioPretendido, v.precioPretendidoMoneda) : '— (no cargado)']);
      if (v.precioPretendido) {
        var margen = m.estimadoARS - m.costoTotalARS;
        rows.push(['Margen potencial', (margen >= 0 ? '+' : '') + fmt.money(margen), margen >= 0 ? 'pos strong' : 'neg strong']);
      }
    } else {
      rows.push(['Vendido en', fmt.money(m.ventaARS)]);
      rows.push(['Ganancia realizada', (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS), m.gananciaARS >= 0 ? 'pos strong' : 'neg strong']);
    }
    return el('div', { class: 'card info-card' }, [
      el('h4', { text: '🔁 Origen: parte de pago' }),
      dl(rows),
      orig ? el('a', { class: 'btn btn-sm btn-primary', href: '#/vehiculo/' + orig.id + '?tab=venta', text: 'Ver operación' }) : null

      ])]),
      el('div', { class: 'card' }, [el('h4', { text: 'Situación financiera' }), dl([
        ['Precio de compra', v.purchase ? fmt.money(v.purchase.precio, v.purchase.moneda) : '—'],
        ['Gastos', fmt.money(m.gastosARS)],
        m.comisionARS ? ['Comisiones', fmt.money(m.comisionARS)] : null,
        ['Lo que puse (total)', fmt.money(m.costoTotalARS), 'strong'],
        ['Precio de venta', m.vendido ? fmt.money(v.sale.precio, v.sale.moneda) : 'Todavía no vendido'],
        m.vendido ? ['Ganancia', (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS), m.gananciaARS >= 0 ? 'pos strong' : 'neg strong'] : null,
        m.vendido ? ['Rentabilidad', fmt.pct(m.rentabilidad), m.gananciaARS >= 0 ? 'pos' : 'neg'] : null,
        ['Días en stock', fmt.days(m.diasEnStock)],
        m.cuotasCount ? ['Cuotas a pagar', m.cuotasPagadasCount + ' / ' + m.cuotasCount + ' pagadas'] : null,

    var excelOn = false;

    var dias = last ? Math.floor((Date.now() - last) / 86400000) : null;
    var txt, cls, ico;
    if (excelOn) { txt = 'Se está guardando solo en Excel'; cls = 'is-ok'; ico = '✅'; }
    // en modo online los datos ya viven en la nube (Supabase): no hace falta
    // alarmar con "no hiciste copia" — el export local es un extra, no la única red de seguridad.
    else if (online && last == null) { txt = 'Tus datos se guardan en la nube. Podés exportar una copia extra'; cls = ''; ico = '☁️'; }
    else if (last == null) { txt = 'Todavía no hiciste ninguna copia de seguridad'; cls = 'is-urgent'; ico = '⚠️'; }
    else if (dias <= 0) { txt = 'Última copia de seguridad: hoy'; cls = 'is-ok'; ico = '✅'; }
    else if (dias === 1) { txt = 'Última copia de seguridad: ayer'; cls = ''; ico = '💾'; }
    else if (online) { txt = 'Última copia extra: hace ' + dias + ' días (tus datos ya están en la nube)'; cls = ''; ico = '💾'; }
    else { txt = 'Última copia de seguridad: hace ' + dias + ' días'; cls = dias >= 3 ? 'is-urgent' : ''; ico = dias >= 3 ? '⚠️' : '💾'; }
    return el('a', { class: 'backup-bar ' + cls, href: '#/exportar' }, [

      el('span', { class: 'backup-bar-txt', text: txt }),

    ]);
  }

  App.views._backupBar = backupBar;
})();

<script>
/* ===== js/views2.js ===== */
/* ============================================================================
 * views2.js  —  Alertas, Finanzas, Resúmenes, Gráficos, Historial,
 *               Operaciones, Comparación del dólar, Contactos, Estadísticas,
 *               Papelera, Exportación, Ajustes
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, fmt = App.fmt, store = App.store, fin = App.finance;

  /* =============================== ALERTAS ============================= */
  /* ---- Recordatorios: tipos, repetición y cálculo de ocurrencias ---- */
  var REM_TIPOS = (App.forms && App.forms.REM_TIPOS) || [['tarea', 'Tarea']];
  var REM_ICON = {
    tarea: '📋', mantenimiento: '🔧', tramite: '📁', pago: '💳',
    turno: '🤝', gestoria: '📝', stock: '📦', otro: '🔔'
  };
  function remTipoLabel(t) {
    for (var i = 0; i < REM_TIPOS.length; i++) if (REM_TIPOS[i][0] === t) return REM_TIPOS[i][1];
    return 'Otro';
  }
  function remIcon(t) { return REM_ICON[t] || '🔔'; }
  function remRepeatLabel(rep) {
    return ({ daily: 'todos los días', weekly: 'todas las semanas', monthly: 'todos los meses', yearly: 'todos los años' })[rep] || '';
  }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // próxima ocurrencia (>= hoy) de un recordatorio; para 'none' es su fecha tal cual
  function reminderNextDate(r, todayIso) {
    if (!r.repeat || r.repeat === 'none') return r.fecha;
    var base = fin.parseDate(r.fecha), today = fin.parseDate(todayIso);
    if (!base || !today) return r.fecha;
    var start = base > today ? base : today;
    var d;
    if (r.repeat === 'daily') return isoOf(start);
    if (r.repeat === 'weekly') {
      d = new Date(start);
      d.setDate(d.getDate() + ((base.getDay() - d.getDay() + 7) % 7));
      return isoOf(d);
    }
    if (r.repeat === 'monthly') {
      d = new Date(start.getFullYear(), start.getMonth(), base.getDate());
      if (d < start) d = new Date(start.getFullYear(), start.getMonth() + 1, base.getDate());
      return isoOf(d);
    }
    if (r.repeat === 'yearly') {
      d = new Date(start.getFullYear(), base.getMonth(), base.getDate());
      if (d < start) d = new Date(start.getFullYear() + 1, base.getMonth(), base.getDate());
      return isoOf(d);
    }
    return r.fecha;
  }

  // ¿el recordatorio cae en este día (YYYY-MM-DD)?
  function reminderOnDay(r, dayIso) {
    var base = fin.parseDate(r.fecha), day = fin.parseDate(dayIso);
    if (!base || !day) return false;
    if (day < new Date(base.getFullYear(), base.getMonth(), base.getDate())) return false;
    switch (r.repeat) {
      case 'daily': return true;
      case 'weekly': return base.getDay() === day.getDay();
      case 'monthly': return base.getDate() === day.getDate();
      case 'yearly': return base.getDate() === day.getDate() && base.getMonth() === day.getMonth();
      default: return r.fecha === dayIso;
    }
  }

  function occDone(r, occDate) { return (r.doneDates || []).indexOf(occDate) >= 0; }
  function reminderStatus(r, todayIso) {
    var next = reminderNextDate(r, todayIso);
    if (!r.repeat || r.repeat === 'none') {
      if (occDone(r, r.fecha)) return 'done';
      if (r.fecha < todayIso) return 'overdue';
      if (r.fecha === todayIso) return 'today';
      return 'upcoming';
    }
    if (occDone(r, next)) return 'done';
    return next === todayIso ? 'today' : 'upcoming';
  }

  // Eventos automáticos: vencimientos de cuotas (a pagar y a cobrar) y de reservas.
  // Para no llenar Alertas: los vencidos y de hoy siempre; los futuros sólo si
  // faltan pocos días (el listado completo está en "Cuotas y cobros").
  function autoEvents(todayIso, allFuture) {
    var horizonteDias = (store.getState().settings.cuotaProximaDias || 7) + 21; // ~1 mes de anticipación
    var limite = fin.parseDate(todayIso); limite.setDate(limite.getDate() + horizonteDias);
    var limiteIso = limite.getFullYear() + '-' + pad(limite.getMonth() + 1) + '-' + pad(limite.getDate());
    var out = [];
    var inst = fin.allInstallments();
    function add(kind, it) {
      if (!it.vencimiento) return;
      out.push({ auto: true, kind: kind, vehicle: it.vehicle, cuota: it.cuota, moneda: it.moneda, monto: it.cuota.monto, date: it.vencimiento });
    }
    inst.pagar.forEach(function (it) { if (it.estado !== 'pagada') add('pagar', it); });
    inst.cobrar.forEach(function (it) { if (it.estado !== 'cobrada') add('cobrar', it); });
    store.activeVehicles().forEach(function (v) {
      if (v.reservation && v.reservation.vence && v.estado === 'reservado') {
        out.push({ auto: true, kind: 'reserva', vehicle: v, date: v.reservation.vence });
      }
    });
    out.forEach(function (e) {
      e.status = e.date < todayIso ? 'overdue' : (e.date === todayIso ? 'today' : 'upcoming');
    });
    if (allFuture) return out;
    return out.filter(function (e) { return e.status !== 'upcoming' || e.date <= limiteIso; });
  }

  function allBuckets(todayIso) {
    var b = { overdue: [], today: [], upcoming: [], done: [] };
    store.getReminders().forEach(function (r) {
      var st = reminderStatus(r, todayIso);
      b[st].push({ r: r, date: reminderNextDate(r, todayIso), status: st });
    });
    autoEvents(todayIso).forEach(function (e) { b[e.status].push(e); });
    function key(x) { return (x.date || '9999') + '·' + (x.r && x.r.hora ? x.r.hora : '99:99'); }
    ['overdue', 'today', 'upcoming'].forEach(function (k) { b[k].sort(function (a, x) { return key(a).localeCompare(key(x)); }); });
    return b;
  }

  var alerts = {
    forVehicle: function (v) {
      var out = [];
      if (v.deleted) return out;
      var m = fin.vehicleMetrics(v);
      var hoy = store.todayISO();
      var s = store.getState().settings;
      if (!v.purchase) out.push({ level: 'warn', icon: '🧾', text: 'Falta registrar la compra', vehicleId: v.id });
      if (v.purchase && !v.purchase.cotizacionUSD && v.purchase.moneda === 'ARS') out.push({ level: 'info', icon: '💵', text: 'Falta la cotización del dólar en la compra', vehicleId: v.id });
      if (v.estado === 'vendido' && v.sale) {
        if (!v.sale.precio) out.push({ level: 'warn', icon: '🏷️', text: 'Falta registrar el precio de venta', vehicleId: v.id });
        if (!v.sale.fecha) out.push({ level: 'warn', icon: '📅', text: 'Falta registrar la fecha de venta', vehicleId: v.id });
        if (v.sale.moneda === 'ARS' && !v.sale.cotizacionUSD) out.push({ level: 'info', icon: '💵', text: 'Falta la cotización del dólar en la venta', vehicleId: v.id });
      }
      if (v.documentacion === 'pendiente' || v.documentacion === 'transferencia') out.push({ level: 'warn', icon: '📁', text: 'Documentación pendiente' + (v.documentacion === 'transferencia' ? ' (transferencia)' : ''), vehicleId: v.id });
      if (v.estado !== 'vendido' && m.diasEnStock != null && m.diasEnStock >= s.diasStockAlerta) out.push({ level: 'warn', icon: '⏳', text: 'Lleva ' + m.diasEnStock + ' días en stock', vehicleId: v.id });
      if (!v.marca || !v.modelo || !v.patente) out.push({ level: 'info', icon: '✏️', text: 'Información básica incompleta', vehicleId: v.id });
      // (los vencimientos de cuotas y reservas se muestran arriba, como recordatorios)
      return out;
    },
    all: function () {
      var out = [];
      store.activeVehicles().forEach(function (v) {
        alerts.forVehicle(v).forEach(function (a) { a.vehicle = v; out.push(a); });
      });
      var order = { danger: 0, warn: 1, info: 2 };
      out.sort(function (a, b) { return order[a.level] - order[b.level]; });
      return out;
    },
    count: function () {
      var n = alerts.all().filter(function (a) { return a.level !== 'info'; }).length;
      var hoy = store.todayISO();
      store.getReminders().forEach(function (r) {
        var st = reminderStatus(r, hoy);
        if (st === 'overdue' || st === 'today') n++;
      });
      autoEvents(hoy).forEach(function (e) { if (e.status === 'overdue' || e.status === 'today') n++; });
      return n;
    }
  };
  function daysBetween(a, b) {
    var da = fin.parseDate(a), db = fin.parseDate(b);
    if (!da || !db) return 0;
    return Math.round((db - da) / 86400000);
  }
  App.alerts = alerts;

  var remCal = { y: null, m: null, sel: null };

  function alertasView(root) {
    var hoy = store.todayISO();
    var now = new Date();
    if (remCal.y == null) { remCal.y = now.getFullYear(); remCal.m = now.getMonth(); }
    if (!remCal.sel) remCal.sel = hoy;

    var vehAlerts = alerts.all();
    var b = allBuckets(hoy);
    var doneRems = store.getReminders().filter(function (r) { return reminderStatus(r, hoy) === 'done'; })
      .map(function (r) { return { r: r, date: r.fecha, status: 'done' }; });
    var pendCount = b.overdue.length + b.today.length + b.upcoming.length;

    var wrap = el('div', { class: 'page alertas-page' });

    var head = pageHead('Alertas', 'Cuotas, recordatorios y situaciones de los vehículos');
    head.appendChild(el('button', { class: 'btn btn-primary', html: '<span>＋</span> Nuevo recordatorio', onclick: function () { App.forms.reminderForm(null, remCal.sel); } }));
    wrap.appendChild(head);

    // Resumen (chips)
    wrap.appendChild(el('div', { class: 'alert-summary' }, [
      chip('🔔', pendCount, pendCount === 1 ? 'cosa pendiente' : 'cosas pendientes', 'chip-info'),
      b.overdue.length ? chip('⚠️', b.overdue.length, b.overdue.length === 1 ? 'vencida' : 'vencidas', 'chip-danger') : null,
      b.today.length ? chip('📅', b.today.length, 'para hoy', 'chip-warn') : null,
      vehAlerts.length ? chip('🚗', vehAlerts.length, vehAlerts.length === 1 ? 'aviso de vehículos' : 'avisos de vehículos', 'chip-neutral') : null
    ]));

    if (b.overdue.length) wrap.appendChild(remGroup('Vencidos', b.overdue, hoy, 'overdue'));
    if (b.today.length) wrap.appendChild(remGroup('Hoy', b.today, hoy, 'today'));
    if (b.upcoming.length) wrap.appendChild(remGroup('Próximos', b.upcoming.slice(0, 40), hoy, 'upcoming'));
    if (!pendCount) {
      wrap.appendChild(el('div', { class: 'card' }, [ui.emptyState('No tenés nada pendiente. Todo al día 👌', '✅')]));
    }
    if (doneRems.length) {
      wrap.appendChild(el('details', { class: 'card rem-done-box' }, [
        el('summary', {}, [el('strong', { text: 'Recordatorios completados' }), el('span', { class: 'count-tag', text: doneRems.length })]),
        remList(doneRems, hoy)
      ]));
    }

    // Calendario
    wrap.appendChild(calendarCard(hoy));

    // Revisión de vehículos
    if (vehAlerts.length) {
      var vsec = el('div', { class: 'card' });
      vsec.appendChild(el('div', { class: 'card-head' }, [el('h3', { text: 'Revisión de vehículos' }), el('span', { class: 'count-tag', text: vehAlerts.length })]));
      var byVeh = {};
      vehAlerts.forEach(function (a) { (byVeh[a.vehicle.id] = byVeh[a.vehicle.id] || []).push(a); });
      Object.keys(byVeh).forEach(function (vid) {
        var v = store.getVehicle(vid);
        vsec.appendChild(el('a', { class: 'veh-alert', href: '#/vehiculo/' + vid }, [
          el('div', { class: 'veh-alert-top' }, [
            el('strong', { text: store.vehicleName(v) }),
            v.patente ? el('span', { class: 'row-patente', text: v.patente }) : null
          ]),
          el('div', { class: 'veh-alert-lines' }, byVeh[vid].map(function (a) {
            return el('span', { class: 'alrt alrt-' + a.level }, [el('span', { text: a.icon }), el('span', { text: a.text })]);
          }))
        ]));
      });
      wrap.appendChild(vsec);
    }

    root.appendChild(wrap);
  }

  function chip(icon, n, label, cls) {
    return el('div', { class: 'summary-chip ' + (cls || '') }, [
      el('span', { class: 'summary-chip-ico', text: icon }),
      el('span', { class: 'summary-chip-n', text: n }),
      el('span', { class: 'summary-chip-lbl', text: label })
    ]);
  }

  function remGroup(title, items, hoy, kind) {
    return el('div', { class: 'card rem-group rem-group-' + kind }, [
      el('div', { class: 'rem-group-head' }, [el('h3', { text: title }), el('span', { class: 'count-tag', text: items.length })]),
      remList(items, hoy)
    ]);
  }

  function remList(items, hoy) {
    return el('div', { class: 'rem-list' }, items.map(function (it) { return remItem(it, hoy); }));
  }

  function remItem(it, hoy) {
    if (it.auto) return autoItem(it, hoy);
    var r = it.r;
    var status = it.status || reminderStatus(r, hoy);
    var occ = it.date || r.fecha;
    var isDone = occDone(r, occ) || status === 'done';
    var repTxt = (r.repeat && r.repeat !== 'none') ? ' · ↻ ' + remRepeatLabel(r.repeat) : '';
    var when;
    if (status === 'overdue') when = 'Venció · ' + fmt.relative(r.fecha);
    else if (status === 'today') when = 'Hoy' + (r.hora ? ' · ' + r.hora : '');
    else if (status === 'done') when = 'Completado';
    else when = fmt.date(occ) + (r.hora ? ' · ' + r.hora : '');

    var check = el('button', {
      class: 'rem-check' + (isDone ? ' is-done' : ''),
      title: isDone ? 'Marcar como pendiente' : 'Marcar como hecho',
      text: isDone ? '✓' : '',
      onclick: function (e) { e.preventDefault(); e.stopPropagation(); store.toggleReminderOccurrence(r.id, occ); }
    });
    var del = el('button', {
      class: 'icon-btn rem-del', title: 'Eliminar', html: '&times;',
      onclick: function (e) {
        e.preventDefault(); e.stopPropagation();
        ui.confirm({ title: 'Eliminar recordatorio', message: '¿Eliminar "' + r.titulo + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeReminder(r.id); ui.toast('Recordatorio eliminado'); } });
      }
    });
    return el('div', { class: 'rem-item rem-' + status + (isDone ? ' is-done' : '') }, [
      check,
      el('div', { class: 'rem-item-body', onclick: function () { App.forms.reminderForm(r); } }, [
        el('div', { class: 'rem-item-title' }, [
          el('span', { class: 'rem-ico', text: remIcon(r.tipo) }),
          el('span', { class: 'rem-item-name', text: r.titulo })
        ]),
        el('div', { class: 'rem-item-meta', text: when + ' · ' + remTipoLabel(r.tipo) + repTxt }),
        r.nota ? el('div', { class: 'rem-item-note', text: r.nota }) : null
      ]),
      del
    ]);
  }

  function autoItem(e, hoy) {
    var ico = e.kind === 'pagar' ? '💳' : (e.kind === 'cobrar' ? '💰' : '🔖');
    var name = e.kind === 'pagar' ? ('Pagar cuota ' + e.cuota.numero + ' — ' + store.vehicleName(e.vehicle))
      : e.kind === 'cobrar' ? ('Te tienen que pagar la cuota ' + e.cuota.numero + ' — ' + store.vehicleName(e.vehicle))
      : ('Vence la reserva de ' + store.vehicleName(e.vehicle) + (e.vehicle.reservation.cliente ? ' (' + e.vehicle.reservation.cliente.nombre + ')' : ''));
    var when = e.status === 'overdue' ? ('Venció · ' + fmt.relative(e.date)) : (e.status === 'today' ? 'Vence hoy' : ('Vence ' + fmt.date(e.date)));
    var meta = when + (e.monto ? ' · ' + fmt.money(e.monto, e.moneda) : '') +
      (e.kind === 'cobrar' ? ' · te lo pagan a vos' : (e.kind === 'pagar' ? ' · lo pagás vos' : ''));
    var action = null;
    if (e.kind === 'pagar') action = el('button', { class: 'btn btn-sm btn-primary', text: 'Pagué', onclick: function (ev) { ev.preventDefault(); ev.stopPropagation(); store.pagarCuota(e.vehicle.id, e.cuota.id, hoy); ui.toast('Cuota pagada', 'success'); } });
    else if (e.kind === 'cobrar') action = el('button', { class: 'btn btn-sm btn-primary', text: 'Me pagaron', onclick: function (ev) { ev.preventDefault(); ev.stopPropagation(); store.cobrarCuotaVenta(e.vehicle.id, e.cuota.id, hoy); ui.toast('Cobro registrado', 'success'); } });
    return el('div', { class: 'rem-item rem-' + e.status + ' rem-auto' }, [
      el('span', { class: 'rem-ico rem-auto-ico', text: ico }),
      el('a', { class: 'rem-item-body', href: '#/vehiculo/' + e.vehicle.id }, [
        el('div', { class: 'rem-item-title' }, [el('span', { class: 'rem-item-name', text: name })]),
        el('div', { class: 'rem-item-meta', text: meta })
      ]),
      action
    ]);
  }

  function calendarCard(hoy) {
    var card = el('div', { class: 'card rem-cal-card' });
    var y = remCal.y, m = remCal.m;
    var first = new Date(y, m, 1);

    card.appendChild(el('div', { class: 'rem-cal-head' }, [
      el('button', { class: 'icon-btn', html: '‹', 'aria-label': 'Mes anterior', onclick: function () { stepMonth(-1); } }),
      el('h3', { text: fin.MESES_LARGO[m] + ' ' + y }),
      el('button', { class: 'icon-btn', html: '›', 'aria-label': 'Mes siguiente', onclick: function () { stepMonth(1); } })
    ]));

    var grid = el('div', { class: 'rem-cal-grid' });
    ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'].forEach(function (d) { grid.appendChild(el('div', { class: 'rem-cal-dow', text: d })); });
    var startDow = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < startDow; i++) grid.appendChild(el('div', { class: 'rem-cal-cell is-empty' }));
    var reminders = store.getReminders();
    var events = autoEvents(hoy, true);
    function dayItems(dayIso) {
      var st = dayIso < hoy ? 'overdue' : (dayIso === hoy ? 'today' : 'upcoming');
      var rems = reminders.filter(function (r) { return reminderOnDay(r, dayIso); })
        .map(function (r) { return { r: r, date: dayIso, status: occDone(r, dayIso) ? 'done' : st }; });
      var evs = events.filter(function (e) { return e.date === dayIso; });
      return rems.concat(evs);
    }
    for (var day = 1; day <= daysInMonth; day++) {
      (function (day) {
        var dayIso = isoOf(new Date(y, m, day));
        var items = dayItems(dayIso);
        var hasPend = items.some(function (x) { return x.auto ? true : !occDone(x.r, dayIso); });
        grid.appendChild(el('button', {
          class: 'rem-cal-cell' + (dayIso === hoy ? ' is-today' : '') + (dayIso === remCal.sel ? ' is-sel' : '') + (items.length ? ' has-rem' : ''),
          onclick: function () { remCal.sel = dayIso; App.router.render(); }
        }, [
          el('span', { class: 'rem-cal-num', text: day }),
          items.length ? el('span', { class: 'rem-cal-dot' + (hasPend ? '' : ' is-done'), text: items.length > 1 ? String(items.length) : '' }) : null
        ]));
      })(day);
    }
    card.appendChild(grid);

    var selItems = dayItems(remCal.sel).sort(function (a, x) {
      var ha = (a.r && a.r.hora) || '99:99', hx = (x.r && x.r.hora) || '99:99';
      return ha.localeCompare(hx);
    });
    card.appendChild(el('div', { class: 'rem-cal-day' }, [
      el('div', { class: 'rem-cal-day-head' }, [
        el('strong', { text: fmt.dateLong(remCal.sel) }),
        el('button', { class: 'btn btn-sm btn-ghost', html: '<span>＋</span> Recordatorio', onclick: function () { App.forms.reminderForm(null, remCal.sel); } })
      ]),
      selItems.length ? remList(selItems, hoy) : el('p', { class: 'form-help', text: 'Nada este día.' })
    ]));
    return card;

    function stepMonth(delta) {
      var nm = remCal.m + delta;
      remCal.y += Math.floor(nm / 12);
      remCal.m = ((nm % 12) + 12) % 12;
      App.router.render();
    }
  }

  /* ============================== ECONOMÍA ============================ */
  // Agrupa, en pestañas, las secciones que antes eran páginas propias del
  // menú (Situación económica = ex "Finanzas", Gastos del negocio, Cuotas
  // y cobros, Comparación dólar). Cada pestaña reutiliza tal cual la vista
  // que ya existía (misma función, mismos datos, misma lógica) — acá solo
  // se decide en qué contenedor se dibuja. "Resúmenes" es una página aparte
  // (misma info, otra forma de mirarla) a la que se llega con el botón de

      ]),
