<script>
/* ===== js/store.js ===== */
/* ============================================================================
 * store.js  —  Estado global, persistencia y operaciones de datos
 * ----------------------------------------------------------------------------
 * Toda la aplicación comparte un único objeto `state` que se guarda en
 * localStorage. Cualquier módulo que necesite modificar datos DEBE hacerlo a
 * través de las funciones expuestas en `App.store`, que se encargan de:
 *   - mantener la consistencia entre módulos,
 *   - registrar los movimientos en el historial general,
 *   - persistir y emitir el evento `state:change` para re-renderizar la vista.
 * ==========================================================================*/
(function () {
  'use strict';

  var STORAGE_KEY = 'paginaToto:v1';
  var SCHEMA_VERSION = 1;

  /* ----------------------------- Estado base ------------------------------ */
  function emptyState() {
    return {
      schema: SCHEMA_VERSION,
      vehicles: [],       // ver estructura en createVehicle()
      history: [],         // movimientos cronológicos { id, ts, fecha, tipo, vehicleId, titulo, detalle, monto, moneda, meta }
      reminders: [],       // recordatorios del calendario { id, titulo, fecha, hora, tipo, nota, repeat, doneDates, createdAt }
      fixedExpenses: [],   // gastos fijos del negocio { id, concepto, categoria, monto, moneda, cotizacionUSD, frecuencia, fecha, hasta, notas }
      settings: {
        dolarActual: 1600,           // cotización actual (editable por el usuario, sólo para comparaciones)
        diasStockAlerta: 60,          // umbral de "muchos días en stock"
        cuotaProximaDias: 7           // umbral de "cuota próxima a vencer"
      },
      meta: { createdAt: Date.now(), lastId: 0, lastBackupAt: null }
    };
  }

  var state = emptyState();
  var listeners = [];

  /* ----------------------------- Utilidades ------------------------------- */
  // id único sin depender de un contador compartido (importante para multi-usuario)
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  // convierte a entero o null (nunca deja NaN guardado, p.ej. si alguien escribe letras en
  // Año/Km; tampoco un negativo, que no tiene sentido para ninguno de los dos campos)
  function toIntOrNull(x) {
    if (x === '' || x == null || !/[0-9]/.test(String(x))) return null;
    var n = Math.round(num(x));
    if (isNaN(n) || n < 0) return null;
    return n;
  }

  /* --------------------------- Persistencia ------------------------------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { state = emptyState(); save(); takeSnapshot(); return; }
      var parsed = JSON.parse(raw);
      state = migrate(parsed);
      takeSnapshot();   // copia de seguridad interna (1 por día, últimas 5)
    } catch (err) {
      console.error('No se pudo cargar el estado, se inicia vacío:', err);
      state = emptyState();
    }
  }

  /* -------------------- Copias internas (anti "borré todo") ------------- */
  var SNAP_KEY = 'paginaToto:snapshots';
  function takeSnapshot() {
    try {
      var arr = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
      var hoy = todayISO();
      if (arr.length && arr[arr.length - 1].fecha === hoy) return;
      arr.push({ ts: Date.now(), fecha: hoy, data: JSON.stringify(state) });
      while (arr.length > 5) arr.shift();
      localStorage.setItem(SNAP_KEY, JSON.stringify(arr));
    } catch (e) { /* si no entra en el almacenamiento, se ignora */ }
  }
  function getSnapshots() {
    try {
      return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]')
        .map(function (s) { return { ts: s.ts, fecha: s.fecha, autos: (JSON.parse(s.data).vehicles || []).length }; })
        .sort(function (a, b) { return b.ts - a.ts; });
    } catch (e) { return []; }
  }
  function restoreSnapshot(ts) {
    try {
      var arr = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
      var s = arr.filter(function (x) { return x.ts === ts; })[0];
      if (!s) return false;
      takeSnapshot();
      state = migrate(JSON.parse(s.data));
      emit();
      return true;
    } catch (e) { return false; }
  }
  function markBackup() {
    state.meta.lastBackupAt = Date.now();
    save();
  }

  function save() {
    // modo local (archivo) y respaldo local del modo online: localStorage.
    // En modo online esto es sólo una copia de resguardo por si el dispositivo
    // se queda sin conexión antes de poder subir los cambios a la nube; nunca
    // reemplaza la sincronización en sí.
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.error('No se pudo guardar el estado:', err);
      App.ui && App.ui.toast('Error al guardar. ¿Almacenamiento lleno?', 'error');
    }
    // modo online (multi-usuario): además, guardar en la nube
    if (App.data && App.data.onLocalChange) App.data.onLocalChange(state);
  }

  // reemplaza el estado completo (usado por la sincronización con la nube). No guarda.
  function hydrate(newState) {
    state = migrate(newState || emptyState());
    listeners.forEach(function (fn) { try { fn(state); } catch (e) { console.error(e); } });
  }
  function notify() {
    listeners.forEach(function (fn) { try { fn(state); } catch (e) { console.error(e); } });
  }

  function migrate(parsed) {
    var base = emptyState();
    if (!parsed || typeof parsed !== 'object') return base;
    // merge superficial + defaults
    base.vehicles = Array.isArray(parsed.vehicles) ? parsed.vehicles : [];
    base.history = Array.isArray(parsed.history) ? parsed.history : [];
    base.reminders = Array.isArray(parsed.reminders) ? parsed.reminders : [];
    base.fixedExpenses = Array.isArray(parsed.fixedExpenses) ? parsed.fixedExpenses : [];
    base.settings = Object.assign({}, base.settings, parsed.settings || {});
    base.meta = Object.assign({}, base.meta, parsed.meta || {});
    base.schema = SCHEMA_VERSION;
    // normalización defensiva
    base.vehicles.forEach(normalizeVehicle);
    base.reminders.forEach(normalizeReminder);
    base.fixedExpenses.forEach(normalizeFixedExpense);
    return base;
  }

  function normalizeReminder(r) {
    r.id = r.id || uid('r');
    r.titulo = (r.titulo || '').trim();
    r.fecha = r.fecha || todayISO();
    r.hora = r.hora || '';
    r.tipo = r.tipo || 'tarea';
    r.nota = r.nota || '';
    r.repeat = r.repeat || 'none';
    // nuevo modelo: doneDates = lista de fechas de ocurrencias completadas
    r.doneDates = Array.isArray(r.doneDates) ? r.doneDates : [];
    if (r.done && !r.doneDates.length) {
      r.doneDates.push(r.doneAt ? new Date(r.doneAt).toISOString().slice(0, 10) : r.fecha);
    }
    delete r.done; delete r.doneAt;
    if (!r.createdAt) r.createdAt = Date.now();
    return r;
  }

  function normalizeFixedExpense(f) {
    f.id = f.id || uid('f');
    f.concepto = (f.concepto || '').trim();
    f.categoria = f.categoria || 'otro';
    f.monto = num(f.monto);
    f.moneda = f.moneda || 'ARS';
    if (typeof f.cotizacionUSD === 'undefined') f.cotizacionUSD = null;
    f.frecuencia = f.frecuencia === 'mensual' ? 'mensual' : 'unica';
    f.fecha = f.fecha || todayISO();
    f.hasta = f.hasta || '';
    f.notas = (f.notas || '').trim();
    if (!f.createdAt) f.createdAt = Date.now();
    return f;
  }

  function normComision(c) {
    if (!c || !num(c.monto)) return null;
    return {
      persona: (c.persona || '').trim(),
      monto: num(c.monto),
      moneda: c.moneda || 'ARS',
      pagada: !!c.pagada,
      fechaPago: c.fechaPago || null
    };
  }

  // Consignación: precioDueno/cotizacionUSD llegan del formulario como texto
  // (posiblemente con separador de miles, ej. "10.000") — hay que pasarlos
  // por num() antes de guardarlos, igual que ya se hace con cualquier otro
  // importe (precio de compra/venta, gastos, cuotas), para que finance.js
  // los pueda usar como números reales.
  function normalizeOrigin(o) {
    if (!o) return { type: 'compra' };
    if (o.type === 'consignacion') {
      if (o.precioDueno != null && o.precioDueno !== '') o.precioDueno = num(o.precioDueno); else o.precioDueno = 0;
      if (o.cotizacionUSD != null && o.cotizacionUSD !== '') o.cotizacionUSD = num(o.cotizacionUSD); else o.cotizacionUSD = null;
    }
    return o;
  }

  function normalizeVehicle(v) {
    v.anio = toIntOrNull(v.anio);
    v.km = toIntOrNull(v.km);
    v.fotos = Array.isArray(v.fotos) ? v.fotos : [];
    v.expenses = Array.isArray(v.expenses) ? v.expenses : [];
    v.checklist = v.checklist || {};
    v.estado = v.estado || 'stock';
    v.documentacion = v.documentacion || 'pendiente';
    v.observaciones = v.observaciones || '';
    v.precioPretendido = (v.precioPretendido != null && v.precioPretendido !== '') ? num(v.precioPretendido) : null;
    if (!v.purchase) v.purchase = null;
    if (!v.sale) v.sale = null;
    if (typeof v.reservation === 'undefined') v.reservation = null;
    if (v.purchase) {
      v.purchase.cuotas = Array.isArray(v.purchase.cuotas) ? v.purchase.cuotas : [];
      v.purchase.comision = normComision(v.purchase.comision);
    }
    if (v.sale) {
      v.sale.comision = normComision(v.sale.comision);
      if (v.sale.financiacion) {
        v.sale.financiacion.cuotas = Array.isArray(v.sale.financiacion.cuotas) ? v.sale.financiacion.cuotas : [];
      } else v.sale.financiacion = null;
    }
    v.origin = normalizeOrigin(v.origin);
    if (typeof v.deleted !== 'boolean') v.deleted = false;
    return v;
  }

  /* ------------------------------ Listeners ------------------------------- */
  function subscribe(fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (l) { return l !== fn; }); }; }
  function emit() { save(); listeners.forEach(function (fn) { try { fn(state); } catch (e) { console.error(e); } }); }

  /* --------------------------- Historial general ------------------------- */
  function logEvent(evt) {
    var e = {
      id: uid('h'),
      ts: Date.now(),
      fecha: evt.fecha || todayISO(),
      tipo: evt.tipo,                 // compra | venta | gasto | cuota | estado | edicion | parte-pago | papelera | restaurar | otro
      vehicleId: evt.vehicleId || null,
      titulo: evt.titulo || '',
      detalle: evt.detalle || '',
      monto: (typeof evt.monto === 'number') ? evt.monto : null,
      moneda: evt.moneda || null,
      meta: evt.meta || {}
    };
    state.history.push(e);
    return e;
  }

  /* --------------------------- CRUD Vehículos ---------------------------- */
  function createVehicle(data, opts) {
    opts = opts || {};
    var v = {
      id: uid('v'),
      marca: (data.marca || '').trim(),
      modelo: (data.modelo || '').trim(),
      anio: toIntOrNull(data.anio),
      patente: (data.patente || '').trim().toUpperCase(),
      km: toIntOrNull(data.km),
      combustible: data.combustible || '',
      caja: data.caja || '',
      version: (data.version || '').trim(),
      precioPretendido: data.precioPretendido != null && data.precioPretendido !== '' ? num(data.precioPretendido) : null,
      precioPretendidoMoneda: data.precioPretendidoMoneda || 'ARS',
      fotoPrincipal: '',
      fotos: [],
      estado: data.estado || 'stock',
      documentacion: data.documentacion || 'pendiente',
      observaciones: data.observaciones || '',
      checklist: data.checklist || {},
      purchase: null,
      sale: null,
      reservation: null,
      expenses: [],
      origin: normalizeOrigin(data.origin || { type: 'compra' }),
      deleted: false,
      deletedAt: null,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    state.vehicles.push(v);
    if (!opts.silent) {
      logEvent({
        tipo: 'otro', vehicleId: v.id, fecha: todayISO(),
        titulo: 'Registraste ' + vehicleName(v),
        detalle: 'Vehículo agregado al sistema' + (v.origin.type === 'parte-de-pago' ? ' (recibido como parte de pago)' : '')
      });
    }
    emit();
    return v;
  }

  function updateVehicle(id, patch, opts) {
    opts = opts || {};
    var v = getVehicle(id);
    if (!v) return null;
    var before = deepClone(v);
    Object.keys(patch).forEach(function (k) { v[k] = patch[k]; });
    if (v.patente) v.patente = String(v.patente).toUpperCase().trim();
    v.updatedAt = Date.now();
    normalizeVehicle(v);
    if (!opts.silent) {
      var changed = describeChanges(before, v);
      if (before.estado !== v.estado) {
        logEvent({ tipo: 'estado', vehicleId: v.id, titulo: 'Cambiaste el estado de ' + vehicleName(v), detalle: estadoLabel(before.estado) + ' → ' + estadoLabel(v.estado) });
      }
      if (changed.length && (before.estado === v.estado)) {
        logEvent({ tipo: 'edicion', vehicleId: v.id, titulo: 'Editaste ' + vehicleName(v), detalle: changed.join(', ') });
      }
    }
    emit();
    return v;
  }

  function describeChanges(a, b) {
    var fields = { marca: 'marca', modelo: 'modelo', anio: 'año', patente: 'patente', km: 'km', combustible: 'combustible', caja: 'caja', version: 'versión', documentacion: 'documentación', observaciones: 'observaciones' };
    var out = [];
    Object.keys(fields).forEach(function (f) {
      if (JSON.stringify(a[f]) !== JSON.stringify(b[f])) out.push(fields[f]);
    });
    return out;
  }

  function softDeleteVehicle(id) {
    var v = getVehicle(id);
    if (!v) return;
    v.deleted = true;
    v.deletedAt = Date.now();
    logEvent({ tipo: 'papelera', vehicleId: v.id, titulo: 'Enviaste a papelera ' + vehicleName(v), detalle: 'El vehículo puede restaurarse desde la Papelera' });
    emit();
  }

  function restoreVehicle(id) {
    var v = getVehicle(id);
    if (!v) return;
    v.deleted = false;
    v.deletedAt = null;
    logEvent({ tipo: 'restaurar', vehicleId: v.id, titulo: 'Restauraste ' + vehicleName(v), detalle: 'El vehículo volvió al sistema' });
    emit();
  }

  function hardDeleteVehicle(id) {
    var v = getVehicle(id);
    if (!v) return;
    state.vehicles = state.vehicles.filter(function (x) { return x.id !== id; });
    // limpiar referencias de parte de pago (en ambos sentidos, para que ninguna
    // relación quede apuntando a un vehículo que ya no existe)
    state.vehicles.forEach(function (x) {
      if (x.sale && x.sale.tradeIn && x.sale.tradeIn.vehicleId === id) x.sale.tradeIn.vehicleId = null;
      if (x.origin && x.origin.type === 'parte-de-pago' && x.origin.saleVehicleId === id) x.origin.saleVehicleId = null;
    });
    state.history = state.history.filter(function (h) { return h.vehicleId !== id; });
    emit();
  }

  /* --------------------------- Registrar compra ------------------------- */
  function setPurchase(id, purchase) {
    var v = getVehicle(id);
    if (!v) return null;
    var esNuevo = !v.purchase;
    v.purchase = {
      fecha: purchase.fecha || todayISO(),
      precio: num(purchase.precio),
      moneda: purchase.moneda || 'ARS',
      // cotización histórica al momento de la compra; para compras en USD sin dato, se fija la cotización actual como referencia
      cotizacionUSD: num(purchase.cotizacionUSD) || (purchase.moneda === 'USD' ? state.settings.dolarActual : null),
      formaPago: purchase.formaPago || 'transferencia',
      montoTransferencia: num(purchase.montoTransferencia) || 0,
      montoEfectivo: num(purchase.montoEfectivo) || 0,
      cuotas: normalizeCuotas(purchase.cuotas),
      proveedor: purchase.proveedor && (purchase.proveedor.nombre || purchase.proveedor.telefono || purchase.proveedor.notas)
        ? { nombre: (purchase.proveedor.nombre || '').trim(), telefono: (purchase.proveedor.telefono || '').trim(), notas: (purchase.proveedor.notas || '').trim() }
        : null,
      comision: normComision(purchase.comision)
    };
    v.updatedAt = Date.now();
    logEvent({
      tipo: 'compra', vehicleId: v.id, fecha: v.purchase.fecha,
      titulo: (esNuevo ? 'Compraste ' : 'Actualizaste la compra de ') + vehicleName(v),
      detalle: 'Precio: ' + App.fmt.money(v.purchase.precio, v.purchase.moneda) +
        (v.purchase.moneda === 'ARS' && v.purchase.cotizacionUSD ? ' · Dólar: ' + App.fmt.money(v.purchase.cotizacionUSD, 'ARS') : '') +
        ' · ' + formaPagoLabel(v.purchase.formaPago),
      monto: v.purchase.precio, moneda: v.purchase.moneda
    });
    emit();
    return v;
  }

  function normalizeCuotas(cuotas) {
    if (!Array.isArray(cuotas)) return [];
    return cuotas.map(function (c, i) {
      return {
        id: c.id || uid('c'),
        numero: c.numero || (i + 1),
        monto: num(c.monto),
        vencimiento: c.vencimiento || '',
        pagada: !!c.pagada,
        fechaPago: c.fechaPago || null
      };
    });
  }

  // cuotas que TE tienen que pagar (venta financiada)
  function normalizeCuotasCobro(cuotas) {
    if (!Array.isArray(cuotas)) return [];
    return cuotas.map(function (c, i) {
      return {
        id: c.id || uid('cc'),
        numero: c.numero || (i + 1),
        monto: num(c.monto),
        vencimiento: c.vencimiento || '',
        cobrada: !!c.cobrada,
        fechaCobro: c.fechaCobro || null
      };
    });
  }

  function pagarCuota(vehicleId, cuotaId, fechaPago) {
    var v = getVehicle(vehicleId);
    if (!v || !v.purchase) return;
    var c = (v.purchase.cuotas || []).filter(function (x) { return x.id === cuotaId; })[0];
    if (!c) return;
    c.pagada = true;
    c.fechaPago = fechaPago || todayISO();
    logEvent({
      tipo: 'cuota', vehicleId: v.id, fecha: c.fechaPago,
      titulo: 'Pagaste la cuota ' + c.numero + '/' + v.purchase.cuotas.length + ' de ' + vehicleName(v),
      detalle: App.fmt.money(c.monto, v.purchase.moneda),
      monto: c.monto, moneda: v.purchase.moneda
    });
    emit();
  }

  function desmarcarCuota(vehicleId, cuotaId) {
    var v = getVehicle(vehicleId);
    if (!v || !v.purchase) return;
    var c = (v.purchase.cuotas || []).filter(function (x) { return x.id === cuotaId; })[0];
    if (!c) return;
    c.pagada = false;
    c.fechaPago = null;
    emit();
  }

  /* ---------------------------- Registrar venta ------------------------- */
  function setSale(id, sale) {
    var v = getVehicle(id);
    if (!v) return null;
    var esNuevo = !v.sale;

    var tradeIn = null;
    if (sale.tradeIn && sale.tradeIn.enabled) {
      tradeIn = {
        vehicleId: sale.tradeIn.vehicleId || null,
        marca: (sale.tradeIn.marca || '').trim(),
        modelo: (sale.tradeIn.modelo || '').trim(),
        anio: toIntOrNull(sale.tradeIn.anio),
        patente: (sale.tradeIn.patente || '').trim().toUpperCase(),
        km: toIntOrNull(sale.tradeIn.km),
        valor: num(sale.tradeIn.valor),
        moneda: sale.tradeIn.moneda || 'ARS',
        observaciones: (sale.tradeIn.observaciones || '').trim(),
        fotos: []
      };
    }

    var financiacion = null;
    if (sale.financiacion && sale.financiacion.enabled) {
      financiacion = {
        entidad: (sale.financiacion.entidad || '').trim(),
        entrega: num(sale.financiacion.entrega) || 0,
        moneda: sale.financiacion.moneda || sale.moneda || 'ARS',
        cuotas: normalizeCuotasCobro(sale.financiacion.cuotas),
        notas: (sale.financiacion.notas || '').trim()
      };
    }

    v.sale = {
      fecha: sale.fecha || todayISO(),
      precio: num(sale.precio),
      moneda: sale.moneda || 'ARS',
      cotizacionUSD: num(sale.cotizacionUSD) || (sale.moneda === 'USD' ? state.settings.dolarActual : null),
      formaCobro: sale.formaCobro || 'transferencia',
      montoTransferencia: num(sale.montoTransferencia) || 0,
      montoEfectivo: num(sale.montoEfectivo) || 0,
      cliente: sale.cliente && (sale.cliente.nombre || sale.cliente.telefono || sale.cliente.notas)
        ? { nombre: (sale.cliente.nombre || '').trim(), telefono: (sale.cliente.telefono || '').trim(), notas: (sale.cliente.notas || '').trim() }
        : null,
      tradeIn: tradeIn,
      financiacion: financiacion,
      comision: normComision(sale.comision),
      diferencia: sale.diferencia && sale.diferencia.monto != null
        ? {
            monto: num(sale.diferencia.monto), moneda: sale.diferencia.moneda || 'ARS',
            montoEfectivo: num(sale.diferencia.montoEfectivo) || 0,
            montoTransferencia: num(sale.diferencia.montoTransferencia) || 0
          }
        : null
    };
    v.estado = 'vendido';
    v.updatedAt = Date.now();

    // Crear el vehículo recibido como parte de pago e incorporarlo al stock
    if (tradeIn && !tradeIn.vehicleId) {
      var nuevo = createVehicle({
        marca: tradeIn.marca, modelo: tradeIn.modelo, anio: tradeIn.anio,
        patente: tradeIn.patente, km: tradeIn.km,
        observaciones: tradeIn.observaciones,
        estado: 'stock',
        origin: { type: 'parte-de-pago', saleVehicleId: v.id }
      }, { silent: true });
      // registrar la "compra" implícita del vehículo recibido, al valor asignado
      nuevo.purchase = {
        fecha: v.sale.fecha,
        precio: tradeIn.valor,
        moneda: tradeIn.moneda,
        cotizacionUSD: v.sale.cotizacionUSD || state.settings.dolarActual,
        formaPago: 'parte-de-pago',
        montoTransferencia: 0, montoEfectivo: 0, cuotas: [],
        proveedor: v.sale.cliente ? { nombre: v.sale.cliente.nombre, telefono: v.sale.cliente.telefono, notas: 'Entregado como parte de pago por ' + vehicleName(v) } : null
      };
      tradeIn.vehicleId = nuevo.id;
      logEvent({
        tipo: 'parte-pago', vehicleId: nuevo.id, fecha: v.sale.fecha,
        titulo: 'Ingresó ' + vehicleName(nuevo) + ' como parte de pago',
        detalle: 'Valor asignado: ' + App.fmt.money(tradeIn.valor, tradeIn.moneda) + ' · Operación: venta de ' + vehicleName(v),
        monto: tradeIn.valor, moneda: tradeIn.moneda, meta: { saleVehicleId: v.id }
      });
    }

    logEvent({
      tipo: 'venta', vehicleId: v.id, fecha: v.sale.fecha,
      titulo: (esNuevo ? 'Vendiste ' : 'Actualizaste la venta de ') + vehicleName(v),
      detalle: 'Precio: ' + App.fmt.money(v.sale.precio, v.sale.moneda) +
        (v.sale.moneda === 'ARS' && v.sale.cotizacionUSD ? ' · Dólar: ' + App.fmt.money(v.sale.cotizacionUSD, 'ARS') : '') +
        (tradeIn ? ' · + vehículo recibido' : ''),
      monto: v.sale.precio, moneda: v.sale.moneda
    });
    emit();
    return v;
  }

  function cancelarVenta(id) {
    var v = getVehicle(id);
    if (!v || !v.sale) return;
    // si había un vehículo generado como parte de pago y no fue tocado, se envía a papelera
    if (v.sale.tradeIn && v.sale.tradeIn.vehicleId) {
      var ti = getVehicle(v.sale.tradeIn.vehicleId);
      if (ti && !ti.sale && !ti.reservation && (ti.expenses || []).length === 0) {
        ti.deleted = true; ti.deletedAt = Date.now();
      }
    }
    v.sale = null;
    v.estado = v.reservation ? 'reservado' : 'stock';
    logEvent({ tipo: 'estado', vehicleId: v.id, titulo: 'Anulaste la venta de ' + vehicleName(v), detalle: 'El vehículo volvió a ' + estadoLabel(v.estado).toLowerCase() });
    emit();
  }

  /* ------------------------------ Reserva / seña ---------------------- */
  function setReservation(id, data) {
    var v = getVehicle(id);
    if (!v) return null;
    var esNuevo = !v.reservation;
    v.reservation = {
      fecha: data.fecha || todayISO(),
      monto: num(data.monto),
      moneda: data.moneda || 'ARS',
      cotizacionUSD: num(data.cotizacionUSD) || (data.moneda === 'USD' ? state.settings.dolarActual : null),
      vence: data.vence || '',
      cliente: (data.cliente && (data.cliente.nombre || data.cliente.telefono))
        ? { nombre: (data.cliente.nombre || '').trim(), telefono: (data.cliente.telefono || '').trim() }
        : null,
      notas: (data.notas || '').trim()
    };
    if (v.estado === 'stock') v.estado = 'reservado';
    v.updatedAt = Date.now();
    logEvent({
      tipo: 'reserva', vehicleId: v.id, fecha: v.reservation.fecha,
      titulo: (esNuevo ? 'Reservaste ' : 'Actualizaste la reserva de ') + vehicleName(v),
      detalle: 'Seña ' + App.fmt.money(v.reservation.monto, v.reservation.moneda) +
        (v.reservation.cliente ? ' · ' + v.reservation.cliente.nombre : '') +
        (v.reservation.vence ? ' · vence ' + App.fmt.date(v.reservation.vence) : ''),
      monto: v.reservation.monto, moneda: v.reservation.moneda
    });
    emit();
    return v;
  }
  function cancelReservation(id) {
    var v = getVehicle(id);
    if (!v || !v.reservation) return;
    v.reservation = null;
    if (v.estado === 'reservado') v.estado = 'stock';
    logEvent({ tipo: 'estado', vehicleId: v.id, titulo: 'Cancelaste la reserva de ' + vehicleName(v), detalle: 'El vehículo volvió a stock' });
    emit();
  }

  /* ----------------- Cuotas a cobrar (venta financiada) ------------- */
  function cobrarCuotaVenta(vehicleId, cuotaId, fecha) {
    var v = getVehicle(vehicleId);
    if (!v || !v.sale || !v.sale.financiacion) return;
    var c = (v.sale.financiacion.cuotas || []).filter(function (x) { return x.id === cuotaId; })[0];
    if (!c) return;
    c.cobrada = true;
    c.fechaCobro = fecha || todayISO();
    logEvent({
      tipo: 'cobro', vehicleId: v.id, fecha: c.fechaCobro,
      titulo: 'Cobraste la cuota ' + c.numero + '/' + v.sale.financiacion.cuotas.length + ' de ' + vehicleName(v),
      detalle: App.fmt.money(c.monto, v.sale.financiacion.moneda),
      monto: c.monto, moneda: v.sale.financiacion.moneda
    });
    emit();
  }
  function descobrarCuotaVenta(vehicleId, cuotaId) {
    var v = getVehicle(vehicleId);
    if (!v || !v.sale || !v.sale.financiacion) return;
    var c = (v.sale.financiacion.cuotas || []).filter(function (x) { return x.id === cuotaId; })[0];
    if (!c) return;
    c.cobrada = false; c.fechaCobro = null;
    emit();
  }

  /* ------------------------------- Gastos ------------------------------- */
  function addExpense(vehicleId, expense) {
    var v = getVehicle(vehicleId);
    if (!v) return;
    var e = {
      id: uid('g'),
      monto: num(expense.monto),
      moneda: expense.moneda || 'ARS',
      fecha: expense.fecha || todayISO(),
      cotizacionUSD: num(expense.cotizacionUSD) || null,
      observacion: (expense.observacion || '').trim(),
      createdAt: Date.now()
    };
    v.expenses.push(e);
    v.updatedAt = Date.now();
    logEvent({
      tipo: 'gasto', vehicleId: v.id, fecha: e.fecha,
      titulo: 'Agregaste un gasto a ' + vehicleName(v),
      detalle: App.fmt.money(e.monto, e.moneda) + (e.observacion ? ' · ' + e.observacion : ''),
      monto: e.monto, moneda: e.moneda
    });
    emit();
    return e;
  }

  function updateExpense(vehicleId, expenseId, patch) {
    var v = getVehicle(vehicleId);
    if (!v) return;
    var e = v.expenses.filter(function (x) { return x.id === expenseId; })[0];
    if (!e) return;
    Object.assign(e, patch);
    e.monto = num(e.monto);
    v.updatedAt = Date.now();
    emit();
  }

  function removeExpense(vehicleId, expenseId) {
    var v = getVehicle(vehicleId);
    if (!v) return;
    v.expenses = v.expenses.filter(function (x) { return x.id !== expenseId; });
    v.updatedAt = Date.now();
    logEvent({ tipo: 'gasto', vehicleId: v.id, titulo: 'Eliminaste un gasto de ' + vehicleName(v), detalle: '' });
    emit();
  }

  /* --------------------- Gastos fijos del negocio -------------------- */
  function getFixedExpenses() { return (state.fixedExpenses || []).slice(); }
  function getFixedExpense(id) { return (state.fixedExpenses || []).filter(function (f) { return f.id === id; })[0] || null; }
  function addFixedExpense(data) {
    if (!state.fixedExpenses) state.fixedExpenses = [];
    var f = normalizeFixedExpense({
      concepto: data.concepto, categoria: data.categoria, monto: data.monto, moneda: data.moneda,
      cotizacionUSD: data.cotizacionUSD, frecuencia: data.frecuencia, fecha: data.fecha, hasta: data.hasta, notas: data.notas
    });
    state.fixedExpenses.push(f);
    logEvent({
      tipo: 'gasto-fijo', fecha: f.fecha,
      titulo: 'Gasto del negocio: ' + (f.concepto || categoriaLabel(f.categoria)),
      detalle: App.fmt.money(f.monto, f.moneda) + (f.frecuencia === 'mensual' ? ' · por mes' : ' · una vez'),
      monto: f.monto, moneda: f.moneda
    });
    emit();
    return f;
  }
  function updateFixedExpense(id, patch) {
    var f = getFixedExpense(id);
    if (!f) return null;
    Object.keys(patch).forEach(function (k) { f[k] = patch[k]; });
    normalizeFixedExpense(f);
    emit();
    return f;
  }
  function removeFixedExpense(id) {
    state.fixedExpenses = (state.fixedExpenses || []).filter(function (f) { return f.id !== id; });
    emit();
  }
  function categoriaLabel(c) {
    return ({ alquiler: 'Alquiler del local', sueldos: 'Sueldos', seguros: 'Seguros / flota', patentes: 'Patentes e impuestos', servicios: 'Servicios (luz, internet…)', publicidad: 'Publicidad', otro: 'Otro' })[c] || c;
  }

  /* ------------------------------ Settings ------------------------------ */
  function updateSettings(patch) {
    Object.assign(state.settings, patch);
    if (patch.dolarActual != null) state.settings.dolarActual = num(patch.dolarActual);
    emit();
  }

  /* ---------------------------- Recordatorios ------------------------- */
  function getReminders() { return (state.reminders || []).slice(); }
  function getReminder(id) { return (state.reminders || []).filter(function (r) { return r.id === id; })[0] || null; }
  function addReminder(data) {
    if (!state.reminders) state.reminders = [];
    var r = normalizeReminder({
      titulo: data.titulo, fecha: data.fecha, hora: data.hora,
      tipo: data.tipo, nota: data.nota, repeat: data.repeat
    });
    state.reminders.push(r);
    emit();
    return r;
  }
  function updateReminder(id, patch) {
    var r = getReminder(id);
    if (!r) return null;
    Object.keys(patch).forEach(function (k) { r[k] = patch[k]; });
    normalizeReminder(r);
    emit();
    return r;
  }
  // marca / desmarca UNA ocurrencia (para recordatorios que se repiten,
  // completar "esta semana" no completa toda la serie)
  function toggleReminderOccurrence(id, occDate) {
    var r = getReminder(id);
    if (!r) return;
    occDate = occDate || ((r.repeat && r.repeat !== 'none') ? todayISO() : r.fecha);
    var i = r.doneDates.indexOf(occDate);
    if (i >= 0) r.doneDates.splice(i, 1);
    else r.doneDates.push(occDate);
    emit();
  }
  function removeReminder(id) {
    state.reminders = (state.reminders || []).filter(function (r) { return r.id !== id; });
    emit();
  }

  /* ------------------------- Import / Export / Reset ------------------- */
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(text) {
    var parsed = JSON.parse(text);
    takeSnapshot();
    state = migrate(parsed);
    emit();
  }
  function resetAll() {
    takeSnapshot();
    state = emptyState();
    emit();
  }

  /* ------------------------------- Getters ----------------------------- */
  function getState() { return state; }
  function getVehicle(id) { return state.vehicles.filter(function (v) { return v.id === id; })[0] || null; }
  function activeVehicles() { return state.vehicles.filter(function (v) { return !v.deleted; }); }
  function trashedVehicles() { return state.vehicles.filter(function (v) { return v.deleted; }); }
  function getHistory() { return state.history.slice().sort(function (a, b) { return b.ts - a.ts; }); }
  function getEvent(id) { return state.history.filter(function (h) { return h.id === id; })[0] || null; }

  /* ----------------------------- Helpers varios ----------------------- */
  // Interpreta números escritos en formato argentino (1.500.000,50) o con
  // notación "genérica" (1500.50 / 1,500.50) sin que el usuario tenga que
  // pensar en el formato. Antes se asumía siempre "punto = miles" y un monto
  // como "1500.50" (muy común al tipear con teclado numérico en inglés)
  // quedaba guardado como 150050 — un error silencioso de x100 en dinero.
  function num(x) {
    var s = String(x == null ? '' : x).trim();
    if (!s) return 0;
    var neg = s.charAt(0) === '-';
    s = s.replace(/[^0-9.,]/g, '');
    var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
    if (lastComma > -1 && lastDot > -1) {
      // están los dos separadores: el que aparece último es el decimal
      s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lastComma > -1) {
      var cp = s.split(',');
      s = (cp.length === 2 && cp[1].length <= 2) ? (cp[0] + '.' + cp[1]) : s.replace(/,/g, '');
    } else if (lastDot > -1) {
      var dp = s.split('.');
      // un solo punto seguido de 3 dígitos es ambiguo entre "miles" (AR) y
      // decimal; en montos de dinero (máx. 2 decimales) siempre es miles.
      if (!(dp.length === 2 && dp[1].length <= 2)) s = s.replace(/\./g, '');
    }
    var n = parseFloat(s);
    n = isNaN(n) ? 0 : n;
    return neg ? -n : n;
  }
  function vehicleName(v) {
    return [v.marca, v.modelo, v.anio].filter(Boolean).join(' ') || (v.patente || 'Vehículo sin datos');
  }
  function estadoLabel(e) { return ({ stock: 'En stock', reservado: 'Reservado', vendido: 'Vendido' })[e] || e; }
  function formaPagoLabel(f) {
    return ({ transferencia: 'Transferencia', efectivo: 'Efectivo', mixto: 'Mitad transferencia / mitad efectivo', cuotas: 'En cuotas', 'parte-de-pago': 'Parte de pago' })[f] || f;
  }
  function formaCobroLabel(f) {
    return ({ transferencia: 'Transferencia', efectivo: 'Efectivo', mixto: 'Mitad transferencia / mitad efectivo', vehiculo: 'Entrega de vehículo', financiado: 'Financiado / con prenda' })[f] || f;
  }

  /* ------------------------------- Export API -------------------------- */
  window.App = window.App || {};
  App.store = {
    STORAGE_KEY: STORAGE_KEY,
    load: load, save: save, subscribe: subscribe,
    hydrate: hydrate, notify: notify, blankState: emptyState, migrate: migrate,
    getState: getState, getVehicle: getVehicle,
    activeVehicles: activeVehicles, trashedVehicles: trashedVehicles,
    getHistory: getHistory, getEvent: getEvent,
    createVehicle: createVehicle, updateVehicle: updateVehicle,
    softDeleteVehicle: softDeleteVehicle, restoreVehicle: restoreVehicle, hardDeleteVehicle: hardDeleteVehicle,
    setPurchase: setPurchase, pagarCuota: pagarCuota, desmarcarCuota: desmarcarCuota,
    setSale: setSale, cancelarVenta: cancelarVenta,
    setReservation: setReservation, cancelReservation: cancelReservation,
    cobrarCuotaVenta: cobrarCuotaVenta, descobrarCuotaVenta: descobrarCuotaVenta,
    addExpense: addExpense, updateExpense: updateExpense, removeExpense: removeExpense,
    getFixedExpenses: getFixedExpenses, getFixedExpense: getFixedExpense,
    addFixedExpense: addFixedExpense, updateFixedExpense: updateFixedExpense, removeFixedExpense: removeFixedExpense,
    getReminders: getReminders, getReminder: getReminder, addReminder: addReminder,
    updateReminder: updateReminder, toggleReminderOccurrence: toggleReminderOccurrence, removeReminder: removeReminder,
    updateSettings: updateSettings,
    exportJSON: exportJSON, importJSON: importJSON, resetAll: resetAll,
    markBackup: markBackup, takeSnapshot: takeSnapshot, getSnapshots: getSnapshots, restoreSnapshot: restoreSnapshot,
    logEvent: function (e) { logEvent(e); emit(); },
    // helpers
    uid: uid, todayISO: todayISO, num: num,
    vehicleName: vehicleName, estadoLabel: estadoLabel, categoriaLabel: categoriaLabel,
    formaPagoLabel: formaPagoLabel, formaCobroLabel: formaCobroLabel
  };
})();
</script>
<script>
/* ===== js/finance.js ===== */
/* ============================================================================
 * finance.js  —  Cálculos financieros, métricas, resúmenes y estadísticas
 * ----------------------------------------------------------------------------
 * Regla de normalización de monedas:
 *   - Cada operación (compra / venta / gasto) guarda su propia cotización
 *     histórica del dólar. Esa cotización NUNCA se recalcula.
 *   - Para expresar montos en una moneda común usamos la cotización propia de
 *     la operación; si no existe, se usa la cotización actual (settings.dolarActual)
 *     sólo como último recurso.
 *   - Todos los totales del sistema se muestran en PESOS (ARS) y, cuando aporta
 *     valor, también en USD.
 * ==========================================================================*/
(function () {
  'use strict';

  function S() { return App.store.getState(); }
  function currentRate() { return S().settings.dolarActual || 1; }

  function toARS(monto, moneda, rate) {
    monto = +monto || 0;
    if (moneda === 'USD') return monto * (rate || currentRate());
    return monto;
  }
  function toUSD(monto, moneda, rate) {
    monto = +monto || 0;
    if (moneda === 'USD') return monto;
    return monto / (rate || currentRate());
  }

  function purchaseRate(v) {
    if (v.purchase && v.purchase.cotizacionUSD) return v.purchase.cotizacionUSD;
    // consignación: no hay compra propia, pero puede tener su propia cotización
    // de referencia (cargada al recibir el vehículo) para comparar en dólares.
    if (v.origin && v.origin.type === 'consignacion' && v.origin.cotizacionUSD) return v.origin.cotizacionUSD;
    return currentRate();
  }
  function saleRate(v) {
    if (v.sale && v.sale.cotizacionUSD) return v.sale.cotizacionUSD;
    return currentRate();
  }

  /* --------------------------- Métricas por vehículo -------------------- */
  function vehicleMetrics(v) {
    var pRate = purchaseRate(v);
    var sRate = saleRate(v);

    var compraARS = v.purchase ? toARS(v.purchase.precio, v.purchase.moneda, pRate) : 0;
    var compraUSD = v.purchase ? toUSD(v.purchase.precio, v.purchase.moneda, pRate) : 0;

    var gastosARS = 0, gastosUSD = 0;
    (v.expenses || []).forEach(function (e) {
      var r = e.cotizacionUSD || pRate;
      gastosARS += toARS(e.monto, e.moneda, r);
      gastosUSD += toUSD(e.monto, e.moneda, r);
    });

    var inversionARS = compraARS + gastosARS;
    var inversionUSD = compraUSD + gastosUSD;

    var vendido = !!(v.sale && v.sale.precio);
    var ventaARS = vendido ? toARS(v.sale.precio, v.sale.moneda, sRate) : 0;
    var ventaUSD = vendido ? toUSD(v.sale.precio, v.sale.moneda, sRate) : 0;

    // Comisiones pagadas a terceros (contactos que acercaron la operación)
    var comCompra = (v.purchase && v.purchase.comision) ? v.purchase.comision : null;
    var comVenta = (vendido && v.sale.comision) ? v.sale.comision : null;
    var comisionCompraARS = comCompra ? toARS(comCompra.monto, comCompra.moneda, pRate) : 0;
    var comisionVentaARS = comVenta ? toARS(comVenta.monto, comVenta.moneda, sRate) : 0;
    var comisionCompraUSD = comCompra ? toUSD(comCompra.monto, comCompra.moneda, pRate) : 0;
    var comisionVentaUSD = comVenta ? toUSD(comVenta.monto, comVenta.moneda, sRate) : 0;
    var comisionARS = comisionCompraARS + comisionVentaARS;
    var comisionUSD = comisionCompraUSD + comisionVentaUSD;

    // Costo total = compra + gastos + comisiones
    var costoTotalARS = inversionARS + comisionARS;
    var costoTotalUSD = inversionUSD + comisionUSD;

    // Valor de la operación de venta = precio de venta (incluye el vehículo recibido + diferencia)
    var tradeInARS = 0, diferenciaARS = 0;
    if (vendido && v.sale.tradeIn) tradeInARS = toARS(v.sale.tradeIn.valor, v.sale.tradeIn.moneda, sRate);
    if (vendido && v.sale.diferencia) diferenciaARS = toARS(v.sale.diferencia.monto, v.sale.diferencia.moneda, sRate);

    // Consignación: el vehículo no se compró, sigue siendo del dueño. Al
    // venderlo hay que descontar lo que le corresponde a él — la ganancia
    // del negocio es solo la diferencia. Mientras está en stock esto NO
    // se suma a costoTotalARS (así no infla el capital invertido: el
    // negocio no puso ese dinero).
    var esConsignacion = !!(v.origin && v.origin.type === 'consignacion');
    var precioDuenoARS = 0, precioDuenoUSD = 0;
    if (esConsignacion && v.origin.precioDueno) {
      precioDuenoARS = toARS(v.origin.precioDueno, v.origin.monedaDueno || 'ARS', pRate);
      precioDuenoUSD = toUSD(v.origin.precioDueno, v.origin.monedaDueno || 'ARS', pRate);
    }
    var gananciaARS = vendido ? (ventaARS - costoTotalARS - precioDuenoARS) : 0;
    var gananciaUSD = vendido ? (ventaUSD - costoTotalUSD - precioDuenoUSD) : 0;
    var rentabilidad = (vendido && (costoTotalARS + precioDuenoARS)) ? (gananciaARS / (costoTotalARS + precioDuenoARS)) * 100 : 0;
    var rentabilidadUSD = (vendido && (costoTotalUSD + precioDuenoUSD)) ? (gananciaUSD / (costoTotalUSD + precioDuenoUSD)) * 100 : 0;

    // Valor estimado en stock: precio pretendido, si existe; si no, la inversión total
    var estimadoARS = inversionARS;
    if (v.precioPretendido) estimadoARS = toARS(v.precioPretendido, v.precioPretendidoMoneda || 'ARS', currentRate());

    // Cuotas
    var cuotas = (v.purchase && v.purchase.cuotas) || [];
    var cuotasTotal = 0, cuotasPagadas = 0, cuotasPendientes = 0, cuotasVencidas = 0;
    var proximaCuota = null;
    var hoy = App.store.todayISO();
    cuotas.forEach(function (c) {
      var m = toARS(c.monto, v.purchase.moneda, pRate);
      cuotasTotal += m;
      if (c.pagada) { cuotasPagadas += m; }
      else {
        cuotasPendientes += m;
        if (c.vencimiento && c.vencimiento < hoy) cuotasVencidas += m;
        if (!proximaCuota || (c.vencimiento && c.vencimiento < proximaCuota.vencimiento)) proximaCuota = c;
      }
    });
    var totalPagado = 0;
    if (v.purchase) {
      if (v.purchase.formaPago === 'cuotas') totalPagado = cuotasPagadas;
      else if (v.purchase.formaPago === 'parte-de-pago') totalPagado = compraARS;
      else totalPagado = compraARS; // transferencia/efectivo/mixto se consideran pagadas al contado
    }
    var totalPendiente = v.purchase && v.purchase.formaPago === 'cuotas' ? cuotasPendientes : 0;

    // Cuotas que TE tienen que pagar (venta financiada)
    var fin = (vendido && v.sale.financiacion) ? v.sale.financiacion : null;
    var finCuotas = fin ? (fin.cuotas || []) : [];
    var financTotalARS = 0, financCobradoARS = 0, financPorCobrarARS = 0, financVencidasARS = 0;
    var proximaCuotaCobro = null;
    finCuotas.forEach(function (c) {
      var mm = toARS(c.monto, fin.moneda, sRate);
      financTotalARS += mm;
      if (c.cobrada) financCobradoARS += mm;
      else {
        financPorCobrarARS += mm;
        if (c.vencimiento && c.vencimiento < hoy) financVencidasARS += mm;
        if (!proximaCuotaCobro || (c.vencimiento && c.vencimiento < (proximaCuotaCobro.vencimiento || '9999'))) proximaCuotaCobro = c;
      }
    });
    var financEntregaARS = fin ? toARS(fin.entrega, fin.moneda, sRate) : 0;

    return {
      compraARS: compraARS, compraUSD: compraUSD,
      gastosARS: gastosARS, gastosUSD: gastosUSD,
      inversionARS: inversionARS, inversionUSD: inversionUSD,
      comisionCompraARS: comisionCompraARS, comisionVentaARS: comisionVentaARS, comisionARS: comisionARS,
      costoTotalARS: costoTotalARS, costoTotalUSD: costoTotalUSD,
      vendido: vendido,
      ventaARS: ventaARS, ventaUSD: ventaUSD,
      tradeInARS: tradeInARS, diferenciaARS: diferenciaARS,
      gananciaARS: gananciaARS, gananciaUSD: gananciaUSD,
      rentabilidad: rentabilidad, rentabilidadUSD: rentabilidadUSD,
      esConsignacion: esConsignacion, precioDuenoARS: precioDuenoARS, precioDuenoUSD: precioDuenoUSD,
      estimadoARS: estimadoARS,
      diasEnStock: diasEnStock(v),
      purchaseRate: pRate, saleRate: sRate,
      cuotasCount: cuotas.length,
      cuotasPagadasCount: cuotas.filter(function (c) { return c.pagada; }).length,
      cuotasPendientesCount: cuotas.filter(function (c) { return !c.pagada; }).length,
      cuotasVencidasCount: cuotas.filter(function (c) { return !c.pagada && c.vencimiento && c.vencimiento < hoy; }).length,
      cuotasTotalARS: cuotasTotal, cuotasPagadasARS: cuotasPagadas, cuotasPendientesARS: cuotasPendientes, cuotasVencidasARS: cuotasVencidas,
      totalPagadoARS: totalPagado, totalPendienteARS: totalPendiente,
      proximaCuota: proximaCuota,
      // financiación de la venta
      financiado: !!fin,
      financCuotasCount: finCuotas.length,
      financCobradasCount: finCuotas.filter(function (c) { return c.cobrada; }).length,
      financPendientesCount: finCuotas.filter(function (c) { return !c.cobrada; }).length,
      financVencidasCount: finCuotas.filter(function (c) { return !c.cobrada && c.vencimiento && c.vencimiento < hoy; }).length,
      financEntregaARS: financEntregaARS,
      financTotalARS: financTotalARS, financCobradoARS: financCobradoARS,
      financPorCobrarARS: financPorCobrarARS, financVencidasARS: financVencidasARS,
      proximaCuotaCobro: proximaCuotaCobro
    };
  }

  function diasEnStock(v) {
    // en consignación no hay fecha de compra: se cuenta desde que ingresó
    var fechaDesde = v.purchase ? v.purchase.fecha : (v.origin && v.origin.type === 'consignacion' ? v.origin.fecha : null);
    if (!fechaDesde) return null;
    var desde = parseDate(fechaDesde);
    var hasta = (v.sale && v.sale.fecha) ? parseDate(v.sale.fecha) : new Date();
    if (!desde) return null;
    var ms = hasta - desde;
    return Math.max(0, Math.round(ms / 86400000));
  }

  function parseDate(iso) {
    if (!iso) return null;
    var p = String(iso).split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  /* --------------------------- Comparación por dólar ------------------- */
  // Comparación "valor del auto según el dólar" (sección 20/21).
  // La referencia es la INVERSIÓN TOTAL (precio de compra + gastos) expresada en
  // dólares: cada parte se convierte con su propia cotización histórica
  // (la de la compra, o la del gasto si se cargó una distinta).
  function dollarComparison(v, dolarActualManual) {
    var esConsignacion = !!(v.origin && v.origin.type === 'consignacion');
    if (!v.purchase && !esConsignacion) return null;
    var m = vehicleMetrics(v);
    var pRate = esConsignacion ? (v.origin.cotizacionUSD || null) : (v.purchase.cotizacionUSD || null);
    var monedaRef = esConsignacion ? (v.origin.monedaDueno || 'ARS') : v.purchase.moneda;

    // En consignación no hubo compra propia: la referencia de "lo que costó"
    // es lo que le corresponde al dueño (ver vehicleMetrics). m.compraARS/USD
    // ya da 0 en ese caso, así que sumar precioDuenoARS/USD es exactamente
    // reemplazarlo por el valor correcto sin duplicar nada.
    var compraARS = m.compraARS + m.precioDuenoARS;
    var gastosARS = m.gastosARS;
    var inversionARS = compraARS + gastosARS;    // "compra" + gastos, en pesos (nominal)
    var compraUSD = m.compraUSD + m.precioDuenoUSD;
    var gastosUSD = m.gastosUSD;                // gastos en USD (cotización de cada gasto)
    var inversionUSD = compraUSD + gastosUSD;   // "compra" + gastos, en USD
    var valorUSD = inversionUSD;                // "valor equivalente en dólares" ahora incluye los gastos
    var dolarActual = +dolarActualManual || currentRate();

    var out = {
      compraARS: compraARS,
      gastosARS: gastosARS,
      inversionARS: inversionARS,
      compraUSD: compraUSD,
      gastosUSD: gastosUSD,
      inversionUSD: inversionUSD,
      dolarCompra: pRate || (monedaRef === 'USD' ? pRate : currentRate()),
      valorUSD: valorUSD,
      dolarActual: dolarActual,
      valorActualizadoARS: valorUSD != null ? valorUSD * dolarActual : null,
      diferenciaARS: null,
      resultado: null,
      esConsignacion: esConsignacion
    };
    if (out.valorActualizadoARS != null) {
      out.diferenciaARS = out.valorActualizadoARS - inversionARS;
      out.resultado = out.diferenciaARS >= 0 ? 'ganancia' : 'perdida';
    }

    // Si además está vendido: comparación real inversión vs venta
    if (v.sale && v.sale.precio) {
      var sRate = v.sale.cotizacionUSD || null;
      var ventaARS = m.ventaARS;
      var valorUSDVenta = m.ventaUSD;
      out.venta = {
        ventaARS: ventaARS,
        dolarVenta: sRate || (v.sale.moneda === 'USD' ? (v.sale.cotizacionUSD || null) : currentRate()),
        valorUSDVenta: valorUSDVenta,
        gananciaNominalARS: ventaARS - inversionARS,
        gananciaUSD: (valorUSDVenta != null && valorUSD != null) ? (valorUSDVenta - valorUSD) : null,
        variacionUSDPct: (valorUSD) ? ((valorUSDVenta - valorUSD) / valorUSD) * 100 : null,
        // diferencia explicada por la variación del dólar: cuánto valdría hoy en pesos la inversión en USD al dólar de venta
        efectoDolarARS: (valorUSD != null && sRate) ? (valorUSD * sRate - inversionARS) : null
      };
    }
    return out;
  }

  /* --------------------------- Agregados globales --------------------- */
  function globalMetrics() {
    var vehicles = App.store.activeVehicles();
    var enStock = vehicles.filter(function (v) { return v.estado !== 'vendido'; });
    var vendidos = vehicles.filter(function (v) { return v.estado === 'vendido' && v.sale; });

    var capitalInvertido = 0, valorEstimadoStock = 0, gastosTotales = 0, gananciaTotal = 0, gananciaTotalUSD = 0;
    var ventasTotal = 0, comprasTotal = 0;

    var comisionesTotal = 0, porCobrar = 0, porCobrarVencido = 0, porPagarCuotas = 0, porPagarVencido = 0;

    vehicles.forEach(function (v) {
      var m = vehicleMetrics(v);
      gastosTotales += m.gastosARS;
      comprasTotal += m.compraARS;
      comisionesTotal += m.comisionARS;
      porCobrar += m.financPorCobrarARS;
      porCobrarVencido += m.financVencidasARS;
      porPagarCuotas += m.cuotasPendientesARS;
      porPagarVencido += m.cuotasVencidasARS;
      if (v.estado !== 'vendido') {
        capitalInvertido += m.costoTotalARS;
        valorEstimadoStock += m.estimadoARS;
      } else if (v.sale) {
        gananciaTotal += m.gananciaARS;
        gananciaTotalUSD += m.gananciaUSD;
        ventasTotal += m.ventaARS;
      }
    });

    var gastosFijosTotales = fixedExpensesTotal();
    var resultadoNegocio = gananciaTotal - gastosFijosTotales;
    var gananciaPromedio = vendidos.length ? gananciaTotal / vendidos.length : 0;

    // rankings
    var conGanancia = vendidos.map(function (v) { return { v: v, m: vehicleMetrics(v) }; });
    var mayorGanancia = pick(conGanancia, function (a, b) { return b.m.gananciaARS - a.m.gananciaARS; });
    var menorGanancia = pick(conGanancia, function (a, b) { return a.m.gananciaARS - b.m.gananciaARS; });
    var masRentable = pick(conGanancia, function (a, b) { return b.m.rentabilidad - a.m.rentabilidad; });
    var menosRentable = pick(conGanancia, function (a, b) { return a.m.rentabilidad - b.m.rentabilidad; });
    var masTiempoStock = pick(vehicles.map(wrap), function (a, b) { return (b.m.diasEnStock || 0) - (a.m.diasEnStock || 0); });
    var vendidoMasRapido = pick(conGanancia.filter(function (x) { return x.m.diasEnStock != null; }), function (a, b) { return a.m.diasEnStock - b.m.diasEnStock; });
    var mayorVenta = pick(conGanancia, function (a, b) { return b.m.ventaARS - a.m.ventaARS; });

    // mayor gasto individual
    var mayorGasto = null;
    vehicles.forEach(function (v) {
      (v.expenses || []).forEach(function (e) {
        var r = e.cotizacionUSD || purchaseRate(v);
        var ars = toARS(e.monto, e.moneda, r);
        if (!mayorGasto || ars > mayorGasto.ars) mayorGasto = { vehicle: v, expense: e, ars: ars };
      });
    });

    function wrap(v) { return { v: v, m: vehicleMetrics(v) }; }

    return {
      autosEnStock: enStock.length,
      autosVendidos: vendidos.length,
      totalVehiculos: vehicles.length,
      capitalInvertido: capitalInvertido,
      valorEstimadoStock: valorEstimadoStock,
      dineroEnAutos: capitalInvertido,
      gastosTotales: gastosTotales,
      gastosFijosTotales: gastosFijosTotales,
      comisionesTotal: comisionesTotal,
      resultadoNegocio: resultadoNegocio,
      porCobrar: porCobrar, porCobrarVencido: porCobrarVencido,
      porPagarCuotas: porPagarCuotas, porPagarVencido: porPagarVencido,
      gananciaTotal: gananciaTotal,
      gananciaTotalUSD: gananciaTotalUSD,
      gananciaPromedio: gananciaPromedio,
      ventasTotal: ventasTotal,
      comprasTotal: comprasTotal,
      gananciaDelMes: periodResult(monthRange(new Date())).ganancias,
      resultadoNetoDelMes: periodResult(monthRange(new Date())).resultadoNeto,
      mayorGanancia: mayorGanancia, menorGanancia: menorGanancia,
      masRentable: masRentable, menosRentable: menosRentable,
      masTiempoStock: masTiempoStock, vendidoMasRapido: vendidoMasRapido,
      mayorVenta: mayorVenta, mayorGasto: mayorGasto
    };
  }

  function pick(arr, cmp) {
    if (!arr || !arr.length) return null;
    return arr.slice().sort(cmp)[0];
  }

  /* ------------------- Gastos fijos del negocio ---------------------- */
  function fxRate(f) { return f.cotizacionUSD || currentRate(); }
  // Un gasto fijo (alquiler, sueldos, etc.) nunca puede contarse como "ya
  // gastado" más allá de hoy: si el rango pedido (p.ej. "Este año") llega
  // hasta una fecha futura, se recorta a hoy para no sumar meses que todavía
  // no pasaron (antes, "Este año" contaba el año calendario completo de una,
  // incluyendo meses futuros, e inflaba el gasto fijo respecto al resto de
  // la economía — que sí capa todo a hoy).
  function capToToday(iso) {
    var todayCap = App.store.todayISO();
    return (iso && iso > todayCap) ? todayCap : iso;
  }
  function fixedExpenseMonths(f, from, to) {
    to = capToToday(to);
    if (f.frecuencia !== 'mensual') {
      return (f.fecha && (!from || f.fecha >= from) && (!to || f.fecha <= to)) ? 1 : 0;
    }
    var startD = parseDate(f.fecha);
    if (!startD) return 0;
    var rFrom = from ? parseDate(from) : startD;
    var rTo = to ? parseDate(to) : new Date();
    var endLimit = f.hasta ? parseDate(f.hasta) : null;
    var s = (startD > rFrom) ? startD : rFrom;
    var e = rTo;

  // devuelve { pagar: [item...], cobrar: [item...] }
  // item = { vehicle, cuota, tipo:'pagar'|'cobrar', moneda, vencimiento, montoARS, estado }
  function allInstallments() {

    for (var i = 0; i < all.length; i++) {
      if (isNavigableField(all[i]) && isVisibleField(all[i])) candidates.push(all[i]);
    }
    var idx = candidates.indexOf(current);
    if (idx === -1 || idx === candidates.length - 1) return null;
    return candidates[idx + 1];
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
    var t = e.target;
    if (!t || !t.tagName) return;
    var tag = t.tagName.toLowerCase();
    if (tag === 'textarea') return;
    if (tag === 'button' || (tag === 'input' && ENTER_NON_FIELD_TYPES[(t.type || '').toLowerCase()])) return;
    if (t.closest('form')) return;
    if (t.closest('.topbar-search-wrap')) return;
    if (!isNavigableField(t)) return;
    var scope = t.closest('.modal') || t.closest('.page') || document.body;
    var next = nextNavigableField(scope, t);
    e.preventDefault();
    if (next) next.focus();
  });

  /* ------------------------------- Export ---------------------------- */
  function emptyState(msg, icon) {
    return el('div', { class: 'empty' }, [
      el('div', { class: 'empty-icon', text: icon || '📭' }),
      el('p', { text: msg })
    ]);
  }

  window.App = window.App || {};
  App.ui = {
    el: el, clear: clear, qs: qs, qsa: qsa, appendChildren: appendChildren,
    toast: toast, modal: modal, confirm: confirm, closeAllModals: closeAllModals,
    field: field, input: input, textarea: textarea, select: select, money2: money2,
    moneyInput: moneyInput,
    carIcon: carIcon,
    downloadFile: downloadFile, toCSV: toCSV,
    estadoBadge: estadoBadge, docBadge: docBadge, pill: pill, resultBadge: resultBadge,
    emptyState: emptyState
  };
  App.fmt = {
    money: money, moneyFull: moneyFull, usd: usd, pct: pct, num: num,
    date: date, dateLong: dateLong, datetime: datetime, days: days, relative: relative
  };
})();

<script>
/* ===== js/xlsx.js ===== */
/* ============================================================================
 * xlsx.js  —  Escritor de archivos Excel (.xlsx) con estilos, sin dependencias
 * ----------------------------------------------------------------------------
 * Genera un .xlsx real (ZIP de XML) con:
 *   - varias hojas
 *   - encabezados en negrita y con color
 *   - colores de fondo por celda, bordes, alineación
 *   - formato de número (miles) y colores para positivo / negativo
 * Uso:
 *   var wb = App.xlsx.create();
 *   var ws = wb.sheet('Autos', { cols: [24, 12], freeze: 1 });
 *   ws.row(['Marca', 'Precio'], 'header');
 *   ws.row(['Toyota', { v: 1500000, s: { numFmt: 'money' } }]);
 *   wb.blob();  // -> Blob   |   wb.download('archivo.xlsx');
 * ==========================================================================*/
(function () {
  'use strict';

  /* ------------------------------- utilidades ------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ''); // caracteres de control inválidos en XML
  }
  function colLetter(n) { // 1 -> A
    var s = '';
    while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
    return s;
  }

  /* --------------------------------- CRC32 -------------------------------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* ------------------------------ ZIP (store) ---------------------------- */
  function zip(files) {
    // files: [{ name, data(Uint8Array) }]
    var enc = new TextEncoder();
    var parts = [];
    var central = [];
    var offset = 0;
    var now = new Date();
    var dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() / 2) & 31);
    var dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

    files.forEach(function (f) {
      var nameBytes = enc.encode(f.name);
      var data = f.data;
      var crc = crc32(data);
      var local = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);          // version needed
      dv.setUint16(6, 0x0800, true);      // flag: UTF-8 names
      dv.setUint16(8, 0, true);           // compression: store
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      parts.push(local, data);

      var cd = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += local.length + data.length;
    });

    var cdSize = central.reduce(function (a, c) { return a + c.length; }, 0);
    var cdOffset = offset;
    central.forEach(function (c) { parts.push(c); });

    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, cdOffset, true);
    parts.push(eocd);

    return new Blob(parts, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* ----------------------------- estilos (styles.xml) ------------------- */
  var NUMFMT = { money: '#,##0', money2: '#,##0.00', pct: '0.0"%"', int: '#,##0', date: 'dd/mm/yyyy' };

  function StyleBook() {
    this.fonts = ['<font><sz val="11"/><name val="Calibri"/></font>'];
    this.fills = [
      '<fill><patternFill patternType="none"/></fill>',
      '<fill><patternFill patternType="gray125"/></fill>'
    ];
    this.borders = [
      '<border><left/><right/><top/><bottom/><diagonal/></border>',
      '<border><left style="thin"><color rgb="FFD9DEE8"/></left><right style="thin"><color rgb="FFD9DEE8"/></right><top style="thin"><color rgb="FFD9DEE8"/></top><bottom style="thin"><color rgb="FFD9DEE8"/></bottom><diagonal/></border>'
    ];
    this.numFmts = [];        // {id, code}
    this.xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    this.cache = {};
  }
  StyleBook.prototype._idx = function (arr, xml) {
    var i = arr.indexOf(xml);
    if (i >= 0) return i;
    arr.push(xml);
    return arr.length - 1;
  };
  StyleBook.prototype._numFmtId = function (code) {
    for (var i = 0; i < this.numFmts.length; i++) if (this.numFmts[i].code === code) return this.numFmts[i].id;
    var id = 164 + this.numFmts.length;
    this.numFmts.push({ id: id, code: code });
    return id;
  };
  StyleBook.prototype.style = function (s) {
    s = s || {};
    var key = JSON.stringify(s);
    if (this.cache[key] != null) return this.cache[key];

    var fontId = 0;
    if (s.bold || s.italic || s.color || s.size) {
      var f = '<font>';
      if (s.bold) f += '<b/>';
      if (s.italic) f += '<i/>';
      if (s.size) f += '<sz val="' + s.size + '"/>'; else f += '<sz val="11"/>';
      if (s.color) f += '<color rgb="FF' + s.color + '"/>';
      f += '<name val="Calibri"/></font>';
      fontId = this._idx(this.fonts, f);
    }

    var fillId = 0;
    if (s.fill) {
      fillId = this._idx(this.fills,
        '<fill><patternFill patternType="solid"><fgColor rgb="FF' + s.fill + '"/><bgColor indexed="64"/></patternFill></fill>');
    }

    var borderId = s.border ? 1 : 0;

    var numFmtId = 0;
    if (s.numFmt) {
      var code = NUMFMT[s.numFmt] || s.numFmt;
      numFmtId = this._numFmtId(code);
    }

    var xf = '<xf numFmtId="' + numFmtId + '" fontId="' + fontId + '" fillId="' + fillId + '" borderId="' + borderId + '" xfId="0"';
    var applies = [];
    if (numFmtId) applies.push('applyNumberFormat="1"');
    if (fontId) applies.push('applyFont="1"');
    if (fillId) applies.push('applyFill="1"');
    if (borderId) applies.push('applyBorder="1"');
    var align = '';
    if (s.align || s.wrap || s.valign) {
      applies.push('applyAlignment="1"');
      align = '<alignment' +
        (s.align ? ' horizontal="' + s.align + '"' : '') +
        (s.valign ? ' vertical="' + s.valign + '"' : ' vertical="center"') +
        (s.wrap ? ' wrapText="1"' : '') + '/>';
    }
    if (applies.length) xf += ' ' + applies.join(' ');
    xf += align ? ('>' + align + '</xf>') : '/>';

    var idx = this._idx(this.xfs, xf);
    this.cache[key] = idx;
    return idx;
  };
  StyleBook.prototype.xml = function () {
    var nf = this.numFmts.length
      ? '<numFmts count="' + this.numFmts.length + '">' +
        this.numFmts.map(function (n) { return '<numFmt numFmtId="' + n.id + '" formatCode="' + esc(n.code) + '"/>'; }).join('') +
        '</numFmts>'
      : '';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      nf +
      '<fonts count="' + this.fonts.length + '">' + this.fonts.join('') + '</fonts>' +
      '<fills count="' + this.fills.length + '">' + this.fills.join('') + '</fills>' +
      '<borders count="' + this.borders.length + '">' + this.borders.join('') + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + this.xfs.length + '">' + this.xfs.join('') + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  };

  /* -------------------------------- Hoja -------------------------------- */
  function Sheet(name, opts, book) {
    this.name = name;
    this.opts = opts || {};
    this.book = book;
    this.rows = [];       // cada fila: array de { v, num, s }
  }
  Sheet.prototype.row = function (cells, defStyle) {
    var self = this;
    function resolve(sp) {
      if (!sp) return null;
      if (typeof sp === 'string') return self.book.named[sp] || null;
      return sp;
    }
    var base = resolve(defStyle);
    var out = (cells || []).map(function (c) {
      var v, sp;
      if (c != null && typeof c === 'object' && ('v' in c || 's' in c)) { v = c.v; sp = resolve(c.s); }
      else { v = c; sp = null; }
      if (!sp) sp = base;
      else if (base) sp = Object.assign({}, base, sp);   // override sobre el estilo base de la fila
      var isNum = (typeof v === 'number' && isFinite(v));
      return { v: v, num: isNum, s: sp };
    });
    this.rows.push(out);
    return this;
  };
  Sheet.prototype.blank = function (n) { for (var i = 0; i < (n || 1); i++) this.rows.push([]); return this; };

  Sheet.prototype.xml = function (first) {
    var book = this.book;
    var nCols = 1;
    this.rows.forEach(function (r) { if (r.length > nCols) nCols = r.length; });
    var nRows = this.rows.length || 1;

    var views = '<sheetViews><sheetView workbookViewId="0"' + (first ? ' tabSelected="1"' : '') + '>';
    if (this.opts.freeze) {
      var fr = this.opts.freeze;
      views += '<pane ySplit="' + fr + '" topLeftCell="A' + (fr + 1) + '" activePane="bottomLeft" state="frozen"/>' +
        '<selection pane="bottomLeft" activeCell="A' + (fr + 1) + '" sqref="A' + (fr + 1) + '"/>';
    }
    views += '</sheetView></sheetViews>';

    var cols = '';
    if (this.opts.cols && this.opts.cols.length) {
      cols = '<cols>' + this.opts.cols.map(function (w, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>';
    }

    var body = '';
    for (var r = 0; r < this.rows.length; r++) {
      var cells = this.rows[r];
      var rowXml = '';
      for (var c = 0; c < cells.length; c++) {
        var cell = cells[c];
        if (cell.v == null || cell.v === '') {
          if (cell.s) {
            var sIdxE = book.styles.style(cell.s);
            rowXml += '<c r="' + colLetter(c + 1) + (r + 1) + '" s="' + sIdxE + '"/>';
          }
          continue;
        }
        var sIdx = cell.s ? book.styles.style(cell.s) : 0;
        var ref = colLetter(c + 1) + (r + 1);
        if (cell.num) {
          rowXml += '<c r="' + ref + '"' + (sIdx ? ' s="' + sIdx + '"' : '') + '><v>' + cell.v + '</v></c>';
        } else {
          rowXml += '<c r="' + ref + '"' + (sIdx ? ' s="' + sIdx + '"' : '') + ' t="inlineStr"><is><t xml:space="preserve">' + esc(cell.v) + '</t></is></c>';
        }
      }
      body += '<row r="' + (r + 1) + '">' + rowXml + '</row>';
    }

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<dimension ref="A1:' + colLetter(nCols) + nRows + '"/>' +
      views +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      cols +
      '<sheetData>' + body + '</sheetData>' +
      '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
      '</worksheet>';
  };

  /* ------------------------------ Libro -------------------------------- */
  function Workbook() {
    this.sheets = [];
    this.styles = new StyleBook();
    this.named = {};
  }
  Workbook.prototype.define = function (name, spec) { this.named[name] = spec; return this; };
  Workbook.prototype.sheet = function (name, opts) {
    var s = new Sheet(String(name).slice(0, 31).replace(/[\\\/\?\*\[\]:]/g, ' '), opts, this);
    this.sheets.push(s);
    return s;
  };
  Workbook.prototype.blob = function () {
    var enc = new TextEncoder();
    var self = this;
    var files = [];

    var sheetTypes = this.sheets.map(function (s, i) {
      return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join('');
    files.push({ name: '[Content_Types].xml', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheetTypes +
      '</Types>') });

    files.push({ name: '_rels/.rels', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>') });

    var sheetsXml = this.sheets.map(function (s, i) {
      return '<sheet name="' + esc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    }).join('');
    files.push({ name: 'xl/workbook.xml', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' + sheetsXml + '</sheets></workbook>') });

    var rels = this.sheets.map(function (s, i) {
      return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    }).join('');
    rels += '<Relationship Id="rId' + (this.sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>') });

    // hojas primero (para poblar estilos), luego styles.xml
    var sheetFiles = this.sheets.map(function (s, i) {
      return { name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc.encode(s.xml(i === 0)) };
    });
    files.push({ name: 'xl/styles.xml', data: enc.encode(this.styles.xml()) });
    sheetFiles.forEach(function (f) { files.push(f); });

    return zip(files);
  };
  Workbook.prototype.download = function (filename) {
    var blob = this.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename || 'export.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 120);
  };

  window.App = window.App || {};
  App.xlsx = { create: function () { return new Workbook(); } };
})();
</script>
<script>
/* ===== js/excel.js ===== */
/* ============================================================================
 * excel.js  —  Exporta TODO el negocio a un archivo Excel colorido y ordenado
 * ----------------------------------------------------------------------------
 *  - App.excel.download()  -> descarga el .xlsx completo
 *  - App.excel.blob()      -> Blob del .xlsx (para guardado automático)
 *  - Guardado automático (Chrome / Edge): elegís un archivo una vez y la app
 *    lo vuelve a escribir sola con cada cambio.
 * ==========================================================================*/
(function () {
  'use strict';
  var store = App.store, fin = App.finance, fmt = App.fmt;

  /* ------------------------------ helpers ------------------------------- */
  function n(x) { var v = Math.round(+x); return isFinite(v) ? v : 0; }
  function estadoStyle(text) {
    var t = String(text || '').toLowerCase();
    if (/vendid|pagad|complet|al día/.test(t)) return 'ok';
    if (/vencid/.test(t)) return 'danger';
    if (/pendient|hoy|reservad|transferencia/.test(t)) return 'warn';
    if (/papelera|eliminad/.test(t)) return 'trash';
    return 'stock';
  }
  function reminderEstado(r, hoy) {
    var done = (r.doneDates || []).length > 0;
    if ((!r.repeat || r.repeat === 'none')) {
      if ((r.doneDates || []).indexOf(r.fecha) >= 0) return 'Completado';
      if (r.fecha < hoy) return 'Vencido';
      if (r.fecha === hoy) return 'Para hoy';
      return 'Pendiente';
    }
    return done ? 'Se repite (con completadas)' : 'Se repite';
  }
  function lastDone(r) {
    var d = (r.doneDates || []).slice().sort();
    return d.length ? d[d.length - 1] : '';
  }
  var REP = { none: 'No repite', daily: 'Todos los días', weekly: 'Todas las semanas', monthly: 'Todos los meses', yearly: 'Todos los años' };
  var REMT = { tarea: 'Tarea', mantenimiento: 'Mantenimiento', tramite: 'Trámite', pago: 'Pago de cuota', turno: 'Turno con cliente', gestoria: 'Gestoría', stock: 'Stock', otro: 'Otro' };

  /* --------------------------- armado del libro ------------------------ */
  function build() {
    var wb = App.xlsx.create();
    var hoy = store.todayISO();

    // estilos con nombre
    wb.define('title', { bold: true, size: 16, color: '1D4ED8' });
    wb.define('sub', { color: '64748B', size: 10 });
    wb.define('sec', { bold: true, color: 'FFFFFF', fill: '475569', border: true });
    wb.define('k', { bold: true, border: true, fill: 'EEF2F7' });
    wb.define('cell', { border: true });
    wb.define('center', { border: true, align: 'center' });
    wb.define('date', { border: true, align: 'center' });
    wb.define('money', { border: true, numFmt: 'money', align: 'right' });
    wb.define('pct', { border: true, numFmt: 'pct', align: 'right' });
    wb.define('pos', { border: true, numFmt: 'money', align: 'right', bold: true, color: '15803D' });
    wb.define('neg', { border: true, numFmt: 'money', align: 'right', bold: true, color: 'B91C1C' });
    wb.define('ok', { border: true, align: 'center', bold: true, color: '166534', fill: 'DCFCE7' });
    wb.define('warn', { border: true, align: 'center', bold: true, color: '92400E', fill: 'FEF3C7' });
    wb.define('danger', { border: true, align: 'center', bold: true, color: '991B1B', fill: 'FEE2E2' });
    wb.define('stock', { border: true, align: 'center', bold: true, color: '1E40AF', fill: 'DBEAFE' });
    wb.define('trash', { border: true, align: 'center', color: '64748B', fill: 'F1F5F9' });

    function head(color) { return { bold: true, color: 'FFFFFF', fill: color, border: true, align: 'center', valign: 'center', wrap: true }; }
    function ganStyle(v) { return v >= 0 ? 'pos' : 'neg'; }
    // zebra: agrega fondo suave en filas impares
    function z(styleName, alt) {
      if (!alt) return styleName;
      var s = wb.named[styleName] || {};
      if (s.fill) return styleName;

  function blob() { return build().blob(); }
