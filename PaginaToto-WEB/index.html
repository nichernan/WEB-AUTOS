  /* ===================== Guardado automático en un archivo ============= */
  var handle = null;          // FileSystemFileHandle
  var needsReconnect = false; // el permiso caducó tras recargar
  var lastSaved = null;
  var writing = false;
  var timer = null;

  function supported() {
    try { return typeof window.showSaveFilePicker === 'function'; } catch (e) { return false; }
  }
  // preferencia por dispositivo (no se comparte entre usuarios): localStorage
  function prefOn() { try { return localStorage.getItem('paginaToto:excelAutosave') === '1'; } catch (e) { return false; } }
  function setPref(v) { try { localStorage.setItem('paginaToto:excelAutosave', v ? '1' : '0'); } catch (e) {} }

  function idb(mode, val) {
    return new Promise(function (res, rej) {
      var open;
      try { open = indexedDB.open('paginaToto-fs', 1); } catch (e) { return rej(e); }
      open.onupgradeneeded = function () { try { open.result.createObjectStore('h'); } catch (e) {} };
      open.onerror = function () { rej(open.error); };
      open.onsuccess = function () {
        try {
          var db = open.result;
          var tx = db.transaction('h', mode === 'get' ? 'readonly' : 'readwrite');
          var st = tx.objectStore('h');
          var rq = mode === 'get' ? st.get('excel') : (mode === 'put' ? st.put(val, 'excel') : st.delete('excel'));
          rq.onsuccess = function () { res(rq.result); };
          rq.onerror = function () { rej(rq.error); };
        } catch (e) { rej(e); }
      };
    });
  }

  function ensurePerm(interactive) {
    if (!handle) return Promise.resolve(false);
    if (!handle.queryPermission) return Promise.resolve(true);
    var opts = { mode: 'readwrite' };
    return handle.queryPermission(opts).then(function (p) {
      if (p === 'granted') return true;
      if (interactive && handle.requestPermission) return handle.requestPermission(opts).then(function (r) { return r === 'granted'; });
      return false;
    });
  }

  function writeNow() {
    if (!handle || writing) return Promise.resolve();
    writing = true;
    return ensurePerm(false).then(function (ok) {
      if (!ok) { needsReconnect = true; refresh(); return; }
      var b;
      try { b = blob(); } catch (e) { console.error('excel build', e); return; }
      return handle.createWritable().then(function (w) {
        return w.write(b).then(function () { return w.close(); });
      }).then(function () {
        lastSaved = new Date(); needsReconnect = false;
        try { store.markBackup(); } catch (e) {}
        refresh();
      });
    }).catch(function (e) { console.error('excel autosave', e); needsReconnect = true; refresh(); })
      .then(function () { writing = false; });
  }

  function schedule() {
    if (!handle || needsReconnect || !prefOn()) return;
    clearTimeout(timer);
    timer = setTimeout(writeNow, 1500);
  }

  function pickFile() {
    if (!supported()) { App.ui.toast('Tu navegador no permite esto. Usá Chrome o Edge, o el botón de descarga.', 'error'); return; }
    return window.showSaveFilePicker({
      suggestedName: 'PaginaToto.xlsx',
      types: [{ description: 'Libro de Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
    }).then(function (h) {
      handle = h; needsReconnect = false;
      return idb('put', h).catch(function () {}).then(function () {
        setPref(true);
        return writeNow();
      }).then(function () {
        App.ui.toast('Listo. El Excel se va a actualizar solo con cada cambio.', 'success');
        refresh();
      });
    }).catch(function (e) {
      if (e && (e.name === 'AbortError' || e.name === 'SecurityError')) return; // el usuario canceló
      console.error(e); App.ui.toast('No se pudo elegir el archivo', 'error');
    });
  }

  function reconnect() {
    if (!handle) { return pickFile(); }
    return ensurePerm(true).then(function (ok) {
      if (ok) { needsReconnect = false; refresh(); return writeNow(); }
      App.ui.toast('No se pudo reconectar el archivo', 'error');
    });
  }

  function disable() {
    setPref(false);
    handle = null; needsReconnect = false;
    idb('del').catch(function () {});
    refresh();
  }

  function initAutosave() {
    if (!supported() || !prefOn()) return;
    idb('get').then(function (h) {
      if (!h) { setPref(false); return; }
      handle = h;
      return ensurePerm(false).then(function (ok) { needsReconnect = !ok; refresh(); });
    }).catch(function () {});
  }

  function status() {
    return {
      supported: supported(),
      on: prefOn() && !!handle,
      needsReconnect: needsReconnect,
      lastSaved: lastSaved,
      name: handle ? handle.name : null
    };
  }

  var lastKey = '';
  function refresh() {
    // sólo re-renderiza Ajustes cuando cambia algo visible (evita robar el foco al escribir)
    var key = (prefOn() ? '1' : '0') + (handle ? '1' : '0') + (needsReconnect ? '1' : '0');
    if (key === lastKey) return;
    lastKey = key;
    try {
      if (App.router && App.router.currentPath && App.router.currentPath().name === 'ajustes') App.router.render();
    } catch (e) {}
  }

  // re-escribe el archivo con cada cambio del estado
  store.subscribe(schedule);

  window.App = window.App || {};
  App.excel = {
    build: build, blob: blob, download: download, filename: filename,
    pickFile: pickFile, reconnect: reconnect, disable: disable,
    initAutosave: initAutosave, status: status, supported: supported
  };
})();
</script>
<script>
/* ===== js/notify.js ===== */
/* ============================================================================
 * notify.js  —  Avisos: un toast al abrir la app + notificación del navegador
 * ==========================================================================*/
(function () {
  'use strict';
  var store = App.store;

  function supported() { try { return 'Notification' in window; } catch (e) { return false; } }
  function state() { return supported() ? Notification.permission : 'unsupported'; }

  function request() {
    if (!supported()) return Promise.resolve('unsupported');
    return Notification.requestPermission().then(function (p) {
      // preferencia por dispositivo (no se comparte entre usuarios)
      try { localStorage.setItem('paginaToto:avisosNavegador', p === 'granted' ? '1' : '0'); } catch (e) {}
      if (p === 'granted') { App.ui && App.ui.toast('Avisos activados', 'success'); check(true); }
      return p;
    });
  }

  // cuántas cosas necesitan atención (vencidas o de hoy)
  function pendingCount() {
    try { return App.alerts ? App.alerts.count() : 0; } catch (e) { return 0; }
  }

  var shown = false;
  function check(force) {
    if (shown && !force) return;
    shown = true;
    var n = pendingCount();
    if (n <= 0) return;
    var msg = n === 1 ? 'Tenés 1 cosa para revisar en Alertas.' : 'Tenés ' + n + ' cosas para revisar en Alertas.';
    // toast siempre
    if (App.ui) {
      App.ui.toast(msg, 'info');
    }
    // notificación del navegador si está permitido
    try {
      if (supported() && Notification.permission === 'granted') {
        var nt = new Notification('PaginaToto', { body: msg, tag: 'paginatoto-alertas' });
        nt.onclick = function () { window.focus(); location.hash = '#/alertas'; nt.close(); };
      }
    } catch (e) {}
  }

  App.notify = { supported: supported, state: state, request: request, check: check };
})();
</script>
<script>
/* ===== js/supabase.js ===== */
/* ============================================================================
 * supabase.js  —  Inicializa el cliente de Supabase (solo en la versión online)
 * ==========================================================================*/
(function () {
  'use strict';
  window.App = window.App || {};
  var cfg = App.config || {};
  if (!cfg.supabaseUrl || !cfg.supabaseKey || typeof window.supabase === 'undefined') {
    App.sb = null;   // versión local (archivo): no hay nube
    return;
  }
  try {
    App.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'paginaToto:auth' },
      realtime: { params: { eventsPerSecond: 5 } }
    });
  } catch (e) {
    console.error('Supabase init', e);
    App.sb = null;
  }
})();

<script>
/* ===== js/auth.js ===== */
/* ============================================================================
 * auth.js  —  Login con email + contraseña (versión online)
 * ----------------------------------------------------------------------------
 * - Si no hay Supabase configurado -> App.auth.enabled = false (modo local).
 * - Muestra la pantalla de login hasta que el usuario entra.
 * - Bloquea a los usuarios desactivados.
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el;

  if (!App.sb) { App.auth = { enabled: false }; return; }
  var sb = App.sb;
  var readyCb = null;
  var recovering = false; // true mientras se está por el link de "olvidé mi contraseña"

  function fullScreen(node) {
    document.body.innerHTML = '';
    var wrap = el('div', { class: 'auth-screen' }, [node]);
    document.body.appendChild(wrap);
  }

  function card(children) {
    return el('div', { class: 'auth-card' }, [
      el('div', { class: 'auth-brand' }, [
        el('img', { class: 'auth-logo-img', src: App.assets.logo, alt: 'Car Style Mercedes' })
      ])
    ].concat(children));
  }

  function loginScreen(msg) {
    var email = ui.input({ type: 'email', placeholder: 'tu@email.com', autocomplete: 'username', inputmode: 'email' });
    var pass = ui.input({ type: 'password', placeholder: 'Contraseña', autocomplete: 'current-password' });
    var err = el('p', { class: 'auth-err', text: msg || '' });
    // type="submit" implícito: el propio submit del <form> ya llama a submit();
    // si acá también tuviera onclick, un solo click dispararía el login dos veces.
    var btn = el('button', { type: 'submit', class: 'btn btn-primary auth-btn', text: 'Entrar' });

    var form = el('form', { class: 'auth-form', onsubmit: function (e) { e.preventDefault(); submit(); } }, [
      ui.field('Email', email),
      ui.field('Contraseña', pass),
      err,
      btn,
      el('p', { class: 'auth-hint', text: '¿No podés entrar? Pedile al administrador que te dé de alta o te resetee la contraseña.' })
    ]);

    fullScreen(card([el('h2', { text: 'Iniciar sesión' }), form]));
    setTimeout(function () { email.focus(); }, 50);

    function submit() {
      var e = email.value.trim().toLowerCase(), p = pass.value;
      if (!e || !p) { err.textContent = 'Completá email y contraseña.'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
      sb.auth.signInWithPassword({ email: e, password: p }).then(function (res) {
        if (res.error) {
          err.textContent = 'Email o contraseña incorrectos.';
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        start();
      });
    }
  }

  function blockedScreen(profile) {
    return card([
      el('h2', { text: 'Tu usuario está desactivado' }),
      el('p', { class: 'auth-hint', text: 'El administrador todavía no te habilitó o te dio de baja. Contactalo.' }),
      el('button', { class: 'btn btn-ghost auth-btn', text: 'Salir', onclick: function () { sb.auth.signOut().then(function () { location.reload(); }); } })
    ]);
  }

  function errorScreen(txt) {
    return card([
      el('h2', { text: 'No se pudo conectar' }),
      el('p', { class: 'auth-hint', text: txt || 'Revisá tu conexión a internet y volvé a intentar.' }),
      el('button', { class: 'btn btn-primary auth-btn', text: 'Reintentar', onclick: function () { location.reload(); } })
    ]);
  }

  // Pantalla para elegir nueva contraseña, después de tocar el link de recuperación del mail
  function recoveryScreen(msg) {
    var p1 = ui.input({ type: 'password', placeholder: 'Nueva contraseña', autocomplete: 'new-password' });
    var p2 = ui.input({ type: 'password', placeholder: 'Repetir contraseña', autocomplete: 'new-password' });
    var err = el('p', { class: 'auth-err', text: msg || '' });
    var btn = el('button', { type: 'submit', class: 'btn btn-primary auth-btn', text: 'Guardar contraseña' });

    var form = el('form', { class: 'auth-form', onsubmit: function (e) { e.preventDefault(); submit(); } }, [
      ui.field('Nueva contraseña', p1),
      ui.field('Repetir contraseña', p2),
      err,
      btn,
      el('p', { class: 'auth-hint', text: 'Elegí una contraseña de 6 caracteres o más.' })
    ]);

    fullScreen(card([el('h2', { text: 'Elegí tu nueva contraseña' }), form]));
    setTimeout(function () { p1.focus(); }, 50);

    function submit() {
      var a = p1.value, b = p2.value;
      if (!a || a.length < 6) { err.textContent = 'La contraseña tiene que tener 6 caracteres o más.'; return; }
      if (a !== b) { err.textContent = 'Las contraseñas no coinciden.'; return; }
      btn.disabled = true; btn.textContent = 'Guardando…'; err.textContent = '';
      sb.auth.updateUser({ password: a }).then(function (res) {
        if (res.error) {
          err.textContent = 'No se pudo cambiar la contraseña: ' + res.error.message;
          btn.disabled = false; btn.textContent = 'Guardar contraseña';
          return;
        }
        recovering = false;
        start();
      });
    }
  }

  function loadProfile() {
    return sb.auth.getUser().then(function (res) {
      var user = res.data && res.data.user;
      if (!user) return null;
      return sb.from('profiles').select('*').eq('id', user.id).single().then(function (p) {
        var base = { id: user.id, email: user.email, nombre: '', role: 'usuario', activo: false };
        return Object.assign(base, p.data || {}, { authEmail: user.email });
      });
    });
  }

  function start() {
    if (recovering) { recoveryScreen(); return; }
    fullScreen(card([el('h2', { text: 'Cargando…' })]));
    loadProfile().then(function (p) {
      if (recovering) { recoveryScreen(); return; }
      if (!p) { loginScreen(); return; }
      if (!p.activo) { fullScreen(blockedScreen(p)); return; }
      App.auth.profile = p;
      document.body.innerHTML = '';
      if (readyCb) readyCb(p);
    }).catch(function (e) {
      if (recovering) { recoveryScreen(); return; }
      console.error('auth start', e);
      fullScreen(errorScreen());
    });
  }

  App.auth = {
    enabled: true,
    profile: null,
    isAdmin: function () { return !!(App.auth.profile && App.auth.profile.role === 'admin'); },
    logout: function () { sb.auth.signOut().then(function () { location.reload(); }); },
    boot: function (cb) { readyCb = cb; start(); },
    reloadProfile: function () { return loadProfile().then(function (p) { if (p) App.auth.profile = p; return p; }); },
    // llama a la Edge Function que administra usuarios (solo admin)
    adminApi: function (action, payload) {
      return sb.functions.invoke('admin-users', { body: Object.assign({ action: action }, payload || {}) })
        .then(function (res) {
          if (res.error) {
            var msg = (res.error && res.error.message) || 'Error';
            try { if (res.data && res.data.error) msg = res.data.error; } catch (e) {}
            throw new Error(msg);
          }
          if (res.data && res.data.error) throw new Error(res.data.error);
          return res.data;
        });
    }
  };

  sb.auth.onAuthStateChange(function (evt) {
    if (evt === 'PASSWORD_RECOVERY') { recovering = true; recoveryScreen(); return; }
    if (evt === 'SIGNED_OUT') location.reload();
  });
})();
</script>
<script>
/* ===== js/sync.js ===== */
/* ============================================================================
 * sync.js  —  Sincroniza el estado con Supabase (carga + tiempo real + guardado)
 * ----------------------------------------------------------------------------
 * Estrategia: cada entidad (vehículo, movimiento, recordatorio, gasto fijo) es
 * una fila con su objeto completo en JSON. Al cambiar algo localmente se hace
 * un "diff" contra la última versión sincronizada y se suben sólo los cambios.
 * Realtime avisa de los cambios de otros usuarios y se aplican al estado local.
 * ==========================================================================*/
(function () {
  'use strict';
  if (!App.sb) { App.data = null; return; }
  var sb = App.sb, store = App.store;

  var shadow = null;           // clon del estado tal como está en la nube
  var pushTimer = null;
  var applyingRemote = false;
  var TABLES = ['vehicles', 'history', 'reminders', 'fixed_expenses'];
  var ARR = { vehicles: 'vehicles', history: 'history', reminders: 'reminders', fixed_expenses: 'fixedExpenses' };
  var pendingMigration = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function j(o) { return JSON.stringify(o); }

  /* ------------------------------- carga ------------------------------ */
  function loadAll() {
    return Promise.all([
      sb.from('vehicles').select('data'),
      sb.from('history').select('data'),
      sb.from('reminders').select('data'),
      sb.from('fixed_expenses').select('data'),
      sb.from('kv').select('k,data')
    ]).then(function (res) {
      res.forEach(function (r) { if (r.error) throw r.error; });
      var st = store.blankState();
      st.vehicles = (res[0].data || []).map(function (r) { return r.data; });
      st.history = (res[1].data || []).map(function (r) { return r.data; });
      st.reminders = (res[2].data || []).map(function (r) { return r.data; });
      st.fixedExpenses = (res[3].data || []).map(function (r) { return r.data; });
      (res[4].data || []).forEach(function (r) {
        if (r.k === 'settings') st.settings = Object.assign(st.settings, r.data || {});
        if (r.k === 'meta') st.meta = Object.assign(st.meta, r.data || {});
      });

      var vacio = !st.vehicles.length && !st.history.length && !st.reminders.length && !st.fixedExpenses.length;
      var local = null;
      try { local = JSON.parse(localStorage.getItem('paginaToto:v1') || 'null'); } catch (e) {}
      if (vacio && local && (local.vehicles || []).length) pendingMigration = local;

      applyingRemote = true;
      try { store.hydrate(st); } finally { applyingRemote = false; }
      shadow = clone(store.getState());
      subscribe();
    });
  }

  /* ----------------------------- tiempo real -------------------------- */
  function subscribe() {
    var ch = sb.channel('paginatoto-db');
    TABLES.concat(['kv']).forEach(function (t) {
      ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, function (payload) { onRemote(t, payload); });
    });
    ch.subscribe();
  }

  function onRemote(table, payload) {
    var st = store.getState();
    applyingRemote = true;
    try {
      if (table === 'kv') {
        if (payload.eventType === 'DELETE') return;
        var kk = payload.new.k;
        if (kk === 'settings') st.settings = Object.assign({}, st.settings, payload.new.data);
        else if (kk === 'meta') st.meta = Object.assign({}, st.meta, payload.new.data);
      } else {
        var arr = st[ARR[table]];
        if (payload.eventType === 'DELETE') {
          var oid = payload.old && payload.old.id;
          var i = -1; arr.forEach(function (x, k) { if (x.id === oid) i = k; });
          if (i >= 0) arr.splice(i, 1);
        } else {
          var d = payload.new.data;
          var jx = -1; arr.forEach(function (x, k) { if (x.id === d.id) jx = k; });
          if (jx >= 0) arr[jx] = d; else arr.push(d);
        }
      }
      shadow = clone(st);
      store.notify();
    } catch (e) {
      console.error('sync onRemote', e);
    } finally {
      applyingRemote = false;
    }
  }

  /* ------------------------ guardar (diff + subir) ------------------- */
  function onLocalChange(state) {
    if (applyingRemote) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { flush(state); }, 400);
  }

  function diffArr(table, cur, old, ops, tsField) {
    var oldById = {}; (old || []).forEach(function (x) { oldById[x.id] = x; });
    var curIds = {};
    (cur || []).forEach(function (x) {
      curIds[x.id] = true;
      var prev = oldById[x.id];
      if (!prev || j(prev) !== j(x)) {
        var row = { id: x.id, data: x };
        if (tsField) row.ts = x[tsField] || 0;
        ops.up[table].push(row);
      }
    });
    (old || []).forEach(function (x) { if (!curIds[x.id]) ops.del[table].push(x.id); });
  }

  function flush(state) {
    if (!shadow) shadow = clone(state);
    var ops = { up: { vehicles: [], history: [], reminders: [], fixed_expenses: [], kv: [] },
                del: { vehicles: [], history: [], reminders: [], fixed_expenses: [], kv: [] } };
    diffArr('vehicles', state.vehicles, shadow.vehicles, ops);
    diffArr('history', state.history, shadow.history, ops, 'ts');
    diffArr('reminders', state.reminders, shadow.reminders, ops);
    diffArr('fixed_expenses', state.fixedExpenses, shadow.fixedExpenses, ops);
    if (j(state.settings) !== j(shadow.settings)) ops.up.kv.push({ k: 'settings', data: state.settings });
    if (j(state.meta) !== j(shadow.meta)) ops.up.kv.push({ k: 'meta', data: state.meta });

    var promises = [];
    Object.keys(ops.up).forEach(function (t) {
      var key = t === 'kv' ? 'k' : 'id';
      if (ops.up[t].length) promises.push(sb.from(t).upsert(ops.up[t], { onConflict: key }));
      if (ops.del[t].length) promises.push(sb.from(t).delete().in(key, ops.del[t]));
    });
    if (!promises.length) { shadow = clone(state); return Promise.resolve(true); }

    return Promise.all(promises).then(function (results) {
      var bad = null;
      results.forEach(function (r) { if (r && r.error) bad = r.error; });
      if (bad) throw bad;
      shadow = clone(state);
      return true;
    }).catch(function (e) {
      console.error('sync flush', e);
      App.ui && App.ui.toast('No se pudo guardar en la nube. Revisá internet.', 'error');
      // reintenta solo en unos segundos (por si fue un corte momentáneo de internet)
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () { flush(store.getState()); }, 8000);
      return false;
    });
  }

  /* --------------------------- migración inicial -------------------- */
  function pendingMigrationInfo() {
    if (!pendingMigration) return null;
    return { autos: (pendingMigration.vehicles || []).length, recordatorios: (pendingMigration.reminders || []).length };
  }
  function doMigration() {
    if (!pendingMigration) return Promise.resolve();
    var st = store.migrate(pendingMigration);
    pendingMigration = null;
    applyingRemote = true;
    try { store.hydrate(st); } finally { applyingRemote = false; }
    return flush(store.getState()).then(function (ok) {
      if (ok) App.ui && App.ui.toast('Datos subidos a la nube', 'success');
    });
  }
  function skipMigration() { pendingMigration = null; }

  App.data = {
    loadAll: loadAll,
    onLocalChange: onLocalChange,
    flushNow: function () { if (pushTimer) clearTimeout(pushTimer); return flush(store.getState()); },
    pendingMigrationInfo: pendingMigrationInfo,
    doMigration: doMigration,
    skipMigration: skipMigration
  };
})();
</script>
<script>
/* ===== js/forms.js ===== */
/* ============================================================================
 * forms.js  —  Formularios: vehículo, compra, venta, gasto, reserva,
 *              gasto del negocio, recordatorio
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, store = App.store;

  var COMBUSTIBLES = ['Nafta', 'Diésel', 'GNC', 'Híbrido', 'Eléctrico', 'Nafta/GNC'];
  var CHECKLIST_ITEMS = [
    ['mecanica', 'Mecánica revisada'],
    ['aceite', 'Aceite cambiado'],
    ['frenos', 'Frenos revisados'],
    ['neumaticos', 'Neumáticos revisados'],
    ['luces', 'Luces revisadas'],
    ['aire', 'Aire acondicionado'],
    ['interior', 'Interior'],
    ['exterior', 'Exterior'],
    ['documentacion', 'Documentación'],
    ['transferencia', 'Transferencia']
  ];

  function opt(v, l) { return { value: v, label: l }; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function isoD(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }

  /* --------- Constructor de cuotas (a pagar o a cobrar) ------------- */
  function cuotaBuilder(getMoneda, opts) {
    opts = opts || {};
    var cobro = !!opts.cobro;
    var kDone = cobro ? 'cobrada' : 'pagada';
    var kDate = cobro ? 'fechaCobro' : 'fechaPago';
    var lblDone = cobro ? 'Cobrada' : 'Pagada';
    var cuotas = (opts.initial || []).map(function (c) { return Object.assign({}, c); });
    var box = el('div', { class: 'cuotas-builder' });
    var fCant = ui.input({ inputmode: 'numeric', placeholder: 'Ej: 12', style: 'max-width:100px' });
    var fMonto = ui.moneyInput({ placeholder: '0', style: 'max-width:150px' });
    var fPrimer = ui.input({ type: 'date', value: store.todayISO(), style: 'max-width:160px' });
    var gen = el('button', {
      type: 'button', class: 'btn btn-primary btn-sm', text: 'Generar cuotas ›', onclick: function () {
        var n = parseInt(fCant.value, 10), monto = store.num(fMonto.value);
        if (!n || n < 1) { ui.toast('Poné cuántas cuotas', 'error'); return; }
        var base = App.finance.parseDate(fPrimer.value) || new Date();
        cuotas = [];
        for (var i = 0; i < n; i++) {
          var d = new Date(base.getFullYear(), base.getMonth() + i, base.getDate());
          var c = { id: store.uid(cobro ? 'cc' : 'c'), numero: i + 1, monto: monto, vencimiento: isoD(d) };
          c[kDone] = false; c[kDate] = null;
          cuotas.push(c);
        }
        render();
      }
    });
    // Tarjeta simple por cuota (no fila de tabla contable): número, monto,
    // vencimiento editables, y un solo botón de estado. La fecha de
    // pago/cobro ya NO se pide a mano — al marcar la cuota se guarda sola
    // la fecha de hoy (store.todayISO()), y al desmarcarla se borra.
    function render() {
      ui.clear(box);
      if (!cuotas.length) { box.appendChild(el('p', { class: 'form-help', text: 'Todavía no generaste cuotas. Poné la cantidad, el monto y desde cuándo, y tocá "Generar cuotas".' })); return; }
      var totalEl = el('div', { class: 'cuota-total' });
      cuotas.forEach(function (c, i) {
        var fM = ui.moneyInput({ value: c.monto });
        fM.addEventListener('input', function () { c.monto = fM.value; upd(); });
        var fV = ui.input({ type: 'date', value: c.vencimiento });
        fV.addEventListener('input', function () { c.vencimiento = fV.value; });
        var done = !!c[kDone];
        var stateBtn = el('button', {
          type: 'button',
          class: 'btn btn-sm ' + (done ? 'btn-ghost' : 'btn-primary'),
          text: done ? ('✓ ' + lblDone) : ('○ Marcar como ' + lblDone.toLowerCase()),
          onclick: function () {
            c[kDone] = !c[kDone];
            c[kDate] = c[kDone] ? store.todayISO() : null;
            render();
          }
        });
        box.appendChild(el('div', { class: 'card cuota-card' }, [
          el('div', { class: 'card-head' }, [
            el('span', { class: 'cuota-num', text: 'Cuota ' + (i + 1) }),
            el('button', { type: 'button', class: 'mini-btn', text: '✕', title: 'Quitar', onclick: function () { cuotas.splice(i, 1); render(); } })
          ]),
          el('div', { class: 'grid-2' }, [ui.field('Monto', fM), ui.field('Vencimiento', fV)]),
          stateBtn
        ]));
      });
      box.appendChild(totalEl);
      function upd() {
        var t = cuotas.reduce(function (s, x) { return s + store.num(x.monto); }, 0);
        totalEl.textContent = 'Total en cuotas: ' + App.fmt.money(t, getMoneda());
      }
      upd();
    }
    render();
    return {
      section: el('div', {}, [
        el('div', { class: 'inline-fields' }, [
          ui.field('Cantidad de cuotas', fCant),
          ui.field('Monto de cada una', fMonto),
          ui.field('Primer vencimiento', fPrimer, 'Se generan mensuales, una por mes'),
          gen
        ]),
        box
      ]),
      render: render,
      getCuotas: function () { return cuotas.slice(); }
    };
  }

  /* --------- Bloque de comisión a un tercero (opcional) ------------ */
  function comisionBlock(com) {

  // --- Campos de "Compra" reutilizables entre registrar (nuevo) y editar
  // (desde dentro de "Editar vehículo", para poder corregir el precio de
  // compra sin ir a un formulario aparte). Reusa exactamente store.setPurchase.
  function compraFieldsBuilder(p) {
    p = p || {};
    var fFecha = ui.input({ type: 'date', value: p.fecha || store.todayISO() });
    var precio = ui.money2('vfCompra', p.precio || '', p.moneda || 'ARS');
    var fCotiz = ui.moneyInput({ value: p.cotizacionUSD || '', placeholder: '1500' });
    var cotizField = ui.field('Cotización USD', fCotiz, 'Valor del dólar al momento de la compra');
    function syncCotiz() { cotizField.hidden = precio.moneda.value !== 'ARS'; }
    precio.moneda.addEventListener('change', syncCotiz);
    syncCotiz();
    var fForma = ui.select([opt('transferencia', 'Transferencia'), opt('efectivo', 'Efectivo'), opt('mixto', 'Mitad transferencia / mitad efectivo'), opt('cuotas', 'En cuotas')], p.formaPago || 'transferencia');
    var fTransf = ui.moneyInput({ value: p.montoTransferencia || '', placeholder: 'Monto transferencia' });
    var fEfec = ui.moneyInput({ value: p.montoEfectivo || '', placeholder: 'Monto efectivo' });
    var mixtoError = el('p', { class: 'auth-err', hidden: true });
    var mixtoBox = el('div', {}, [el('div', { class: 'grid-2' }, [ui.field('Monto por transferencia', fTransf), ui.field('Monto en efectivo', fEfec)]), mixtoError]);
    function checkMixto() {
      if (fForma.value !== 'mixto') { mixtoError.hidden = true; return true; }
      var total = store.num(precio.monto.value);
      var sum = store.num(fTransf.value) + store.num(fEfec.value);
      var ok = Math.abs(total - sum) <= 0.01;
      mixtoError.hidden = ok;
      if (!ok) mixtoError.textContent = 'Transferencia + efectivo (' + App.fmt.money(sum) + ') no coincide con el precio total (' + App.fmt.money(total) + ').';
      return ok;
    }
    [fTransf, fEfec].forEach(function (i) { i.addEventListener('input', checkMixto); });
    precio.monto.addEventListener('input', checkMixto);
    fForma.addEventListener('change', checkMixto);
    var cuotas = cuotaBuilder(function () { return precio.moneda.value; }, { initial: p.cuotas });
    var pr = p.proveedor || {};
    var fProvNom = ui.input({ value: pr.nombre || '', placeholder: 'Nombre (opcional)' });
    var fProvTel = ui.input({ value: pr.telefono || '', placeholder: 'Teléfono (opcional)' });
    function sync() { mixtoBox.hidden = fForma.value !== 'mixto'; cuotas.section.hidden = fForma.value !== 'cuotas'; }
    fForma.addEventListener('change', sync);
    sync(); checkMixto();
    // Cotización USD queda siempre visible junto al precio de compra (no es
    // un dato secundario: hace falta para poder comparar en dólares). Fecha
    // de compra y proveedor/vendedor sí son secundarios — se completan solos
    // o se cargan después — y quedan detrás de "+ Más datos" (mismo patrón
    // que Alertas).
    var provBox = el('div', { hidden: !(pr.nombre || pr.telefono) }, [
      ui.field('Fecha de compra', fFecha),
      el('div', { class: 'grid-2' }, [ui.field('Proveedor / vendedor', fProvNom), ui.field('Teléfono', fProvTel)])
    ]);
    var provToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: provBox.hidden ? '＋ Más datos de la compra' : '－ Menos datos', onclick: function () {
      provBox.hidden = !provBox.hidden;
      provToggle.textContent = provBox.hidden ? '＋ Más datos de la compra' : '－ Menos datos';
    } });
    var node = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [ui.field('Precio de compra', precio.wrap), cotizField]),
      ui.field('Forma de pago', fForma),
      mixtoBox,
      cuotas.section,
      provToggle, provBox
    ]);
    return {
      node: node,
      hasPrice: function () { return store.num(precio.monto.value) > 0; },
      isValid: checkMixto,
      getData: function () {
        return {
          fecha: fFecha.value, precio: precio.monto.value, moneda: precio.moneda.value,
          cotizacionUSD: fCotiz.value,
          formaPago: fForma.value, montoTransferencia: fTransf.value, montoEfectivo: fEfec.value,
          cuotas: fForma.value === 'cuotas' ? cuotas.getCuotas() : [],
          proveedor: { nombre: fProvNom.value, telefono: fProvTel.value, notas: pr.notas || '' }
        };
      }
    };
  }

  // --- Campos de "Consignación": el vehículo sigue siendo del dueño; el
  // negocio NO lo compra (no se llama a store.setPurchase). Lo que le
  // corresponde al dueño se descuenta al vender (ver finance.js). ---
  function consignacionFieldsBuilder(o) {
    o = o || {};
    var fDuenio = ui.input({ value: (o.duenio && o.duenio.nombre) || '', placeholder: 'Nombre del dueño' });
    var fTelDuenio = ui.input({ value: (o.duenio && o.duenio.telefono) || '', placeholder: 'Teléfono (opcional)' });
    var precioDueno = ui.money2('vfConsig', o.precioDueno || '', o.monedaDueno || 'ARS');
    var fFecha = ui.input({ type: 'date', value: o.fecha || store.todayISO() });
    var fCotiz = ui.moneyInput({ value: o.cotizacionUSD || '', placeholder: '1500' });
    var cotizField = ui.field('Cotización del dólar (opcional)', fCotiz, 'Sirve para comparar en dólares más adelante');
    var fNotas = ui.textarea({ value: o.notas || '', rows: 2, placeholder: 'Condiciones, observaciones (opcional)' });
    function sync() { cotizField.hidden = precioDueno.moneda.value !== 'ARS'; }
    precioDueno.moneda.addEventListener('change', sync); sync();
    // Teléfono del dueño, cotización y notas son secundarios para arrancar
    // una consignación: quedan detrás de "+ Más datos".
    var hayExtra = !!(o.duenio && o.duenio.telefono) || !!o.cotizacionUSD || !!o.notas;
    var extraBox = el('div', { hidden: !hayExtra }, [ui.field('Teléfono del dueño', fTelDuenio), cotizField, ui.field('Notas / condiciones', fNotas)]);
    var extraToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: extraBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      extraBox.hidden = !extraBox.hidden;
      extraToggle.textContent = extraBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });
    var node = el('div', { class: 'form-grid' }, [
      ui.field('Dueño del vehículo', fDuenio),
      el('div', { class: 'grid-2' }, [ui.field('Precio que pide el dueño', precioDueno.wrap), ui.field('Fecha de ingreso', fFecha)]),
      extraToggle, extraBox
    ]);
    return {
      node: node,
      hasOwnerName: function () { return !!fDuenio.value.trim(); },
      getData: function () {
        return {
          type: 'consignacion',
          duenio: { nombre: fDuenio.value.trim(), telefono: fTelDuenio.value.trim() },
          precioDueno: precioDueno.monto.value, monedaDueno: precioDueno.moneda.value,
          cotizacionUSD: fCotiz.value, fecha: fFecha.value, notas: fNotas.value
        };
      }
    };
  }

  /* ===================== PÁGINA: REGISTRAR / EDITAR VEHÍCULO ============= */
  // Antes era un modal grande con scroll interno; ahora es una página completa
  // (misma app, solo mejor organizada). Sigue usando EXACTAMENTE las mismas
  // funciones de guardado de siempre: store.createVehicle / store.updateVehicle
  // para los datos del vehículo, y store.setPurchase para la compra (la misma
  // que usa "Editar compra" en la ficha) — tanto al registrar como, ahora
  // también, al editar un vehículo existente.
  function vehicleFormView(root, vehicleId) {
    var existing = vehicleId ? store.getVehicle(vehicleId) : null;
    var isEdit = !!existing;
    var v = existing || {};
    var esConsignacion = !!(v.origin && v.origin.type === 'consignacion');

    var fMarca = ui.input({ value: v.marca || '', required: true, placeholder: 'Toyota' });
    var fModelo = ui.input({ value: v.modelo || '', required: true, placeholder: 'Corolla' });
    var fAnio = ui.input({ value: v.anio || '', inputmode: 'numeric', placeholder: '2016' });
    var fPatente = ui.input({ value: v.patente || '', placeholder: 'AB123CD', style: 'text-transform:uppercase' });
    var fKm = ui.moneyInput({ value: v.km != null ? v.km : '', placeholder: '98.000' });
    var fComb = ui.select([opt('', '—')].concat(COMBUSTIBLES.map(function (c) { return opt(c, c); })), v.combustible || '');
    var fCaja = ui.select([opt('', '—'), opt('manual', 'Manual'), opt('automatica', 'Automática')], v.caja || '');
    var fVersion = ui.input({ value: v.version || '', placeholder: 'XEI 1.8 CVT' });
    var fEstado = ui.select([opt('stock', 'En stock'), opt('reservado', 'Reservado'), opt('vendido', 'Vendido')], v.estado || 'stock');
    var fDoc = ui.select([opt('completa', 'Completa'), opt('pendiente', 'Pendiente'), opt('transferencia', 'Transferencia pendiente'), opt('otro', 'Otro')], v.documentacion || 'pendiente');
    var pretendido = ui.money2('pretendido', v.precioPretendido || '', v.precioPretendidoMoneda || 'ARS');
    var fObs = ui.textarea({ value: v.observaciones || '', rows: 4, placeholder: 'Cualquier información relevante del vehículo...' });

    // --- Origen: Compra o Consignación (solo al REGISTRAR un vehículo nuevo;
    // no se puede cambiar el origen de un vehículo ya existente). ---
    var origenCard, origenMode = 'compra', compraBuilder, consigBuilder;
    if (!isEdit) {
      compraBuilder = compraFieldsBuilder();
      consigBuilder = consignacionFieldsBuilder();
      var segCompra = el('button', { type: 'button', class: 'seg is-active', text: 'Compra' });
      var segConsig = el('button', { type: 'button', class: 'seg', text: 'Consignación' });
      function setOrigenMode(mode) {
        origenMode = mode;
        segCompra.classList.toggle('is-active', mode === 'compra');
        segConsig.classList.toggle('is-active', mode === 'consignacion');
        compraBuilder.node.hidden = mode !== 'compra';
        consigBuilder.node.hidden = mode !== 'consignacion';
      }
      segCompra.addEventListener('click', function () { setOrigenMode('compra'); });
      segConsig.addEventListener('click', function () { setOrigenMode('consignacion'); });
      origenCard = el('div', { class: 'card' }, [
        el('h3', { text: 'Origen del vehículo' }),
        el('div', { class: 'seg-control' }, [segCompra, segConsig]),
        el('p', { class: 'form-help', text: 'Compra: opcional, la podés cargar después. Consignación: el dueño lo entrega para que lo vendas vos — el negocio no lo compra, solo se queda con la diferencia al venderlo.' }),
        compraBuilder.node, consigBuilder.node
      ]);
      setOrigenMode('compra');
    }

    // --- Edición: permite corregir la compra (o los datos de consignación)
    // de un vehículo ya existente, sin ir a un formulario aparte. ---
    var editCompraBuilder = null, editConsigBuilder = null, editOrigenCard = null;
    if (isEdit && esConsignacion) {
      editConsigBuilder = consignacionFieldsBuilder(v.origin);
      editOrigenCard = el('div', { class: 'card' }, [el('h3', { text: '🤝 Consignación' }), editConsigBuilder.node]);
    } else if (isEdit && v.purchase) {
      editCompraBuilder = compraFieldsBuilder(v.purchase);
      editOrigenCard = el('div', { class: 'card' }, [
        el('h3', { text: 'Compra' }),
        el('p', { class: 'form-help', text: 'Corregí el precio u otros datos de la compra. La inversión, la ganancia y toda la economía se recalculan solas.' }),
        editCompraBuilder.node
      ]);
    }

    // Marca/Modelo/Año (obligatorios) y Versión quedan siempre visibles en
    // "Datos de versión". Patente/Km/Combustible/Caja/Estado/Documentación
    // son secundarios para cargar rápido: quedan detrás de su propio
    // "＋ Más datos", pegado justo debajo de "Datos de versión" y antes de
    // "Origen del vehículo" — igual que ya empieza abierto si el vehículo
    // (en edición) ya tiene alguno de esos datos cargados.
    var datosVersionCard = el('div', { class: 'card' }, [
      el('h3', { text: 'Datos de versión' }),
      el('div', { class: 'grid-2' }, [
        ui.field('Marca *', fMarca), ui.field('Modelo *', fModelo),
        ui.field('Año', fAnio), ui.field('Versión', fVersion)
      ])
    ]);
    var hayVersionExtra = !!(v.patente || v.km != null || v.combustible || v.caja
      || (v.estado && v.estado !== 'stock') || (v.documentacion && v.documentacion !== 'pendiente'));
    var versionMasDatosBox = el('div', { class: 'card', hidden: !hayVersionExtra }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Patente', fPatente), ui.field('Kilometraje', fKm),
        ui.field('Combustible', fComb), ui.field('Tipo de caja', fCaja),
        ui.field('Estado', fEstado), ui.field('Documentación', fDoc)
      ])
    ]);
    var versionMasDatosToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: versionMasDatosBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      versionMasDatosBox.hidden = !versionMasDatosBox.hidden;
      versionMasDatosToggle.textContent = versionMasDatosBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });
    var hayInfoExtra = !!(v.precioPretendido || v.observaciones);
    var masDatosBox = el('div', { class: 'card', hidden: !hayInfoExtra }, [
      el('h3', { text: 'Información adicional' }),
      ui.field('Precio pretendido (opcional)', pretendido.wrap, 'Se usa para estimar el valor del stock'),
      ui.field('Observaciones', fObs)
    ]);
    var masDatosToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      masDatosBox.hidden = !masDatosBox.hidden;
      masDatosToggle.textContent = masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });

    var page = el('div', { class: 'page vehicle-form-page' }, [
      el('a', { class: 'back-link', href: isEdit ? '#/vehiculo/' + v.id : '#/', html: '‹ Volver' }),
      el('h1', { text: isEdit ? 'Editar vehículo' : 'Registrar vehículo' }),

      datosVersionCard,
      versionMasDatosToggle, versionMasDatosBox,

      origenCard,
      editOrigenCard,

      masDatosToggle, masDatosBox,

      el('div', { class: 'form-actions' }, [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { App.router.go(isEdit ? 'vehiculo/' + v.id : ''); } }),
        el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar cambios' : 'Registrar vehículo', onclick: submit })
      ])
    ]);

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fMarca.value.trim() || !fModelo.value.trim()) { ui.toast('Marca y modelo son obligatorios', 'error'); return; }
      if (!isEdit && origenMode === 'compra' && compraBuilder.hasPrice() && !compraBuilder.isValid()) { ui.toast('Los importes de la compra no coinciden con el total', 'error'); return; }
      if (!isEdit && origenMode === 'consignacion' && !consigBuilder.hasOwnerName()) { ui.toast('Ingresá el nombre del dueño', 'error'); return; }
      if (editCompraBuilder && editCompraBuilder.hasPrice() && !editCompraBuilder.isValid()) { ui.toast('Los importes de la compra no coinciden con el total', 'error'); return; }
      submitted = true;
      var data = {
        marca: fMarca.value, modelo: fModelo.value, anio: fAnio.value, patente: fPatente.value,
        km: fKm.value, combustible: fComb.value, caja: fCaja.value, version: fVersion.value,
        estado: fEstado.value, documentacion: fDoc.value,
        precioPretendido: pretendido.monto.value, precioPretendidoMoneda: pretendido.moneda.value,
        observaciones: fObs.value
      };
      if (!isEdit && origenMode === 'consignacion') data.origin = consigBuilder.getData();
      if (isEdit && editConsigBuilder) data.origin = editConsigBuilder.getData();

      if (isEdit) {
        store.updateVehicle(v.id, data);
        if (editCompraBuilder && editCompraBuilder.hasPrice()) store.setPurchase(v.id, editCompraBuilder.getData());
        ui.toast('Vehículo actualizado', 'success');
        App.router.go('vehiculo/' + v.id);
        return;
      }
      var nv = store.createVehicle(data);
      if (origenMode === 'compra' && compraBuilder.hasPrice()) store.setPurchase(nv.id, compraBuilder.getData());
      ui.toast(origenMode === 'consignacion' ? 'Consignación registrada' : 'Vehículo registrado', 'success');
      App.router.go('vehiculo/' + nv.id);
    }

    root.appendChild(page);
  }

  /* ============================ FORM COMPRA ============================= */
  function purchaseForm(vehicleId) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var p = v.purchase || {};

    var fFecha = ui.input({ type: 'date', value: p.fecha || store.todayISO() });
    var precio = ui.money2('precio', p.precio || '', p.moneda || 'ARS');
    var fCotiz = ui.moneyInput({ value: p.cotizacionUSD || '', placeholder: '1500' });
    var cotizField = ui.field('Cotización del dólar al momento de la compra', fCotiz, 'Se guarda como valor histórico y no cambia luego');

    var fForma = ui.select([opt('transferencia', 'Transferencia'), opt('efectivo', 'Efectivo'), opt('mixto', 'Mitad transferencia / mitad efectivo'), opt('cuotas', 'En cuotas')], p.formaPago || 'transferencia');
    var fTransf = ui.moneyInput({ value: p.montoTransferencia || '', placeholder: 'Monto transferencia' });
    var fEfec = ui.moneyInput({ value: p.montoEfectivo || '', placeholder: 'Monto efectivo' });
    var mixtoError = el('p', { class: 'auth-err', hidden: true });
    var mixtoBox = el('div', {}, [
      el('div', { class: 'grid-2' }, [ui.field('Monto por transferencia', fTransf), ui.field('Monto en efectivo', fEfec)]),
      mixtoError
    ]);
    function checkMixto() {
      if (fForma.value !== 'mixto') { mixtoError.hidden = true; return true; }
      var total = store.num(precio.monto.value);
      var sum = store.num(fTransf.value) + store.num(fEfec.value);
      var ok = Math.abs(total - sum) <= 0.01;
      mixtoError.hidden = ok;
      if (!ok) mixtoError.textContent = 'Transferencia + efectivo (' + App.fmt.money(sum) + ') no coincide con el precio total (' + App.fmt.money(total) + ').';
      return ok;
    }
    [fTransf, fEfec].forEach(function (i) { i.addEventListener('input', checkMixto); });
    precio.monto.addEventListener('input', checkMixto);
    fForma.addEventListener('change', checkMixto);

    var cb = cuotaBuilder(function () { return precio.moneda.value; }, { initial: p.cuotas });
    var cuotasSection = cb.section;

    var pr = p.proveedor || {};
    var fProvNom = ui.input({ value: pr.nombre || '', placeholder: 'Nombre (opcional)' });
    var fProvTel = ui.input({ value: pr.telefono || '', placeholder: 'Teléfono (opcional)' });
    var fProvNotas = ui.textarea({ value: pr.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    var comision = comisionBlock(p.comision);

    function syncForma() {
      var f = fForma.value;
      mixtoBox.hidden = f !== 'mixto';
      cuotasSection.hidden = f !== 'cuotas';
    }
    fForma.addEventListener('change', syncForma);
    function syncCotiz() { cotizField.hidden = precio.moneda.value !== 'ARS'; }
    precio.moneda.addEventListener('change', function () { syncCotiz(); cb.render(); });

    // Vendedor/proveedor y comisión son secundarios: detrás de "+ Más datos".
    var hayMasDatos = !!(pr.nombre || pr.telefono || pr.notas || (p.comision && p.comision.monto));
    var masDatosBox = el('div', { hidden: !hayMasDatos }, [
      el('div', { class: 'form-section-title', text: 'Vendedor / proveedor (opcional)' }),
      el('div', { class: 'grid-2' }, [ui.field('Nombre', fProvNom), ui.field('Teléfono', fProvTel)]),
      ui.field('Otros datos', fProvNotas),
      el('div', { class: 'form-section-title', text: 'Comisión pagada a un tercero (opcional)' }),
      comision.wrap
    ]);
    var masDatosToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      masDatosBox.hidden = !masDatosBox.hidden;
      masDatosToggle.textContent = masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Fecha de compra', fFecha),
        ui.field('Precio de compra', precio.wrap)
      ]),
      cotizField,
      el('div', { class: 'form-section-title', text: 'Forma de pago' }),

      mixtoBox,
      cuotasSection,
      masDatosToggle, masDatosBox
    ]);

    var m = ui.modal({
      title: v.purchase ? 'Editar compra' : 'Registrar compra',
      size: 'lg', body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar compra', onclick: submit })
      ]
    });
    syncForma(); syncCotiz(); checkMixto();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(precio.monto.value) <= 0) { ui.toast('Ingresá el precio de compra', 'error'); return; }
      if (precio.moneda.value === 'ARS' && store.num(fCotiz.value) <= 0) {
        ui.toast('Ingresá la cotización del dólar de la compra', 'error'); return;
      }
      if (!checkMixto()) { ui.toast('Los importes no coinciden con el total', 'error'); return; }

      var data = {
        fecha: fFecha.value, precio: precio.monto.value, moneda: precio.moneda.value,
        cotizacionUSD: fCotiz.value,
        formaPago: fForma.value,
        montoTransferencia: fTransf.value, montoEfectivo: fEfec.value,
        cuotas: fForma.value === 'cuotas' ? cb.getCuotas() : [],
        proveedor: { nombre: fProvNom.value, telefono: fProvTel.value, notas: fProvNotas.value },
        comision: comision.get()
      };
      store.setPurchase(v.id, data);
      ui.toast('Compra registrada', 'success');
      m.close();
    }
    return m;
  }

  /* ============================ FORM VENTA ============================= */
  function saleForm(vehicleId) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var esConsignacion = !!(v.origin && v.origin.type === 'consignacion');
    if (!v.purchase && !esConsignacion) { ui.toast('Primero registrá la compra del vehículo', 'error'); return; }
    var s = v.sale || {};

    var fFecha = ui.input({ type: 'date', value: s.fecha || store.todayISO() });
    var precio = ui.money2('venta', s.precio || '', s.moneda || 'ARS');
    var fCotiz = ui.moneyInput({ value: s.cotizacionUSD || '', placeholder: '1600' });
    var cotizField = ui.field('Cotización del dólar al momento de la venta', fCotiz, 'Valor histórico, no cambia luego');
    var fForma = ui.select([
      opt('transferencia', 'Transferencia'), opt('efectivo', 'Efectivo'),
      opt('mixto', 'Mitad transferencia / mitad efectivo'),
      opt('financiado', 'Financiado / con prenda (en cuotas)'),
      opt('vehiculo', 'Entrega de otro vehículo como parte de pago')
    ], s.formaCobro || 'transferencia');
    var fTransf = ui.moneyInput({ value: s.montoTransferencia || '', placeholder: 'Monto transferencia' });
    var fEfec = ui.moneyInput({ value: s.montoEfectivo || '', placeholder: 'Monto efectivo' });
    var mixtoError = el('p', { class: 'auth-err', hidden: true });
    var mixtoBox = el('div', {}, [
      el('div', { class: 'grid-2' }, [ui.field('Monto por transferencia', fTransf), ui.field('Monto en efectivo', fEfec)]),
      mixtoError
    ]);
    function checkMixto() {
      if (fForma.value !== 'mixto') { mixtoError.hidden = true; return true; }
      var total = store.num(precio.monto.value);
      var sum = store.num(fTransf.value) + store.num(fEfec.value);
      var ok = Math.abs(total - sum) <= 0.01;
      mixtoError.hidden = ok;
      if (!ok) mixtoError.textContent = 'Transferencia + efectivo (' + App.fmt.money(sum) + ') no coincide con el precio total (' + App.fmt.money(total) + ').';
      return ok;
    }
    [fTransf, fEfec].forEach(function (i) { i.addEventListener('input', checkMixto); });
    precio.monto.addEventListener('input', checkMixto);
    fForma.addEventListener('change', checkMixto);

    // financiación (cuotas a cobrar)
    var f = s.financiacion || {};
    var finEntidad = ui.input({ value: f.entidad || '', placeholder: 'Banco / financiera / particular' });
    var finEntrega = ui.money2('finEntrega', f.entrega || '', f.moneda || (s.moneda || 'ARS'));
    var finNotas = ui.textarea({ value: f.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });
    var finCb = cuotaBuilder(function () { return finEntrega.moneda.value; }, { cobro: true, initial: f.cuotas });
    var finBox = el('div', { class: 'trade-in-box' }, [
      el('div', { class: 'grid-2' }, [ui.field('Entidad / quién financia', finEntidad), ui.field('Anticipo / entrega', finEntrega.wrap)]),
      el('p', { class: 'form-help', text: 'Cargá las cuotas que te van a pagar. La app te va a avisar cuando venza cada una.' }),
      finCb.section,
      ui.field('Notas', finNotas)
    ]);

    // trade-in
    var ti = s.tradeIn || {};
    var tiEnabled = el('input', { type: 'checkbox' });
    tiEnabled.checked = !!s.tradeIn;
    var tiMarca = ui.input({ value: ti.marca || '', placeholder: 'Marca' });
    var tiModelo = ui.input({ value: ti.modelo || '', placeholder: 'Modelo' });
    var tiAnio = ui.input({ value: ti.anio || '', inputmode: 'numeric', placeholder: 'Año' });
    var tiPat = ui.input({ value: ti.patente || '', placeholder: 'Patente', style: 'text-transform:uppercase' });
    var tiKm = ui.input({ value: ti.km || '', inputmode: 'numeric', placeholder: 'Kilometraje' });
    var tiValor = ui.money2('tiValor', ti.valor || '', ti.moneda || 'ARS');
    var tiObs = ui.textarea({ value: ti.observaciones || '', rows: 2, placeholder: 'Observaciones del vehículo recibido' });
    var tiLinkNote = el('p', { class: 'form-help' });
    if (ti.vehicleId) tiLinkNote.textContent = 'Este vehículo ya fue incorporado al stock. Editá sus datos desde su propia ficha.';

    // La diferencia (precio de venta − valor asignado al vehículo recibido)
    // ya no se pide a mano: se calcula sola y se muestra solo como
    // información, igual que "Ganancia estimada" en el preview de arriba.
    // No afecta la ganancia (finance.js la calcula a partir de v.sale.precio
    // solamente) — diferenciaARS es puramente informativo/de Excel.
    var tiDifStrong = el('strong', {});
    var tiDiferenciaRow = el('div', { class: 'sale-preview-row' }, [el('span', { text: 'Diferencia a cobrar (calculada)' }), tiDifStrong]);
    function tiDiferenciaARS() {
      var sRate = store.num(fCotiz.value) || App.finance.currentRate();
      var ventaARS = App.finance.toARS(store.num(precio.monto.value), precio.moneda.value, sRate);
      var tiARS = App.finance.toARS(store.num(tiValor.monto.value), tiValor.moneda.value, sRate);
      return ventaARS - tiARS;
    }

    // Cómo se cobró esa diferencia (efectivo / transferencia / combinación):
    // mismos inputs y misma validación de "no coincide" que ya usa el precio
    // de venta cuando la forma de cobro es "mixto" — nada nuevo, reutilizado.
    // Solo aparece si hay una diferencia real a cobrar (tiEnabled + dif > 0).
    var difIni = s.diferencia || {};
    var tiDifEfec = ui.moneyInput({ value: difIni.montoEfectivo || '', placeholder: '0' });
    var tiDifTransf = ui.moneyInput({ value: difIni.montoTransferencia || '', placeholder: '0' });
    var tiDifError = el('p', { class: 'auth-err', hidden: true });
    var tiDifFormaBox = el('div', { hidden: true }, [
      el('div', { class: 'form-section-title', text: 'Forma de pago de la diferencia' }),
      el('div', { class: 'grid-2' }, [ui.field('Efectivo', tiDifEfec), ui.field('Transferencia', tiDifTransf)]),
      tiDifError
    ]);
    function checkTiDif() {
      var dif = tiDiferenciaARS();
      if (!tiEnabled.checked || dif <= 0.01) { tiDifError.hidden = true; return true; }
      var sum = store.num(tiDifEfec.value) + store.num(tiDifTransf.value);
      var falta = dif - sum;
      if (Math.abs(falta) <= 0.01) { tiDifError.hidden = true; return true; }
      tiDifError.hidden = false;
      tiDifError.textContent = falta > 0
        ? 'Todavía faltan ' + App.fmt.money(falta) + ' para completar la diferencia.'
        : 'Ingresaste ' + App.fmt.money(-falta) + ' de más.';
      return false;
    }
    [tiDifEfec, tiDifTransf].forEach(function (i) { i.addEventListener('input', checkTiDif); });

    function updateTiDiferencia() {
      var dif = tiDiferenciaARS();
      tiDifStrong.textContent = App.fmt.money(dif);
      tiDifStrong.className = dif >= 0 ? 'pos' : 'neg';
      tiDifFormaBox.hidden = !(tiEnabled.checked && dif > 0.01);
      checkTiDif();
    }
    [precio.monto, precio.moneda, fCotiz, tiValor.monto, tiValor.moneda].forEach(function (i) {
      i.addEventListener('input', updateTiDiferencia); i.addEventListener('change', updateTiDiferencia);
    });

    var tiBox = el('div', { class: 'trade-in-box' }, [
      el('div', { class: 'grid-2' }, [
        ui.field('Marca', tiMarca), ui.field('Modelo', tiModelo),
        ui.field('Año', tiAnio), ui.field('Patente', tiPat),
        ui.field('Kilometraje', tiKm), ui.field('Valor asignado', tiValor.wrap)
      ]),
      ui.field('Observaciones', tiObs),
      tiDiferenciaRow,
      tiDifFormaBox,
      tiLinkNote
    ]);

    function syncForma() {
      var vf = fForma.value;
      mixtoBox.hidden = vf !== 'mixto';
      finBox.hidden = vf !== 'financiado';
      if (vf === 'financiado') { finCb.render(); }
      if (vf === 'vehiculo') { tiEnabled.checked = true; }
      syncTi();
    }
    function syncTi() {
      tiBox.hidden = !tiEnabled.checked;
      var inputs = tiBox.querySelectorAll('input,textarea,select,button');
      Array.prototype.forEach.call(inputs, function (i) { i.disabled = !!ti.vehicleId; });
      updateTiDiferencia();
    }
    tiEnabled.addEventListener('change', syncTi);
    fForma.addEventListener('change', syncForma);
    function syncCotiz() { cotizField.hidden = precio.moneda.value !== 'ARS'; }
    precio.moneda.addEventListener('change', syncCotiz);

    var cl = s.cliente || {};
    var clNom = ui.input({ value: cl.nombre || '', placeholder: 'Nombre (opcional)' });
    var clTel = ui.input({ value: cl.telefono || '', placeholder: 'Teléfono (opcional)' });
    var clNotas = ui.textarea({ value: cl.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    var comision = comisionBlock(s.comision);

    var preview = el('div', { class: 'sale-preview' });
    function updatePreview() {
      // Sin precio todavía no hay nada que calcular: mostrar un estado neutro
      // en vez de "-100%" en rojo, que se lee como un error.
      if (store.num(precio.monto.value) <= 0) {
        ui.clear(preview);
        preview.appendChild(el('p', { class: 'form-help', text: 'Ingresá el precio de venta para calcular la ganancia.' }));
        return;
      }
      var m = App.finance.vehicleMetrics(v);
      var sRate = store.num(fCotiz.value) || App.finance.currentRate();
      var ventaARS = precio.moneda.value === 'USD' ? store.num(precio.monto.value) * sRate : store.num(precio.monto.value);
      // en consignación no "compramos" el auto: lo que hay que descontar de la
      // venta es lo que le corresponde al dueño, no un costo de compra propio.
      var precioDuenoARS = esConsignacion && v.origin.precioDueno ? App.finance.toARS(v.origin.precioDueno, v.origin.monedaDueno || 'ARS', sRate) : 0;
      var costo = m.inversionARS + m.comisionCompraARS + precioDuenoARS + (store.num(comision.get() && comision.get().monto) || 0);
      var gan = ventaARS - costo;
      var rent = costo ? gan / costo * 100 : 0;
      ui.clear(preview);
      preview.appendChild(el('div', { class: 'sale-preview-row' }, [
        el('span', { text: esConsignacion ? 'Le corresponde al dueño + gastos + comisión' : 'Lo que pusiste (compra + gastos + comisión)' }), el('strong', { text: App.fmt.money(costo) })
      ]));
      preview.appendChild(el('div', { class: 'sale-preview-row' }, [
        el('span', { text: 'Ganancia estimada' }),
        el('strong', { class: gan >= 0 ? 'pos' : 'neg', text: App.fmt.money(gan) + '  (' + App.fmt.pct(rent) + ')' })
      ]));
    }
    [precio.monto, precio.moneda, fCotiz].forEach(function (i) { i.addEventListener('input', updatePreview); i.addEventListener('change', updatePreview); });

    // Cliente y comisión son datos secundarios para registrar la venta:
    // quedan detrás de "+ Más datos" (mismo patrón que Alertas).
    var hayMasDatos = !!(cl.nombre || cl.telefono || cl.notas || (s.comision && s.comision.monto));
    var masDatosBox = el('div', { hidden: !hayMasDatos }, [
      el('div', { class: 'form-section-title', text: 'Cliente (opcional)' }),
      el('div', { class: 'grid-2' }, [ui.field('Nombre', clNom), ui.field('Teléfono', clTel)]),
      ui.field('Otros datos', clNotas),
      el('div', { class: 'form-section-title', text: 'Comisión pagada a un tercero (opcional)' }),
      comision.wrap
    ]);
    var masDatosToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      masDatosBox.hidden = !masDatosBox.hidden;
      masDatosToggle.textContent = masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [ui.field('Fecha de venta', fFecha), ui.field('Precio de venta', precio.wrap)]),
      cotizField,
      preview,
      el('div', { class: 'form-section-title', text: 'Forma de cobro' }),
      ui.field('', fForma),
      mixtoBox,
      finBox,
      el('div', { class: 'form-section-title', text: 'Vehículo recibido como parte de pago' }),
      el('label', { class: 'check-inline' }, [tiEnabled, el('span', { text: 'Se recibió otro vehículo como parte de pago' })]),
      tiBox,
      masDatosToggle, masDatosBox
    ]);

    var m = ui.modal({
      title: v.sale ? 'Editar venta' : 'Registrar venta',
      size: 'lg', body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar venta', onclick: submit })
      ]
    });
    syncForma(); syncCotiz(); updatePreview(); checkMixto(); updateTiDiferencia();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(precio.monto.value) <= 0) { ui.toast('Ingresá el precio de venta', 'error'); return; }
      if (precio.moneda.value === 'ARS' && store.num(fCotiz.value) <= 0) { ui.toast('Ingresá la cotización del dólar de la venta', 'error'); return; }
      if (!checkMixto()) { ui.toast('Los importes no coinciden con el total', 'error'); return; }
      var tradeIn = null;
      if (tiEnabled.checked && !ti.vehicleId) {
        if (!tiMarca.value.trim() || !tiModelo.value.trim()) { ui.toast('Completá marca y modelo del vehículo recibido', 'error'); return; }
        if (store.num(tiValor.monto.value) <= 0) { ui.toast('Ingresá el valor asignado al vehículo recibido', 'error'); return; }
        tradeIn = {
          enabled: true, marca: tiMarca.value, modelo: tiModelo.value, anio: tiAnio.value,
          patente: tiPat.value, km: tiKm.value, valor: tiValor.monto.value, moneda: tiValor.moneda.value,
          observaciones: tiObs.value
        };
      } else if (ti.vehicleId) {
        tradeIn = { enabled: true, vehicleId: ti.vehicleId, marca: ti.marca, modelo: ti.modelo, anio: ti.anio, patente: ti.patente, km: ti.km, valor: ti.valor, moneda: ti.moneda, observaciones: ti.observaciones };
      }
      var financiacion = null;
      if (fForma.value === 'financiado') {
        var fc = finCb.getCuotas();
        if (!fc.length) { ui.toast('Cargá las cuotas de la financiación', 'error'); return; }
        financiacion = {
          enabled: true, entidad: finEntidad.value, entrega: finEntrega.monto.value, moneda: finEntrega.moneda.value,
          notas: finNotas.value, cuotas: fc
        };
      }
      submitted = true;
      var data = {
        fecha: fFecha.value, precio: precio.monto.value, moneda: precio.moneda.value, cotizacionUSD: fCotiz.value,
        formaCobro: fForma.value, montoTransferencia: fTransf.value, montoEfectivo: fEfec.value,
        cliente: { nombre: clNom.value, telefono: clTel.value, notas: clNotas.value },
        tradeIn: tradeIn,
        financiacion: financiacion,
        comision: comision.get(),
        diferencia: (tiEnabled.checked && tiDiferenciaARS() > 0.01)
          ? { monto: tiDiferenciaARS(), moneda: 'ARS', montoEfectivo: tiDifEfec.value, montoTransferencia: tiDifTransf.value }
          : null
      };
      store.setSale(v.id, data);
      ui.toast('Venta registrada', 'success');
      m.close();
    }
    return m;
  }
