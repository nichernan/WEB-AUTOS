  /* ========================= FORM GASTO (por auto) ==================== */
  function expenseForm(vehicleId, expense) {
    var v = store.getVehicle(vehicleId);
    if (!v) return;
    var e = expense || {};
    var monto = ui.money2('gasto', e.monto || '', e.moneda || 'ARS');
    var fFecha = ui.input({ type: 'date', value: e.fecha || store.todayISO() });
    var fCotiz = ui.moneyInput({ value: e.cotizacionUSD || '', placeholder: 'Cotización (si es en USD)' });
    var cotizField = ui.field('Cotización del dólar (opcional)', fCotiz, 'Si el gasto es en dólares y querés fijar una cotización distinta a la de la compra');
    var fObs = ui.textarea({ value: e.observacion || '', rows: 3, placeholder: 'Ej: 200 lucas en el vidrio delantero y cambio de aceite.' });
    function syncCotiz() { cotizField.hidden = monto.moneda.value !== 'USD'; }
    monto.moneda.addEventListener('change', syncCotiz);

    var body = el('div', { class: 'form-grid' }, [
      el('div', { class: 'grid-2' }, [ui.field('Monto', monto.wrap), ui.field('Fecha', fFecha)]),
      cotizField,
      ui.field('Observación', fObs)
    ]);
    var m = ui.modal({
      title: expense ? 'Editar gasto' : 'Agregar gasto',
      body: body,
      footer: [
        el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
        el('button', { class: 'btn btn-primary', text: 'Guardar gasto', onclick: submit })
      ]
    });
    syncCotiz();
    var submitted = false;
    function submit() {
      if (submitted) return;
      if (store.num(monto.monto.value) <= 0) { ui.toast('Ingresá el monto del gasto', 'error'); return; }
      submitted = true;
      var data = { monto: monto.monto.value, moneda: monto.moneda.value, fecha: fFecha.value, cotizacionUSD: fCotiz.value, observacion: fObs.value };
      if (expense) store.updateExpense(v.id, e.id, data);
      else store.addExpense(v.id, data);
      ui.toast('Gasto guardado', 'success');
      m.close();
    }
    return m;
  }

  /* ==================== FORM GASTO DEL NEGOCIO (fijo) ================= */
  // Simplificado a propósito: concepto, monto, frecuencia y fecha son los
  // únicos datos que hacen falta para cargar un gasto rápido desde el
  // celular. "Categoría" se sacó del formulario (no se usa en ningún
  // cálculo, solo era una etiqueta); los gastos nuevos quedan con
  // categoría 'otro' — normalizeFixedExpense ya la completaba así por
  // defecto, así que Excel/historial siguen funcionando igual. Cotización,
  // "Hasta" y Notas son secundarios: quedan detrás de "+ Más datos".
  function fixedExpenseForm(fixed) {
    var f = fixed || {};
    var isEdit = !!fixed;

    var fConcepto = ui.input({ value: f.concepto || '', required: true, placeholder: 'Ej: Alquiler del local' });
    var monto = ui.money2('fijo', f.monto || '', f.moneda || 'ARS');
    var fCotiz = ui.moneyInput({ value: f.cotizacionUSD || '', placeholder: 'Cotización (si es en USD)' });
    var cotizField = ui.field('Cotización del dólar (opcional)', fCotiz);
    var fFrec = ui.select([opt('mensual', 'Todos los meses'), opt('unica', 'Una sola vez')], f.frecuencia || 'mensual');
    var fFecha = ui.input({ type: 'date', value: f.fecha || store.todayISO() });
    var fechaField = ui.field('Desde', fFecha);
    var fHasta = ui.input({ type: 'date', value: f.hasta || '' });
    var hastaField = ui.field('Hasta (opcional)', fHasta, 'Si el gasto dejó de correr, poné la fecha');
    var fNotas = ui.textarea({ value: f.notas || '', rows: 2, placeholder: 'Otros datos (opcional)' });

    function sync() {
      var mensual = fFrec.value === 'mensual';
      fechaField.querySelector('.field-label').textContent = mensual ? 'Desde' : 'Fecha del gasto';
      hastaField.hidden = !mensual;
      cotizField.hidden = monto.moneda.value !== 'USD';
    }
    fFrec.addEventListener('change', sync);
    monto.moneda.addEventListener('change', sync);

    var hayMasDatos = !!(f.notas || f.hasta || f.cotizacionUSD);
    var masDatosBox = el('div', { hidden: !hayMasDatos }, [cotizField, hastaField, ui.field('Notas', fNotas)]);
    var masDatosToggle = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos', onclick: function () {
      masDatosBox.hidden = !masDatosBox.hidden;
      masDatosToggle.textContent = masDatosBox.hidden ? '＋ Más datos' : '－ Menos datos';
    } });

    var body = el('div', { class: 'form-grid' }, [
      ui.field('Concepto *', fConcepto),
      ui.field('Monto', monto.wrap),
      el('div', { class: 'grid-2' }, [ui.field('¿Cada cuánto?', fFrec), fechaField]),
      masDatosToggle, masDatosBox
    ]);

    var footer = [
      isEdit ? el('button', { class: 'btn btn-danger-ghost', text: 'Eliminar', onclick: function () {
        m.close();
        ui.confirm({ title: 'Eliminar gasto', message: '¿Eliminar "' + (f.concepto || 'este gasto') + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeFixedExpense(f.id); ui.toast('Gasto eliminado'); } });
      } }) : null,
      el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', text: isEdit ? 'Guardar' : 'Agregar', onclick: submit })
    ];
    var m = ui.modal({ title: isEdit ? 'Editar gasto del negocio' : 'Nuevo gasto del negocio', body: body, footer: footer });
    sync();

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fConcepto.value.trim()) { ui.toast('Poné un concepto', 'error'); return; }
      if (store.num(monto.monto.value) <= 0) { ui.toast('Ingresá el monto', 'error'); return; }
      submitted = true;
      var data = {
        concepto: fConcepto.value, categoria: f.categoria || 'otro', monto: monto.monto.value, moneda: monto.moneda.value,
        cotizacionUSD: fCotiz.value, frecuencia: fFrec.value, fecha: fFecha.value, hasta: fHasta.value, notas: fNotas.value
      };
      if (isEdit) { store.updateFixedExpense(f.id, data); ui.toast('Gasto actualizado', 'success'); }
      else { store.addFixedExpense(data); ui.toast('Gasto agregado', 'success'); }
      m.close();
    }
    return m;
  }

  /* ========================= FORM RECORDATORIO ======================= */
  var REM_TIPOS = [
    ['tarea', 'Tarea'],
    ['mantenimiento', 'Mantenimiento / Service'],
    ['tramite', 'Trámite / Documentación'],
    ['pago', 'Pago de cuota'],
    ['turno', 'Turno con cliente'],
    ['gestoria', 'Gestoría / Transferencia'],
    ['stock', 'Stock'],
    ['otro', 'Otro']
  ];
  var REM_REPEAT = [
    ['none', 'No repetir'],
    ['daily', 'Todos los días'],
    ['weekly', 'Todas las semanas'],
    ['monthly', 'Todos los meses'],
    ['yearly', 'Todos los años']
  ];

  function reminderForm(reminder, presetDate) {
    var isEdit = !!reminder;
    var r = reminder || {};

    var fTitulo = ui.input({ value: r.titulo || '', required: true, placeholder: 'Escribí acá...' });
    var fFecha = ui.input({ type: 'date', value: r.fecha || presetDate || store.todayISO() });
    var fHora = ui.input({ type: 'time', value: r.hora || '' });
    var fTipo = ui.select(REM_TIPOS.map(function (t) { return opt(t[0], t[1]); }), r.tipo || 'tarea');
    var fRepeat = ui.select(REM_REPEAT.map(function (t) { return opt(t[0], t[1]); }), r.repeat || 'none');
    var fNota = ui.textarea({ value: r.nota || '', rows: 3, placeholder: 'Detalle o nota (opcional)' });

    // Solo título y fecha son realmente necesarios para crear una alerta en
    // segundos; el resto (hora, tipo, repetir, nota) queda opcional detrás
    // de "Más opciones" — mismos campos y lógica de siempre, nada eliminado.
    var extra = el('div', { class: 'form-grid', hidden: true }, [
      el('div', { class: 'grid-2' }, [ui.field('Hora (opcional)', fHora), ui.field('Tipo', fTipo)]),
      ui.field('Repetir', fRepeat),
      ui.field('Descripción / nota (opcional)', fNota)
    ]);
    var hayOpcionalesCargados = !!(r.hora || (r.tipo && r.tipo !== 'tarea') || (r.repeat && r.repeat !== 'none') || r.nota);
    extra.hidden = !hayOpcionalesCargados;
    var toggleExtra = el('button', { type: 'button', class: 'btn btn-sm btn-ghost', text: extra.hidden ? '＋ Más opciones' : '－ Menos opciones', onclick: function () {
      extra.hidden = !extra.hidden;
      toggleExtra.textContent = extra.hidden ? '＋ Más opciones' : '－ Menos opciones';
    } });

    var body = el('div', { class: 'form-grid' }, [
      ui.field('¿Qué tenés que recordar?', fTitulo),
      ui.field('¿Cuándo?', fFecha),
      toggleExtra,
      extra
    ]);

    var footer = [
      isEdit ? el('button', { class: 'btn btn-danger-ghost', text: 'Eliminar', onclick: function () {
        m.close();
        ui.confirm({ title: 'Eliminar alerta', message: '¿Eliminar "' + (r.titulo || 'esta alerta') + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeReminder(r.id); ui.toast('Alerta eliminada'); } });
      } }) : null,
      el('button', { class: 'btn btn-ghost', text: 'Cancelar', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', html: isEdit ? 'Guardar' : '<span>🔔</span> Crear alerta', onclick: submit })
    ];

    var m = ui.modal({ title: isEdit ? 'Editar alerta' : 'Nueva alerta', body: body, footer: footer });

    var submitted = false;
    function submit() {
      if (submitted) return;
      if (!fTitulo.value.trim()) { ui.toast('El título es obligatorio', 'error'); return; }
      if (!fFecha.value) { ui.toast('La fecha es obligatoria', 'error'); return; }
      submitted = true;
      var data = { titulo: fTitulo.value, fecha: fFecha.value, hora: fHora.value, tipo: fTipo.value, nota: fNota.value, repeat: fRepeat.value };
      if (isEdit) { store.updateReminder(r.id, data); ui.toast('Alerta actualizada', 'success'); }
      else { store.addReminder(data); ui.toast('Alerta creada', 'success'); }
      m.close();
    }
    return m;
  }

  window.App = window.App || {};
  App.forms = {
    vehicleFormView: vehicleFormView, purchaseForm: purchaseForm, saleForm: saleForm, expenseForm: expenseForm,
    reservationForm: reservationForm, fixedExpenseForm: fixedExpenseForm,
    reminderForm: reminderForm, CHECKLIST_ITEMS: CHECKLIST_ITEMS,
    REM_TIPOS: REM_TIPOS, REM_REPEAT: REM_REPEAT
  };
})();
</script>
<script>
/* ===== js/views1.js ===== */
/* ============================================================================
 * views1.js  —  Dashboard y ficha de vehículo
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, fmt = App.fmt, store = App.store, fin = App.finance;

  /* estado de filtros y búsqueda (compartido con la búsqueda global) */
  var filters = {
    q: '', marca: '', modelo: '', anio: '', estado: '', vendido: '',
    precioMin: '', precioMax: '', gananciaMin: '', gananciaMax: '',
    compraDesde: '', compraHasta: '', ventaDesde: '', ventaHasta: '',
    sort: 'reciente'
  };
  App.filters = filters;

  function matchVehicle(v) {
    var m = fin.vehicleMetrics(v);
    var name = store.vehicleName(v).toLowerCase();
    if (filters.q) {
      var q = filters.q.toLowerCase().trim();
      var hay = [name, v.marca, v.modelo, String(v.anio || ''), v.patente, v.version, store.estadoLabel(v.estado)]
        .filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (filters.marca && (v.marca || '').toLowerCase() !== filters.marca.toLowerCase()) return false;
    if (filters.modelo && (v.modelo || '').toLowerCase().indexOf(filters.modelo.toLowerCase()) === -1) return false;
    if (filters.anio && String(v.anio || '') !== String(filters.anio)) return false;
    if (filters.estado && v.estado !== filters.estado) return false;
    if (filters.vendido === 'si' && v.estado !== 'vendido') return false;
    if (filters.vendido === 'no' && v.estado === 'vendido') return false;
    var precio = m.vendido ? m.ventaARS : m.inversionARS;
    if (filters.precioMin && precio < store.num(filters.precioMin)) return false;
    if (filters.precioMax && precio > store.num(filters.precioMax)) return false;
    if (filters.gananciaMin && (!m.vendido || m.gananciaARS < store.num(filters.gananciaMin))) return false;
    if (filters.gananciaMax && m.vendido && m.gananciaARS > store.num(filters.gananciaMax)) return false;
    if (filters.compraDesde && (!v.purchase || v.purchase.fecha < filters.compraDesde)) return false;
    if (filters.compraHasta && (!v.purchase || v.purchase.fecha > filters.compraHasta)) return false;
    if (filters.ventaDesde && (!v.sale || v.sale.fecha < filters.ventaDesde)) return false;
    if (filters.ventaHasta && (!v.sale || v.sale.fecha > filters.ventaHasta)) return false;
    return true;
  }

  function sortVehicles(list) {
    var s = filters.sort;
    var arr = list.slice();
    arr.sort(function (a, b) {
      var ma = fin.vehicleMetrics(a), mb = fin.vehicleMetrics(b);
      switch (s) {
        case 'antiguo': return (a.purchase ? a.purchase.fecha : '9999').localeCompare(b.purchase ? b.purchase.fecha : '9999');
        case 'reciente': return (b.purchase ? b.purchase.fecha : '0000').localeCompare(a.purchase ? a.purchase.fecha : '0000') || b.createdAt - a.createdAt;
        case 'ganancia-desc': return mb.gananciaARS - ma.gananciaARS;
        case 'ganancia-asc': return ma.gananciaARS - mb.gananciaARS;
        case 'precio-desc': return (mb.vendido ? mb.ventaARS : mb.inversionARS) - (ma.vendido ? ma.ventaARS : ma.inversionARS);
        case 'precio-asc': return (ma.vendido ? ma.ventaARS : ma.inversionARS) - (mb.vendido ? mb.ventaARS : mb.inversionARS);
        default: return b.createdAt - a.createdAt;
      }
    });
    return arr;
  }

  /* ------------------------------ DASHBOARD --------------------------- */
  // "Vehículos" (antes "Inicio"). Reutiliza exactamente fin.globalMetrics()
  // — los mismos datos y fórmulas que ya usan Economía y Resúmenes. Acá solo
  // se reorganiza la presentación: el stock y las ventas pasan a ser lo
  // protagonista, y el listado completo (buscador/filtros/orden, sin cambios)
  // se movió a vehicleListView(), accesible desde acá sin duplicarlo.
  function dashboard(root) {
    var g = fin.globalMetrics();
    var wrap = el('div', { class: 'page home-dashboard' });

    var alertN = App.alerts ? App.alerts.count() : 0;
    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: 'Vehículos' }),
        el('p', { class: 'page-sub', text: 'Tu stock, tus ventas y el estado del negocio' })
      ]),
      el('div', { class: 'page-head-actions' }, [
        el('a', { class: 'btn btn-ghost btn-alertas' + (alertN ? ' has-alerts' : ''), href: '#/alertas', 'aria-label': 'Ir a Alertas' + (alertN ? ' (' + alertN + ' pendientes)' : '') }, [
          el('span', { class: 'btn-alertas-ico', text: '🔔' }),
          el('span', { text: 'Alertas' }),
          alertN ? el('span', { class: 'btn-alertas-badge', text: alertN }) : null
        ]),
        el('a', { class: 'btn btn-primary', href: '#/vehiculo-nuevo', html: '<span>＋</span> Registrar vehículo' })
      ])
    ]));

    // aviso de copia de seguridad + cuotas vencidas (mismos avisos de siempre)
    wrap.appendChild(App.views._backupBar());
    if (g.porCobrarVencido > 0 || g.porPagarVencido > 0) {
      wrap.appendChild(el('a', { class: 'card dash-cuotas-alert', href: '#/cuotas' }, [
        el('span', { text: '💸' }),
        el('span', { html:
          (g.porPagarVencido > 0 ? '<strong>' + fmt.money(g.porPagarVencido) + '</strong> en cuotas vencidas que tenés que pagar. ' : '') +
          (g.porCobrarVencido > 0 ? '<strong>' + fmt.money(g.porCobrarVencido) + '</strong> en cuotas vencidas que te tienen que pagar.' : '') }),
        el('span', { class: 'muted', text: 'Ver →' })
      ]));
    }

    // --- Lo primero: cuántos autos tengo y cuántos vendí (protagonistas,
    // clickeables — llevan al listado completo ya filtrado). ---
    wrap.appendChild(el('div', { class: 'grid-2' }, [
      heroLink('Autos en stock', fmt.num(g.autosEnStock), 'Ver vehículos →', function () { goVehiculos('no'); }),
      heroLink('Autos vendidos', fmt.num(g.autosVendidos), 'Ver vendidos →', function () { goVehiculos('si'); })
    ]));

    // --- Después: cómo está el resultado y el capital (informativo, más discreto) ---
    wrap.appendChild(el('div', { class: 'grid-2' }, [
      miniStatHome('Resultado del mes', (g.resultadoNetoDelMes >= 0 ? '+' : '') + fmt.money(g.resultadoNetoDelMes), 'Ganancias − gastos fijos', g.resultadoNetoDelMes >= 0 ? 'pos' : 'neg'),
      miniStatHome('Capital invertido', fmt.money(g.capitalInvertido), 'Compra + gastos + comisiones')
    ]));

    // --- Acceso al listado completo (buscador, filtros, orden — sin duplicarlo) ---
    wrap.appendChild(el('div', { class: 'center' }, [
      el('a', { class: 'btn btn-ghost', href: '#/vehiculos', text: 'Ver todos los vehículos →' })
    ]));

    root.appendChild(wrap);
  }

  // Reutiliza el mismo objeto App.filters que ya usa el buscador/filtros del
  // listado completo — solo se resetean y se deja cargado "vendido" antes de
  // navegar, sin crear ningún mecanismo de filtrado nuevo.
  function goVehiculos(vendidoValue) {
    Object.keys(filters).forEach(function (k) { if (k !== 'sort') filters[k] = ''; });
    filters.vendido = vendidoValue;
    App.router.go('vehiculos');
  }

  // Bloque grande y clickeable (mismo estilo "hero" que ya usa Economía para
  // el Resultado del negocio), con una acción por debajo tipo link.
  function heroLink(label, value, actionText, onclick) {
    return el('div', { class: 'econ-hero econ-hero-link', onclick: onclick, role: 'button', tabindex: '0' }, [
      el('span', { class: 'econ-hero-label', text: label }),
      el('span', { class: 'econ-hero-value', text: value }),
      el('span', { class: 'mini-tag', text: actionText })
    ]);
  }

  // Mismo componente visual "mini-stat" que ya usa Economía — se reutiliza acá.
  function miniStatHome(label, value, sub, tone) {
    return el('div', { class: 'mini-stat' }, [
      el('span', { class: 'mini-stat-label', text: label }),
      el('span', { class: 'mini-stat-value ' + (tone || ''), text: value }),
      sub ? el('span', { class: 'mini-stat-sub', text: sub }) : null
    ]);
  }

  /* --------------------- Listado completo de vehículos ----------------- */
  // Mismo buscador/filtros/orden/listado que antes vivía dentro de "Inicio"
  // (matchVehicle, sortVehicles, buildFiltersPanel, vehicleRow — sin cambios),
  // ahora en su propia pantalla para no duplicar información en el dashboard.
  function vehicleListView(root) {
    var wrap = el('div', { class: 'page' });
    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('a', { class: 'back-link', href: '#/', html: '‹ Volver a Vehículos' }),
        el('h1', { text: 'Todos los vehículos', style: 'margin-top:6px' })
      ])
    ]));

    var searchInput = ui.input({ value: filters.q, placeholder: 'Buscar por marca, modelo, año, patente, nombre...', class: 'input search-input' });
    searchInput.addEventListener('input', function () { filters.q = searchInput.value; renderList(); });
    var sortSel = ui.select([
      { value: 'reciente', label: 'Más reciente' }, { value: 'antiguo', label: 'Más antiguo' },
      { value: 'ganancia-desc', label: 'Mayor ganancia' }, { value: 'ganancia-asc', label: 'Menor ganancia' },
      { value: 'precio-desc', label: 'Mayor precio' }, { value: 'precio-asc', label: 'Menor precio' }
    ], filters.sort, { class: 'input select sort-select' });
    sortSel.addEventListener('change', function () { filters.sort = sortSel.value; renderList(); });

    var filtersPanel = el('div', { class: 'filters-panel', hidden: true });
    var filterToggle = el('button', { class: 'btn btn-ghost', html: '⚙ Filtros', onclick: function () { filtersPanel.hidden = !filtersPanel.hidden; } });

    wrap.appendChild(el('div', { class: 'toolbar' }, [
      el('div', { class: 'toolbar-search' }, searchInput),
      el('div', { class: 'toolbar-actions' }, [filterToggle, sortSel])
    ]));
    buildFiltersPanel(filtersPanel, function () { renderList(); });
    wrap.appendChild(filtersPanel);

    var listWrap = el('div', { class: 'vehicle-list' });
    wrap.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('h3', { text: 'Todos los vehículos' }),
        el('span', { class: 'count-tag', id: 'veh-count' })
      ]),
      listWrap
    ]));

    function renderList() {
      var all = store.activeVehicles();
      var list = sortVehicles(all.filter(matchVehicle));
      ui.clear(listWrap);
      var countEl = ui.qs('#veh-count', wrap);
      if (countEl) countEl.textContent = list.length + ' de ' + all.length;
      if (!list.length) { listWrap.appendChild(ui.emptyState('No hay vehículos que coincidan con la búsqueda.', '🔍')); return; }
      list.forEach(function (v) { listWrap.appendChild(vehicleRow(v)); });
    }
    renderList();

    root.appendChild(wrap);
  }

  function vehicleRow(v) {
    var m = fin.vehicleMetrics(v);
    var right = [];
    right.push(el('span', { class: 'row-patente', text: v.patente || 'Sin patente' }));
    if (m.vendido) right.push(el('span', { class: 'row-ganancia ' + (m.gananciaARS >= 0 ? 'pos' : 'neg'), text: (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS) }));
    else right.push(el('span', { class: 'row-inversion', text: fmt.money(m.costoTotalARS) }));

    var alerts = App.alerts ? App.alerts.forVehicle(v).length : 0;

    return el('a', { class: 'vehicle-row', href: '#/vehiculo/' + v.id }, [
      el('div', { class: 'row-thumb' }, ui.carIcon()),
      el('div', { class: 'row-main' }, [
        el('div', { class: 'row-title-line' }, [
          el('span', { class: 'row-name', text: store.vehicleName(v) }),
          ui.estadoBadge(v.estado),
          (v.origin && v.origin.type === 'consignacion') ? ui.pill('🤝 Consignación', 'pill-warn') : null
        ]),
        el('div', { class: 'row-meta' }, [
          v.version ? el('span', { text: v.version }) : null,
          v.km != null ? el('span', { text: fmt.num(v.km) + ' km' }) : null,
          m.diasEnStock != null ? el('span', { text: fmt.days(m.diasEnStock) + ' en stock' }) : null,
          alerts ? el('span', { class: 'row-alert', text: '⚠ ' + alerts } ) : null
        ])
      ]),
      el('div', { class: 'row-right' }, right)
    ]);
  }

  function buildFiltersPanel(panel, onChange) {
    var all = store.activeVehicles();
    var marcas = uniq(all.map(function (v) { return v.marca; }).filter(Boolean)).sort();
    var mk = function (label, node) { return el('div', { class: 'filter-field' }, [el('span', { class: 'filter-label', text: label }), node]); };

    var fMarca = ui.select([{ value: '', label: 'Todas' }].concat(marcas.map(function (m) { return { value: m, label: m }; })), filters.marca);
    var fModelo = ui.input({ value: filters.modelo, placeholder: 'Modelo' });
    var fAnio = ui.input({ value: filters.anio, inputmode: 'numeric', placeholder: 'Año' });
    var fEstado = ui.select([{ value: '', label: 'Todos' }, { value: 'stock', label: 'En stock' }, { value: 'reservado', label: 'Reservado' }, { value: 'vendido', label: 'Vendido' }], filters.estado);
    var fVendido = ui.select([{ value: '', label: 'Todos' }, { value: 'si', label: 'Vendidos' }, { value: 'no', label: 'No vendidos' }], filters.vendido);
    var fPMin = ui.moneyInput({ value: filters.precioMin, placeholder: 'Mín' });
    var fPMax = ui.moneyInput({ value: filters.precioMax, placeholder: 'Máx' });
    var fGMin = ui.moneyInput({ value: filters.gananciaMin, placeholder: 'Mín', allowNegative: true });
    var fGMax = ui.moneyInput({ value: filters.gananciaMax, placeholder: 'Máx', allowNegative: true });
    var fCD = ui.input({ value: filters.compraDesde, type: 'date' });
    var fCH = ui.input({ value: filters.compraHasta, type: 'date' });
    var fVD = ui.input({ value: filters.ventaDesde, type: 'date' });
    var fVH = ui.input({ value: filters.ventaHasta, type: 'date' });

    var allFields = { marca: fMarca, modelo: fModelo, anio: fAnio, estado: fEstado, vendido: fVendido, precioMin: fPMin, precioMax: fPMax, gananciaMin: fGMin, gananciaMax: fGMax, compraDesde: fCD, compraHasta: fCH, ventaDesde: fVD, ventaHasta: fVH };
    Object.keys(allFields).forEach(function (k) {
      allFields[k].addEventListener('input', function () { filters[k] = allFields[k].value; onChange(); });
      allFields[k].addEventListener('change', function () { filters[k] = allFields[k].value; onChange(); });
    });

    ui.clear(panel);
    panel.appendChild(el('div', { class: 'filters-grid' }, [
      mk('Marca', fMarca), mk('Modelo', fModelo), mk('Año', fAnio),
      mk('Estado', fEstado), mk('Vendido / no vendido', fVendido),
      mk('Precio desde', fPMin), mk('Precio hasta', fPMax),
      mk('Ganancia desde', fGMin), mk('Ganancia hasta', fGMax),
      mk('Compra desde', fCD), mk('Compra hasta', fCH),
      mk('Venta desde', fVD), mk('Venta hasta', fVH)
    ]));
    panel.appendChild(el('button', { class: 'btn btn-sm btn-ghost', text: 'Limpiar filtros', onclick: function () {
      Object.keys(allFields).forEach(function (k) { filters[k] = ''; });
      filters.q = '';
      App.router.render();
    } }));
  }

  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  /* --------------------------- FICHA DE VEHÍCULO ---------------------- */
  // Recuerda la pestaña activa por vehículo entre renders (p.ej. cuando se
  // registra un pago, o cuando otro usuario cambia algo en tiempo real): sin
  // esto, cualquier actualización de datos mientras se mira una pestaña que
  // no sea "Resumen" hacía volver la ficha a "Resumen" sin que el usuario lo pida.
  var lastDetailTab = { id: null, tab: null };
  // Menú "⋯" con acciones secundarias (mismas acciones de siempre, solo
  // agrupadas para reducir el ruido visual de la ficha).
  function moreMenu(items) {
    items = items.filter(Boolean);
    var btn = el('button', { class: 'icon-btn more-btn', html: '⋯', 'aria-label': 'Más acciones', title: 'Más acciones' });
    var menu = el('div', { class: 'more-menu', hidden: true }, items.map(function (it) {
      return el('button', { class: 'more-menu-item' + (it.danger ? ' is-danger' : ''), text: it.text, onclick: function () { close(); it.onclick(); } });
    }));
    function onDocClick(e) { if (!wrapEl.contains(e.target)) close(); }
    function close() { menu.hidden = true; document.removeEventListener('mousedown', onDocClick); }
    function open() { menu.hidden = false; document.addEventListener('mousedown', onDocClick); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); if (menu.hidden) open(); else close(); });
    var wrapEl = el('div', { class: 'more-menu-wrap' }, [btn, menu]);
    return wrapEl;
  }

  function vehicleDetail(root, id) {
    var v = store.getVehicle(id);
    if (!v) { root.appendChild(ui.emptyState('El vehículo no existe o fue eliminado.', '🚫')); return; }
    var m = fin.vehicleMetrics(v);
    var esConsignacion = !!(v.origin && v.origin.type === 'consignacion');
    var wrap = el('div', { class: 'page vehicle-detail' });

    // acción principal: registrar compra (si falta y no es consignación) o
    // registrar venta (si ya se puede vender); "Agregar gasto" siempre
    // visible. El resto de las acciones quedan en el menú "⋯".
    var primaryActions = [];
    if (!v.purchase && !esConsignacion) {
      primaryActions.push(el('button', { class: 'btn btn-sm btn-primary', text: 'Registrar compra', onclick: function () { App.forms.purchaseForm(v.id); } }));
    } else if (v.estado !== 'vendido') {
      primaryActions.push(el('button', { class: 'btn btn-sm btn-primary', text: 'Registrar venta', onclick: function () { App.forms.saleForm(v.id); } }));
    }
    primaryActions.push(el('button', { class: 'btn btn-sm btn-ghost', text: 'Agregar gasto', onclick: function () { App.forms.expenseForm(v.id); } }));

    var secondary = moreMenu([
      { text: 'Editar', onclick: function () { App.router.go('vehiculo-editar/' + v.id); } },
      (v.purchase && v.estado !== 'vendido') ? { text: v.reservation ? 'Editar reserva' : 'Reservar', onclick: function () { App.forms.reservationForm(v.id); } } : null,
      { text: 'Comparar dólar', onclick: function () { App.router.go('comparacion/' + v.id); } },
      { text: 'Papelera', danger: true, onclick: function () {
        ui.confirm({ title: 'Enviar a papelera', message: '¿Seguro que querés eliminar este vehículo? Se moverá a la Papelera y podrás restaurarlo.', danger: true, confirmText: 'Enviar a papelera' })
          .then(function (ok) { if (ok) { store.softDeleteVehicle(v.id); ui.toast('Movido a la papelera', 'success'); App.router.go(''); } });
      } }
    ]);

    // header
    wrap.appendChild(el('div', { class: 'detail-head' }, [
      el('a', { class: 'back-link', href: '#/', html: '‹ Volver' }),
      el('div', { class: 'detail-head-main' }, [
        el('div', { class: 'detail-hero-photo' }, ui.carIcon('big')),
        el('div', { class: 'detail-titles' }, [
          el('h1', { text: store.vehicleName(v) }),
          el('div', { class: 'detail-patente', text: v.patente || 'Sin patente' }),
          el('div', { class: 'detail-sub' }, [
            ui.estadoBadge(v.estado), ui.docBadge(v.documentacion),
            v.origin && v.origin.type === 'parte-de-pago' ? ui.pill('Recibido como parte de pago', 'pill-info') : null,
            esConsignacion ? ui.pill('🤝 Consignación', 'pill-warn') : null
          ])
        ])
      ]),
      el('div', { class: 'detail-invest' }, [
        el('span', { class: 'detail-invest-value', text: fmt.money(m.costoTotalARS) }),
        el('span', { class: 'detail-invest-label', text: 'Inversión actual' })
      ]),
      el('div', { class: 'detail-actions' }, primaryActions.concat([secondary]))
    ]));

    if (v.reservation) {
      var rr = v.reservation;
      wrap.appendChild(el('div', { class: 'card reserva-card' }, [
        el('div', { class: 'card-head' }, [el('h4', { text: '🔖 Reservado' }), el('button', { class: 'btn btn-sm btn-ghost', text: 'Editar', onclick: function () { App.forms.reservationForm(v.id); } })]),
        App.views._dl([
          ['Seña recibida', fmt.money(rr.monto, rr.moneda), 'strong'],
          ['Fecha de la reserva', fmt.date(rr.fecha)],
          rr.vence ? ['Vence', fmt.date(rr.vence) + ' (' + fmt.relative(rr.vence) + ')', rr.vence < store.todayISO() ? 'neg' : ''] : null,
          rr.cliente && rr.cliente.nombre ? ['Cliente', rr.cliente.nombre + (rr.cliente.telefono ? ' · ' + rr.cliente.telefono : '')] : null,
          rr.notas ? ['Notas', rr.notas] : null
        ])
      ]));
    }

    // alertas del vehículo
    var va = App.alerts ? App.alerts.forVehicle(v) : [];
    if (va.length) {
      wrap.appendChild(el('div', { class: 'detail-alerts' }, va.map(function (a) {
        return el('div', { class: 'alert-line alert-' + a.level }, [el('span', { text: a.icon || '⚠' }), el('span', { text: a.text })]);
      })));
    }

    // tabs — reducidas a 4 secciones conceptuales: Compra + Gastos + Venta +
    // Rentabilidad viven juntas dentro de "Economía" (mismas funciones
    // tabCompra/tabGastos/tabVenta/tabRentabilidad, solo concatenadas);
    // "Documentación" muestra tabDocs (el Checklist se eliminó de la app).
    // Observaciones se movió a Resumen (ver tabResumen) y ya no es pestaña propia.
    var tabsWrap = el('div', { class: 'tabs' });
    var panel = el('div', { class: 'tab-panel' });
    var tabs = [
      ['resumen', 'Resumen', function () { return tabResumen(v, m); }],
      ['economia', 'Economía', function () { return tabEconomia(v, m); }],
      ['docs', 'Documentación', function () { return tabDocumentacion(v); }],
      ['hist', 'Historial', function () { return tabHist(v); }]
    ];
    var hashTab = (location.hash.split('?')[1] || '').indexOf('tab=') === 0 ? location.hash.split('tab=')[1] : null;
    if (lastDetailTab.id !== id) lastDetailTab = { id: id, tab: hashTab || 'resumen' };
    var active = lastDetailTab.tab;
    tabs.forEach(function (t) {
      var b = el('button', { class: 'tab' + (t[0] === active ? ' is-active' : ''), text: t[1], onclick: function () {
        lastDetailTab = { id: id, tab: t[0] };
        ui.qsa('.tab', tabsWrap).forEach(function (x) { x.classList.remove('is-active'); });
        b.classList.add('is-active');
        ui.clear(panel); ui.appendChildren(panel, t[2]());
      } });
      tabsWrap.appendChild(b);
    });
    wrap.appendChild(tabsWrap);
    wrap.appendChild(panel);
    var initial = tabs.filter(function (t) { return t[0] === active; })[0] || tabs[0];
    ui.appendChildren(panel, initial[2]());

    root.appendChild(wrap);
  }

  function kpi(label, value, sub, tone) {
    return el('div', { class: 'kpi' }, [
      el('span', { class: 'kpi-label', text: label }),
      el('span', { class: 'kpi-value ' + (tone || ''), text: value }),
      sub ? el('span', { class: 'kpi-sub', text: sub }) : null
    ]);
  }

  function dl(pairs) {
    return el('div', { class: 'data-list' }, pairs.filter(Boolean).map(function (p) {
      return el('div', { class: 'data-row' }, [el('span', { class: 'data-k', text: p[0] }), el('span', { class: 'data-v ' + (p[2] || '') }, p[1] instanceof Node ? p[1] : String(p[1])) ]);
    }));
  }

  // Tarjeta "Origen: parte de pago" — de dónde vino este vehículo, cuánto costó
  // tomarlo, y el margen potencial (en stock) o la ganancia realizada (vendido).
  // Reutiliza los mismos números que ya calcula vehicleMetrics para cualquier
  // vehículo — no inventa una fórmula nueva.
  function origenCard(v, m) {
    var orig = v.origin.saleVehicleId ? store.getVehicle(v.origin.saleVehicleId) : null;
    var rows = [
      ['Recibido en la venta de', orig ? store.vehicleName(orig) : 'una operación que ya no existe'],
      ['Costo de toma', fmt.money(m.compraARS)]
    ];
    if (!m.vendido) {
      rows.push(['Valor estimado de venta', v.precioPretendido ? fmt.money(v.precioPretendido, v.precioPretendidoMoneda) : '— (no cargado)']);
      if (v.precioPretendido) {
        var margen = m.estimadoARS - m.costoTotalARS;
        rows.push(['Margen potencial', (margen >= 0 ? '+' : '') + fmt.money(margen), margen >= 0 ? 'pos strong' : 'neg strong']);
      }
    } else {
      rows.push(['Vendido en', fmt.money(m.ventaARS)]);
      rows.push(['Ganancia realizada', (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS), m.gananciaARS >= 0 ? 'pos strong' : 'neg strong']);
    }
    return el('div', { class: 'card info-card' }, [
      el('h4', { text: '🔁 Origen: parte de pago' }),
      dl(rows),
      orig ? el('a', { class: 'btn btn-sm btn-primary', href: '#/vehiculo/' + orig.id + '?tab=economia', text: 'Ver operación' }) : null
    ]);
  }

  // Tarjeta "Consignación": el vehículo sigue siendo del dueño, el negocio
  // no lo compró. Reutiliza vehicleMetrics tal cual (gananciaARS ya
  // descuenta lo que le corresponde al dueño — ver finance.js) y solo
  // agrega, para mostrar, cuánto es ese importe del dueño.
  function consignacionCard(v, m) {
    var o = v.origin;
    var duenoStr = (o.duenio && o.duenio.nombre) ? o.duenio.nombre + (o.duenio.telefono ? ' · ' + o.duenio.telefono : '') : '—';
    var precioDuenoARS = m.precioDuenoARS;
    var rows = [
      ['Dueño', duenoStr],
      ['Precio que pide el dueño', o.precioDueno ? fmt.money(o.precioDueno, o.monedaDueno) : '—'],
      ['Fecha de ingreso', o.fecha ? fmt.date(o.fecha) : '—'],
      o.notas ? ['Notas', o.notas] : null
    ];
    if (m.vendido) {
      rows.push(['Vendido en', fmt.money(m.ventaARS)]);
      rows.push(['Le corresponde al dueño', fmt.money(precioDuenoARS)]);
      rows.push(['Ganancia del negocio', (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS), m.gananciaARS >= 0 ? 'pos strong' : 'neg strong']);
    } else {
      rows.push(['Le corresponde al dueño al vender', fmt.money(precioDuenoARS)]);
      if (v.precioPretendido) {
        var margen = m.estimadoARS - precioDuenoARS - m.costoTotalARS;
        rows.push(['Margen estimado del negocio', (margen >= 0 ? '+' : '') + fmt.money(margen), margen >= 0 ? 'pos strong' : 'neg strong']);
      }
    }
    return el('div', { class: 'card info-card' }, [
      el('h4', { text: '🤝 Consignación' }),
      dl(rows)
    ]);
  }

  // Resumen: para entenderse en pocos segundos. Junta, en modo lectura, lo
  // esencial de cada sección (los mismos datos y cálculos de siempre — nada
  // se recalcula acá; el detalle interactivo completo sigue en Economía /
  // Documentación).
  function tabResumen(v, m) {
    var esConsig = v.origin && v.origin.type === 'consignacion';
    var out = [];
    out.push(el('div', { class: 'grid-2' }, [
      el('div', { class: 'card' }, [el('h4', { text: 'Economía' }), dl([
        esConsig ? null : ['Compra', v.purchase ? fmt.money(v.purchase.precio, v.purchase.moneda) : '—'],
        ['Gastos', fmt.money(m.gastosARS)],
        m.comisionARS ? ['Comisiones', fmt.money(m.comisionARS)] : null,
        esConsig ? null : ['Inversión total', fmt.money(m.costoTotalARS), 'strong'],
        ['Precio de venta', m.vendido ? fmt.money(v.sale.precio, v.sale.moneda) : 'Todavía no vendido'],
        m.vendido ? ['Ganancia', (m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS), m.gananciaARS >= 0 ? 'pos strong' : 'neg strong'] : null,
        m.vendido ? ['Rentabilidad', fmt.pct(m.rentabilidad), m.gananciaARS >= 0 ? 'pos' : 'neg'] : null,
        ['Días en stock', fmt.days(m.diasEnStock)],
        m.cuotasCount ? ['Cuotas a pagar', m.cuotasPagadasCount + ' / ' + m.cuotasCount + ' pagadas'] : null,
        m.totalPendienteARS ? ['Pendiente de pago', fmt.money(m.totalPendienteARS), 'neg'] : null,
        m.financiado ? ['Cuotas a cobrar', m.financCobradasCount + ' / ' + m.financCuotasCount + ' cobradas'] : null,
        m.financPorCobrarARS ? ['Falta que te paguen', fmt.money(m.financPorCobrarARS), m.financVencidasARS ? 'neg' : ''] : null
      ])]),
      el('div', { class: 'card' }, [el('h4', { text: 'Datos del vehículo' }), dl([
        ['Marca', v.marca || '—'], ['Modelo', v.modelo || '—'], ['Año', v.anio || '—'],
        ['Patente', v.patente || '—'], ['Kilometraje', v.km != null ? fmt.num(v.km) + ' km' : '—'],
        ['Combustible', v.combustible || '—'], ['Caja', v.caja === 'automatica' ? 'Automática' : (v.caja === 'manual' ? 'Manual' : '—')],
        ['Versión', v.version || '—']
      ])])
    ]));
    if (v.origin && v.origin.type === 'parte-de-pago') {
      out.push(origenCard(v, m));
    }
    if (esConsig) {
      out.push(consignacionCard(v, m));
    }
    out.push(el('div', { class: 'card' }, [el('h4', { text: 'Documentación' }), ui.docBadge(v.documentacion)]));
    if (v.observaciones) out.push(el('div', { class: 'card' }, [el('h4', { text: 'Observaciones' }), el('p', { class: 'obs-text', text: v.observaciones })]));
    return out;
  }

  // "Economía" — junta, tal cual, Compra + Gastos + Venta + Rentabilidad
  // (mismas funciones que ya existían, sin ningún cálculo nuevo).
  function tabEconomia(v, m) {
    return [].concat(tabCompra(v, m), tabGastos(v, m), tabVenta(v, m), tabRentabilidad(v, m));
  }

  // "Documentación" (la pestaña ya no incluye Checklist, se eliminó).
  function tabDocumentacion(v) {
    return tabDocs(v);
  }

  function tabCompra(v, m) {
    if (v.origin && v.origin.type === 'consignacion') return [consignacionCard(v, m)];
    if (!v.purchase) return [ui.emptyState('Todavía no registraste la compra de este vehículo.', '🧾'), el('div', { class: 'center' }, el('button', { class: 'btn btn-primary', text: 'Registrar compra', onclick: function () { App.forms.purchaseForm(v.id); } }))];

    out.push(dl([
      ['Fecha de compra', fmt.date(p.fecha)],
      ['Precio', fmt.money(p.precio, p.moneda)],
      p.moneda === 'ARS' && p.cotizacionUSD ? ['Cotización del dólar (compra)', fmt.money(p.cotizacionUSD) + '  ·  histórico'] : null,
      p.cotizacionUSD || p.moneda === 'USD' ? ['Valor en USD al comprar', fmt.usd(m.compraUSD)] : null,
      ['Forma de pago', store.formaPagoLabel(p.formaPago)],
      p.formaPago === 'mixto' ? ['Detalle', 'Transferencia ' + fmt.money(p.montoTransferencia, p.moneda) + ' · Efectivo ' + fmt.money(p.montoEfectivo, p.moneda)] : null,
      p.proveedor ? ['Proveedor', p.proveedor.nombre + (p.proveedor.telefono ? ' · ' + p.proveedor.telefono : '')] : null,
      p.proveedor && p.proveedor.notas ? ['Notas del proveedor', p.proveedor.notas] : null,
      p.comision ? ['Comisión a ' + (p.comision.persona || 'un tercero'), fmt.money(p.comision.monto, p.comision.moneda) + (p.comision.pagada ? ' · pagada' : ' · sin pagar')] : null
    ]));

    if (p.formaPago === 'cuotas' && p.cuotas.length) {
      out.push(el('h4', { text: 'Cuotas', style: 'margin-top:18px' }));
      out.push(el('div', { class: 'cuotas-summary' }, [
        el('div', {}, [el('span', { text: 'Total' }), el('strong', { text: fmt.money(m.cuotasTotalARS) })]),
        el('div', {}, [el('span', { text: 'Pagado' }), el('strong', { class: 'pos', text: fmt.money(m.cuotasPagadasARS) })]),
        el('div', {}, [el('span', { text: 'Pendiente' }), el('strong', { class: m.cuotasPendientesARS ? 'neg' : '', text: fmt.money(m.cuotasPendientesARS) })]),
        m.proximaCuota ? el('div', {}, [el('span', { text: 'Próxima cuota' }), el('strong', { text: fmt.date(m.proximaCuota.vencimiento) })]) : null,
        m.cuotasVencidasARS ? el('div', {}, [el('span', { text: 'Vencidas' }), el('strong', { class: 'neg', text: fmt.money(m.cuotasVencidasARS) })]) : null
      ]));
      var hoy = store.todayISO();
      out.push(el('div', { class: 'rem-list' }, p.cuotas.map(function (c) {
        var vencida = !c.pagada && c.vencimiento && c.vencimiento < hoy;

            el('div', { class: 'rem-item-title' }, [el('span', { class: 'rem-item-name', text: 'Cuota ' + c.numero }), ui.pill(pillTxt, pillCls)]),
            el('div', { class: 'rem-item-meta', text: fmt.money(c.monto, p.moneda) + ' · Vence ' + fmt.date(c.vencimiento) + (c.fechaPago ? ' · Pagada el ' + fmt.date(c.fechaPago) : '') })
          ]),
          c.pagada
            ? el('button', { class: 'btn btn-sm btn-ghost', text: 'Desmarcar', onclick: function () { store.desmarcarCuota(v.id, c.id); App.router.render(); } })

    ])];

  function tabVenta(v, m) {

  /* --------- Aviso de copia de seguridad (barra en Inicio) --------- */
  function backupBar() {
    var online = !!(App.auth && App.auth.enabled);

    var excelOn = false;
    try { excelOn = !!(App.excel && App.excel.status && App.excel.status().on); } catch (e) {}
    var dias = last ? Math.floor((Date.now() - last) / 86400000) : null;
    var txt, cls, ico;
    if (excelOn) { txt = 'Se está guardando solo en Excel'; cls = 'is-ok'; ico = '✅'; }
    // en modo online los datos ya viven en la nube (Supabase): no hace falta
    // alarmar con "no hiciste copia" — el export local es un extra, no la única red de seguridad.
    else if (online && last == null) { txt = 'Tus datos se guardan en la nube. Podés exportar una copia extra'; cls = ''; ico = '☁️'; }
    else if (last == null) { txt = 'Todavía no hiciste ninguna copia de seguridad'; cls = 'is-urgent'; ico = '⚠️'; }
    else if (dias <= 0) { txt = 'Última copia de seguridad: hoy'; cls = 'is-ok'; ico = '✅'; }
    else if (dias === 1) { txt = 'Última copia de seguridad: ayer'; cls = ''; ico = '💾'; }
    else if (online) { txt = 'Última copia extra: hace ' + dias + ' días (tus datos ya están en la nube)'; cls = ''; ico = '💾'; }
    else { txt = 'Última copia de seguridad: hace ' + dias + ' días'; cls = dias >= 3 ? 'is-urgent' : ''; ico = dias >= 3 ? '⚠️' : '💾'; }
    return el('a', { class: 'backup-bar ' + cls, href: '#/exportar' }, [
      el('span', { class: 'backup-bar-ico', text: ico }),
      el('span', { class: 'backup-bar-txt', text: txt }),
      el('span', { class: 'backup-bar-cta', text: excelOn ? 'Ver' : 'Hacer copia →' })
    ]);
  }

  window.App = window.App || {};
  App.views = App.views || {};
  App.views.dashboard = dashboard;
  App.views.vehicleList = vehicleListView;
  App.views.vehicleDetail = vehicleDetail;

<script>
/* ===== js/views2.js ===== */
/* ============================================================================
 * views2.js  —  Alertas, Finanzas, Resúmenes, Gráficos, Historial,
 *               Operaciones, Comparación del dólar, Contactos, Estadísticas,
 *               Papelera, Exportación, Ajustes
 * ==========================================================================*/
(function () {
  'use strict';
  var ui = App.ui, el = ui.el, fmt = App.fmt, store = App.store, fin = App.finance;

  /* =============================== ALERTAS ============================= */
  /* ---- Recordatorios: tipos, repetición y cálculo de ocurrencias ---- */
  var REM_TIPOS = (App.forms && App.forms.REM_TIPOS) || [['tarea', 'Tarea']];
  var REM_ICON = {
    tarea: '📋', mantenimiento: '🔧', tramite: '📁', pago: '💳',
    turno: '🤝', gestoria: '📝', stock: '📦', otro: '🔔'
  };
  function remTipoLabel(t) {
    for (var i = 0; i < REM_TIPOS.length; i++) if (REM_TIPOS[i][0] === t) return REM_TIPOS[i][1];
    return 'Otro';
  }
  function remIcon(t) { return REM_ICON[t] || '🔔'; }
  function remRepeatLabel(rep) {
    return ({ daily: 'todos los días', weekly: 'todas las semanas', monthly: 'todos los meses', yearly: 'todos los años' })[rep] || '';
  }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // próxima ocurrencia (>= hoy) de un recordatorio; para 'none' es su fecha tal cual
  function reminderNextDate(r, todayIso) {
    if (!r.repeat || r.repeat === 'none') return r.fecha;
    var base = fin.parseDate(r.fecha), today = fin.parseDate(todayIso);
    if (!base || !today) return r.fecha;
    var start = base > today ? base : today;
    var d;
    if (r.repeat === 'daily') return isoOf(start);
    if (r.repeat === 'weekly') {
      d = new Date(start);
      d.setDate(d.getDate() + ((base.getDay() - d.getDay() + 7) % 7));
      return isoOf(d);
    }
    if (r.repeat === 'monthly') {
      d = new Date(start.getFullYear(), start.getMonth(), base.getDate());
      if (d < start) d = new Date(start.getFullYear(), start.getMonth() + 1, base.getDate());
      return isoOf(d);
    }
    if (r.repeat === 'yearly') {
      d = new Date(start.getFullYear(), base.getMonth(), base.getDate());
      if (d < start) d = new Date(start.getFullYear() + 1, base.getMonth(), base.getDate());
      return isoOf(d);
    }
    return r.fecha;
  }

  // ¿el recordatorio cae en este día (YYYY-MM-DD)?
  function reminderOnDay(r, dayIso) {
    var base = fin.parseDate(r.fecha), day = fin.parseDate(dayIso);
    if (!base || !day) return false;
    if (day < new Date(base.getFullYear(), base.getMonth(), base.getDate())) return false;
    switch (r.repeat) {
      case 'daily': return true;
      case 'weekly': return base.getDay() === day.getDay();
      case 'monthly': return base.getDate() === day.getDate();
      case 'yearly': return base.getDate() === day.getDate() && base.getMonth() === day.getMonth();
      default: return r.fecha === dayIso;
    }
  }

  function occDone(r, occDate) { return (r.doneDates || []).indexOf(occDate) >= 0; }
  function reminderStatus(r, todayIso) {
    var next = reminderNextDate(r, todayIso);
    if (!r.repeat || r.repeat === 'none') {
      if (occDone(r, r.fecha)) return 'done';
      if (r.fecha < todayIso) return 'overdue';
      if (r.fecha === todayIso) return 'today';
      return 'upcoming';
    }
    if (occDone(r, next)) return 'done';
    return next === todayIso ? 'today' : 'upcoming';
  }

  // Eventos automáticos: vencimientos de cuotas (a pagar y a cobrar) y de reservas.
  // Para no llenar Alertas: los vencidos y de hoy siempre; los futuros sólo si
  // faltan pocos días (el listado completo está en "Cuotas y cobros").
  function autoEvents(todayIso, allFuture) {
    var horizonteDias = (store.getState().settings.cuotaProximaDias || 7) + 21; // ~1 mes de anticipación
    var limite = fin.parseDate(todayIso); limite.setDate(limite.getDate() + horizonteDias);
    var limiteIso = limite.getFullYear() + '-' + pad(limite.getMonth() + 1) + '-' + pad(limite.getDate());
    var out = [];
    var inst = fin.allInstallments();
    function add(kind, it) {
      if (!it.vencimiento) return;
      out.push({ auto: true, kind: kind, vehicle: it.vehicle, cuota: it.cuota, moneda: it.moneda, monto: it.cuota.monto, date: it.vencimiento });
    }
    inst.pagar.forEach(function (it) { if (it.estado !== 'pagada') add('pagar', it); });
    inst.cobrar.forEach(function (it) { if (it.estado !== 'cobrada') add('cobrar', it); });
    store.activeVehicles().forEach(function (v) {
      if (v.reservation && v.reservation.vence && v.estado === 'reservado') {
        out.push({ auto: true, kind: 'reserva', vehicle: v, date: v.reservation.vence });
      }
    });
    out.forEach(function (e) {
      e.status = e.date < todayIso ? 'overdue' : (e.date === todayIso ? 'today' : 'upcoming');
    });
    if (allFuture) return out;
    return out.filter(function (e) { return e.status !== 'upcoming' || e.date <= limiteIso; });
  }

  function allBuckets(todayIso) {
    var b = { overdue: [], today: [], upcoming: [], done: [] };
    store.getReminders().forEach(function (r) {
      var st = reminderStatus(r, todayIso);
      b[st].push({ r: r, date: reminderNextDate(r, todayIso), status: st });
    });
    autoEvents(todayIso).forEach(function (e) { b[e.status].push(e); });
    function key(x) { return (x.date || '9999') + '·' + (x.r && x.r.hora ? x.r.hora : '99:99'); }
    ['overdue', 'today', 'upcoming'].forEach(function (k) { b[k].sort(function (a, x) { return key(a).localeCompare(key(x)); }); });
    return b;
  }

  var alerts = {
    forVehicle: function (v) {
      var out = [];
      if (v.deleted) return out;
      var m = fin.vehicleMetrics(v);
      var hoy = store.todayISO();
      var s = store.getState().settings;
      if (!v.purchase && !(v.origin && v.origin.type === 'consignacion')) out.push({ level: 'warn', icon: '🧾', text: 'Falta registrar la compra', vehicleId: v.id });
      if (v.purchase && !v.purchase.cotizacionUSD && v.purchase.moneda === 'ARS') out.push({ level: 'info', icon: '💵', text: 'Falta la cotización del dólar en la compra', vehicleId: v.id });
      if (v.estado === 'vendido' && v.sale) {
        if (!v.sale.precio) out.push({ level: 'warn', icon: '🏷️', text: 'Falta registrar el precio de venta', vehicleId: v.id });
        if (!v.sale.fecha) out.push({ level: 'warn', icon: '📅', text: 'Falta registrar la fecha de venta', vehicleId: v.id });
        if (v.sale.moneda === 'ARS' && !v.sale.cotizacionUSD) out.push({ level: 'info', icon: '💵', text: 'Falta la cotización del dólar en la venta', vehicleId: v.id });
      }
      if (v.documentacion === 'pendiente' || v.documentacion === 'transferencia') out.push({ level: 'warn', icon: '📁', text: 'Documentación pendiente' + (v.documentacion === 'transferencia' ? ' (transferencia)' : ''), vehicleId: v.id });
      if (v.estado !== 'vendido' && m.diasEnStock != null && m.diasEnStock >= s.diasStockAlerta) out.push({ level: 'warn', icon: '⏳', text: 'Lleva ' + m.diasEnStock + ' días en stock', vehicleId: v.id });
      if (!v.marca || !v.modelo || !v.patente) out.push({ level: 'info', icon: '✏️', text: 'Información básica incompleta', vehicleId: v.id });
      // (los vencimientos de cuotas y reservas se muestran arriba, como recordatorios)
      return out;
    },
    all: function () {
      var out = [];
      store.activeVehicles().forEach(function (v) {
        alerts.forVehicle(v).forEach(function (a) { a.vehicle = v; out.push(a); });
      });
      var order = { danger: 0, warn: 1, info: 2 };
      out.sort(function (a, b) { return order[a.level] - order[b.level]; });
      return out;
    },
    count: function () {
      var n = alerts.all().filter(function (a) { return a.level !== 'info'; }).length;
      var hoy = store.todayISO();
      store.getReminders().forEach(function (r) {
        var st = reminderStatus(r, hoy);
        if (st === 'overdue' || st === 'today') n++;
      });
      autoEvents(hoy).forEach(function (e) { if (e.status === 'overdue' || e.status === 'today') n++; });
      return n;
    }
  };
  function daysBetween(a, b) {
    var da = fin.parseDate(a), db = fin.parseDate(b);
    if (!da || !db) return 0;
    return Math.round((db - da) / 86400000);
  }
  App.alerts = alerts;

  function alertasView(root) {
    var hoy = store.todayISO();

    var vehAlerts = alerts.all();
    var b = allBuckets(hoy);
    var doneRems = store.getReminders().filter(function (r) { return reminderStatus(r, hoy) === 'done'; })
      .map(function (r) { return { r: r, date: r.fecha, status: 'done' }; });
    var pendCount = b.overdue.length + b.today.length + b.upcoming.length;

    var wrap = el('div', { class: 'page alertas-page' });

    var head = pageHead('🔔 Alertas');
    head.appendChild(el('button', { class: 'btn btn-primary', html: '<span>＋</span> Nueva alerta', onclick: function () { App.forms.reminderForm(null, hoy); } }));
    wrap.appendChild(head);

    if (b.overdue.length) wrap.appendChild(remGroup('🔴 Vencidas', b.overdue, hoy, 'overdue'));
    if (b.today.length) wrap.appendChild(remGroup('🟡 Hoy', b.today, hoy, 'today'));
    if (b.upcoming.length) wrap.appendChild(remGroup('🟢 Próximas', b.upcoming.slice(0, 40), hoy, 'upcoming'));
    if (!pendCount) {
      wrap.appendChild(el('div', { class: 'card' }, [ui.emptyState('No tenés nada pendiente. Todo al día 👌', '✅')]));
    }
    if (doneRems.length) {
      wrap.appendChild(el('details', { class: 'card rem-done-box' }, [
        el('summary', {}, [el('strong', { text: 'Completadas' }), el('span', { class: 'count-tag', text: doneRems.length })]),
        remList(doneRems, hoy)
      ]));
    }

    // Avisos de vehículos (documentación, días en stock, etc.): misma lógica
    // de siempre, pero colapsados por defecto para no saturar la pantalla.
    if (vehAlerts.length) {
      var byVeh = {};
      vehAlerts.forEach(function (a) { (byVeh[a.vehicle.id] = byVeh[a.vehicle.id] || []).push(a); });
      var vsec = el('div', { class: 'rem-list' }, Object.keys(byVeh).map(function (vid) {
        var v = store.getVehicle(vid);
        return el('a', { class: 'veh-alert', href: '#/vehiculo/' + vid }, [
          el('div', { class: 'veh-alert-top' }, [
            el('strong', { text: store.vehicleName(v) }),
            v.patente ? el('span', { class: 'row-patente', text: v.patente }) : null
          ]),
          el('div', { class: 'veh-alert-lines' }, byVeh[vid].map(function (a) {
            return el('span', { class: 'alrt alrt-' + a.level }, [el('span', { text: a.icon }), el('span', { text: a.text })]);
          }))
        ]);
      }));
      wrap.appendChild(el('details', { class: 'card rem-done-box' }, [
        el('summary', {}, [el('strong', { text: 'Avisos de vehículos' }), el('span', { class: 'count-tag', text: vehAlerts.length })]),
        vsec
      ]));
    }

    root.appendChild(wrap);
  }

  function remGroup(title, items, hoy, kind) {
    return el('div', { class: 'card rem-group rem-group-' + kind }, [
      el('div', { class: 'rem-group-head' }, [el('h3', { text: title })]),
      remList(items, hoy)
    ]);
  }

  function remList(items, hoy) {
    return el('div', { class: 'rem-list' }, items.map(function (it) { return remItem(it, hoy); }));
  }

  function remItem(it, hoy) {
    if (it.auto) return autoItem(it, hoy);
    var r = it.r;
    var status = it.status || reminderStatus(r, hoy);
    var occ = it.date || r.fecha;
    var isDone = occDone(r, occ) || status === 'done';
    var repTxt = (r.repeat && r.repeat !== 'none') ? ' · ↻ ' + remRepeatLabel(r.repeat) : '';
    var when;
    if (status === 'overdue') when = 'Venció · ' + fmt.relative(r.fecha);
    else if (status === 'today') when = 'Hoy' + (r.hora ? ' · ' + r.hora : '');
    else if (status === 'done') when = 'Completado';
    else when = fmt.date(occ) + (r.hora ? ' · ' + r.hora : '');

    var check = el('button', {
      class: 'rem-check' + (isDone ? ' is-done' : ''),
      title: isDone ? 'Marcar como pendiente' : 'Marcar como hecho',
      text: isDone ? '✓' : '',
      onclick: function (e) { e.preventDefault(); e.stopPropagation(); store.toggleReminderOccurrence(r.id, occ); }
    });
    var del = el('button', {
      class: 'icon-btn rem-del', title: 'Eliminar', html: '&times;',
      onclick: function (e) {
        e.preventDefault(); e.stopPropagation();
        ui.confirm({ title: 'Eliminar alerta', message: '¿Eliminar "' + r.titulo + '"?', danger: true, confirmText: 'Eliminar' })
          .then(function (ok) { if (ok) { store.removeReminder(r.id); ui.toast('Alerta eliminada'); } });
      }
    });
    return el('div', { class: 'rem-item rem-' + status + (isDone ? ' is-done' : '') }, [
      check,
      el('div', { class: 'rem-item-body', onclick: function () { App.forms.reminderForm(r); } }, [
        el('div', { class: 'rem-item-title' }, [
          el('span', { class: 'rem-ico', text: remIcon(r.tipo) }),
          el('span', { class: 'rem-item-name', text: r.titulo })
        ]),
        el('div', { class: 'rem-item-meta', text: when + ' · ' + remTipoLabel(r.tipo) + repTxt }),
        r.nota ? el('div', { class: 'rem-item-note', text: r.nota }) : null
      ]),
      del
    ]);
  }

  function autoItem(e, hoy) {
    var ico = e.kind === 'pagar' ? '💳' : (e.kind === 'cobrar' ? '💰' : '🔖');
    var name = e.kind === 'pagar' ? ('Pagar cuota ' + e.cuota.numero + ' — ' + store.vehicleName(e.vehicle))
      : e.kind === 'cobrar' ? ('Te tienen que pagar la cuota ' + e.cuota.numero + ' — ' + store.vehicleName(e.vehicle))
      : ('Vence la reserva de ' + store.vehicleName(e.vehicle) + (e.vehicle.reservation.cliente ? ' (' + e.vehicle.reservation.cliente.nombre + ')' : ''));
    var when = e.status === 'overdue' ? ('Venció · ' + fmt.relative(e.date)) : (e.status === 'today' ? 'Vence hoy' : ('Vence ' + fmt.date(e.date)));
    var meta = when + (e.monto ? ' · ' + fmt.money(e.monto, e.moneda) : '') +
      (e.kind === 'cobrar' ? ' · te lo pagan a vos' : (e.kind === 'pagar' ? ' · lo pagás vos' : ''));
    var action = null;
    if (e.kind === 'pagar') action = el('button', { class: 'btn btn-sm btn-primary', text: 'Pagué', onclick: function (ev) { ev.preventDefault(); ev.stopPropagation(); store.pagarCuota(e.vehicle.id, e.cuota.id, hoy); ui.toast('Cuota pagada', 'success'); } });
    else if (e.kind === 'cobrar') action = el('button', { class: 'btn btn-sm btn-primary', text: 'Me pagaron', onclick: function (ev) { ev.preventDefault(); ev.stopPropagation(); store.cobrarCuotaVenta(e.vehicle.id, e.cuota.id, hoy); ui.toast('Cobro registrado', 'success'); } });
    return el('div', { class: 'rem-item rem-' + e.status + ' rem-auto' }, [
      el('span', { class: 'rem-ico rem-auto-ico', text: ico }),
      el('a', { class: 'rem-item-body', href: '#/vehiculo/' + e.vehicle.id }, [
        el('div', { class: 'rem-item-title' }, [el('span', { class: 'rem-item-name', text: name })]),
        el('div', { class: 'rem-item-meta', text: meta })
      ]),
      action
    ]);
  }

  /* ============================== ECONOMÍA ============================ */
  // Pantalla principal: menú de módulos en tarjetas (mismo patrón de estado
  // interno + volverLink ya usado en Resúmenes/Cuotas/Ajustes, sin rutas
  // nuevas). Cada módulo reutiliza tal cual la vista que ya existía (misma
  // función, mismos datos, misma lógica) — acá solo se decide en qué
  // contenedor se dibuja.
  var MODULOS_ECONOMIA = [
    ['situacion', '💰', 'Situación económica', 'Resultado, capital y stock del negocio', finanzasView],
    ['gastos', '🏢', 'Gastos del negocio', 'Alquiler, sueldos y otros gastos fijos', gastosNegocioView],
    ['cuotas', '💳', 'Cuotas y cobros', 'Lo que pagás y lo que te pagan', cuotasView],
    ['dolar', '💵', 'Comparar dólar', 'El valor de tus operaciones en dólares', function (panel) { comparacionView(panel); }],
    ['resumenes', '📊', 'Resúmenes', 'Totales por período y estadísticas', resumenesView]
  ];
  var economiaScreen = 'home';
  function economiaView(root) {
    var wrap = el('div', { class: 'page page-economia' });
    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: 'Economía' }),
        el('p', { class: 'page-sub', text: 'Elegí qué querés ver' })
      ])
    ]));

    // class "tab-panel": la regla CSS que le da a Economía su ancho amplio
    // (.page-economia .tab-panel .page) sigue aplicando igual que antes.
    var content = el('div', { class: 'tab-panel' });
    wrap.appendChild(content);
    root.appendChild(wrap);

    function goScreen(key) { economiaScreen = key; render(); }
    function volverLink() {
      return el('a', { class: 'back-link', href: '#', html: '‹ Volver a Economía', onclick: function (e) { e.preventDefault(); goScreen('home'); } });
    }

    function render() {
      ui.clear(content);
      var mod = MODULOS_ECONOMIA.filter(function (m) { return m[0] === economiaScreen; })[0];
      if (mod) {
        content.appendChild(volverLink());
        var panel = el('div', { style: 'margin-top:6px' });
        content.appendChild(panel);
        mod[4](panel);
        return;
      }
      economiaScreen = 'home';
      content.appendChild(el('div', { class: 'grid-2 module-grid' }, MODULOS_ECONOMIA.map(function (m) {
        return el('div', { class: 'card module-card', onclick: function () { goScreen(m[0]); } }, [
          el('span', { class: 'module-card-ico', text: m[1] }),
          el('strong', { class: 'module-card-title', text: m[2] }),
          el('span', { class: 'module-card-desc', text: m[3] })
        ]);
      })));
    }
    render();
  }

  /* =============================== FINANZAS =========================== */
  // ("Situación económica" dentro de Economía). Dashboard financiero: reusa
  // exactamente fin.globalMetrics()/fin.vehicleMetrics() — ningún cálculo
  // nuevo, solo se reorganiza cómo se presentan los mismos números.
  function finanzasView(root) {
    var g = fin.globalMetrics();
    var wrap = el('div', { class: 'page econ-dashboard' });
    wrap.appendChild(pageHead('Situación económica', 'Cómo está el negocio, de un vistazo'));

    // --- Lo más importante: resultado del negocio ---
    // Es un acumulado histórico (todas las ventas − todos los gastos fijos
    // cargados, sin recorte de fecha) — mismo cálculo de siempre, solo se
    // aclara el período en el título para que no se lea como "de hoy".
    wrap.appendChild(el('div', { class: 'econ-hero' }, [
      el('span', { class: 'econ-hero-label', text: 'Resultado histórico del negocio' }),
      el('span', { class: 'econ-hero-value ' + (g.resultadoNegocio >= 0 ? 'pos' : 'neg'), text: (g.resultadoNegocio >= 0 ? '+' : '') + fmt.money(g.resultadoNegocio) }),
      el('span', { class: 'econ-hero-sub', text: 'Ganancia acumulada por autos vendidos − gastos fijos acumulados. Para un período puntual, mirá Resúmenes.' })
    ]));

    // --- Tres métricas principales, más discretas que el resultado ---
    wrap.appendChild(el('div', { class: 'grid-3' }, [
      miniStat('Capital en stock', fmt.money(g.capitalInvertido)),
      miniStat('Valor del stock', fmt.money(g.valorEstimadoStock)),
      miniStat('Ganancia obtenida', fmt.money(g.gananciaTotal), g.gananciaTotal >= 0 ? 'pos' : 'neg')
    ]));

    // --- Stock: qué vehículos tiene y cuánto valen ---
    var enStock = store.activeVehicles().filter(function (v) { return v.estado !== 'vendido'; })
      .sort(function (a, b) { return b.createdAt - a.createdAt; });
    var stockCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [
        el('h3', { text: '🚗 Stock' }),
        el('span', { class: 'count-tag', text: g.autosEnStock + ' de ' + g.totalVehiculos })
      ]),
      el('p', { class: 'form-help', text: g.autosEnStock + ' vehículo' + (g.autosEnStock === 1 ? '' : 's') + ' en stock · ' + fmt.money(g.capitalInvertido) + ' invertidos' })
    ]);
    if (!enStock.length) {
      stockCard.appendChild(ui.emptyState('No hay vehículos en stock.', '🚗'));
    } else {
      // Tarjetas en vez de tabla: mismo dato, sin scroll horizontal en mobile.
      stockCard.appendChild(el('div', { class: 'rem-list' }, enStock.map(function (v) {
        var m = fin.vehicleMetrics(v);
        var dif = m.estimadoARS - m.costoTotalARS;
        return el('div', { class: 'rem-item rem-auto' }, [
          el('span', { class: 'rem-ico rem-auto-ico', text: '🚗' }),
          el('a', { class: 'rem-item-body', href: '#/vehiculo/' + v.id }, [
            el('div', { class: 'rem-item-title' }, [
              el('span', { class: 'rem-item-name', text: store.vehicleName(v) }),
              (v.origin && v.origin.type === 'consignacion') ? ui.pill('🤝 Consig.', 'pill-warn') : null
            ]),
            el('div', { class: 'rem-item-meta' }, [
              el('span', { text: 'Inversión ' + fmt.money(m.costoTotalARS) + ' · Valor estimado ' + fmt.money(m.estimadoARS) }),
              el('span', { class: dif >= 0 ? 'pos' : 'neg', text: '  ' + (dif >= 0 ? '+' : '') + fmt.money(dif) })
            ])
          ])
        ]);
      })));
    }
    wrap.appendChild(stockCard);

    // --- Pendientes: cuotas por cobrar/pagar, gastos fijos y diferencia en USD ---
    // ("Rendimiento" se sacó de esta pantalla — los mismos datos
    // (g.mayorGanancia, g.vendidoMasRapido, g.masTiempoStock, g.mayorVenta)
    // se siguen usando tal cual en Resúmenes → Estadísticas del negocio.)
    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: '💰 Pendientes' }),
      el('div', { class: 'grid-2' }, [
        miniStat('Por cobrar', fmt.money(g.porCobrar), g.porCobrarVencido ? 'neg' : ''),
        miniStat('Por pagar', fmt.money(g.porPagarCuotas), g.porPagarVencido ? 'neg' : ''),
        miniStat('Gastos del negocio', fmt.money(g.gastosFijosTotales)),
        miniStat('Diferencia en USD', fmt.usd(g.gananciaTotalUSD), g.gananciaTotalUSD >= 0 ? 'pos' : 'neg')
      ])
    ]));

    root.appendChild(wrap);
  }

  function miniStat(label, value, tone) {
    return el('div', { class: 'mini-stat' }, [el('span', { class: 'mini-stat-label', text: label }), el('span', { class: 'mini-stat-value ' + (tone || ''), text: value })]);
  }
  function highlight(label, wrapObj, valFn) {
    if (!wrapObj || !wrapObj.v) return el('div', { class: 'card highlight muted' }, [el('span', { class: 'highlight-label', text: label }), el('span', { class: 'highlight-name', text: '—' })]);
    return el('div', { class: 'card highlight' }, [
      el('span', { class: 'highlight-label', text: label }),
      el('a', { class: 'highlight-name', href: '#/vehiculo/' + wrapObj.v.id, text: store.vehicleName(wrapObj.v) }),
      el('span', { class: 'highlight-value', text: valFn(wrapObj) })
    ]);
  }

  /* ============================== RESÚMENES ========================== */
  // Pantalla principal: resumen compacto (4 métricas + accesos). El detalle
  // que antes se mostraba todo junto (comparador, tablas mensuales/anuales,
  // estadísticas del negocio) pasó a la sub-pantalla "negocio"; el detalle
  // por vehículo es nuevo (reutiliza fin.vehicleMetrics, sin cálculos nuevos).
  // Todo sigue usando fin.periodResult/fin.monthlySeries/fin.globalMetrics
  // tal cual ya existían — solo cambió cómo se organiza la presentación.
  var resumenState = { preset: 'mes', from: '', to: '', cmpA: '', cmpB: '', screen: 'home' };
  function resumenesView(root) {
    var wrap = el('div', { class: 'page' });
    var head = pageHead('Resúmenes');

    var presets = [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['anio', 'Este año'], ['historico', 'Histórico'], ['rango', 'Rango personalizado']];
    var selPeriodo = ui.select(presets.map(function (p) { return { value: p[0], label: p[1] }; }), resumenState.preset, { class: 'input select' });
    selPeriodo.addEventListener('change', function () { resumenState.preset = selPeriodo.value; render(); });
    var periodoWrap = el('div', { class: 'resumen-period' }, [el('span', { class: 'resumen-period-ico', text: '📅' }), selPeriodo]);
    head.appendChild(periodoWrap);
    wrap.appendChild(head);

    var rangeBox = el('div', { class: 'range-box' });
    var fFrom = ui.input({ type: 'date', value: resumenState.from });
    var fTo = ui.input({ type: 'date', value: resumenState.to });
    fFrom.addEventListener('change', function () { resumenState.from = fFrom.value; render(); });
    fTo.addEventListener('change', function () { resumenState.to = fTo.value; render(); });
    rangeBox.appendChild(el('div', { class: 'inline-fields' }, [ui.field('Desde', fFrom), ui.field('Hasta', fTo)]));
    wrap.appendChild(rangeBox);

    var content = el('div', {});
    wrap.appendChild(content);
    root.appendChild(wrap);

    function currentRange() {
      switch (resumenState.preset) {
        case 'hoy': return fin.dayRange();
        case 'semana': return fin.weekRange();
        case 'mes': return fin.monthRange();
        case 'anio': return fin.yearRange();
        case 'historico': return fin.allRange();
        case 'rango': return { from: resumenState.from || null, to: resumenState.to || null };
      }
      return fin.allRange();
    }

    function goScreen(s) { resumenState.screen = s; render(); }
    function volverLink() {
      return el('a', { class: 'back-link', href: '#', html: '‹ Volver a Resúmenes', onclick: function (e) { e.preventDefault(); goScreen('home'); } });
    }
    function navCard(icon, title, desc, screen) {
      return el('div', { class: 'card resumen-nav-card', onclick: function () { goScreen(screen); } }, [
        el('span', { class: 'resumen-nav-ico', text: icon }),
        el('div', { class: 'resumen-nav-body' }, [el('strong', { text: title }), el('span', { text: desc })])
      ]);
    }

    function render() {
      var screen = resumenState.screen;
      periodoWrap.hidden = screen === 'vehiculos';
      rangeBox.hidden = screen === 'vehiculos' || resumenState.preset !== 'rango';
      ui.clear(content);

      if (screen === 'vehiculos') {
        content.appendChild(volverLink());
        content.appendChild(el('h3', { text: 'Estadísticas por vehículo', style: 'margin-top:10px' }));
        content.appendChild(vehiculosStatsCard());
        return;
      }

      if (screen === 'negocio') {
        var r2 = fin.periodResult(currentRange());
        content.appendChild(volverLink());
        content.appendChild(el('h3', { text: 'Estadísticas del negocio', style: 'margin-top:10px' }));
        content.appendChild(el('div', { class: 'card' }, dl([
          ['Período', (r2.range.from ? fmt.date(r2.range.from) : 'inicio') + '  —  ' + (r2.range.to ? fmt.date(r2.range.to) : 'hoy')],
          ['Compras registradas', r2.comprasCount],
          ['Ventas registradas', r2.ventasCount],
          ['Cuotas pagadas en el período', fmt.money(r2.cuotasPagadas)],
          ['(+) Ganancias por autos vendidos', fmt.money(r2.ganancias), r2.ganancias >= 0 ? 'pos' : 'neg'],
          ['(−) Gastos puestos en autos', fmt.money(r2.gastos)],
          ['(−) Gastos fijos del negocio', fmt.money(r2.gastosFijos)],
          ['(=) Resultado neto', fmt.money(r2.resultadoNeto), r2.resultadoNeto >= 0 ? 'pos strong' : 'neg strong']
        ])));
        content.appendChild(comparador());
        content.appendChild(tablaMensual());
        content.appendChild(tablaAnual());
        estadisticasContent().forEach(function (n) { content.appendChild(n); });
        return;
      }

      // screen === 'home': resumen compacto
      var r = fin.periodResult(currentRange());
      content.appendChild(el('div', { class: 'stat-grid stat-grid-4' }, [
        miniStat('Ventas', fmt.num(r.ventasCount)),
        miniStat('Ganancia', fmt.money(r.ganancias), r.ganancias >= 0 ? 'pos' : 'neg'),
        miniStat('Gastos', fmt.money(r.gastos + r.gastosFijos)),
        miniStat('Resultado', fmt.money(r.resultadoNeto), r.resultadoNeto >= 0 ? 'pos' : 'neg')
      ]));

      content.appendChild(el('h3', { text: 'Resumen del negocio', style: 'margin-top:6px' }));
      content.appendChild(navCard('📊', 'Ver estadísticas del negocio', 'Ver rendimiento, ventas, tiempos, resultados y otros indicadores del negocio.', 'negocio'));
      content.appendChild(navCard('🚗', 'Ver estadísticas por vehículo', 'Ver el detalle y rendimiento de cada vehículo.', 'vehiculos'));
    }

    function vehiculosStatsCard() {
      var card = el('div', { class: 'card' });
      var list = store.activeVehicles();
      if (!list.length) { card.appendChild(ui.emptyState('No hay vehículos cargados todavía.', '🚗')); return card; }
      var table = el('table', { class: 'data-table' });
      table.appendChild(el('thead', {}, el('tr', {}, ['Vehículo', 'Estado', 'Inversión', 'Venta', 'Ganancia', 'Rentabilidad', 'Días en stock'].map(function (h) { return el('th', { text: h }); }))));
      var tb = el('tbody');
      list.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (v) {
        var m = fin.vehicleMetrics(v);
        tb.appendChild(el('tr', { class: 'clickable-row', onclick: function () { App.router.go('vehiculo/' + v.id); } }, [
          el('td', {}, el('span', { class: 'cell-name', text: store.vehicleName(v) })),
          el('td', {}, ui.estadoBadge(v.estado)),
          el('td', { text: fmt.money(m.costoTotalARS) }),
          el('td', { text: m.vendido ? fmt.money(m.ventaARS) : '—' }),
          el('td', { class: m.vendido ? (m.gananciaARS >= 0 ? 'pos' : 'neg') : '', text: m.vendido ? ((m.gananciaARS >= 0 ? '+' : '') + fmt.money(m.gananciaARS)) : '—' }),
          el('td', { class: m.vendido ? (m.gananciaARS >= 0 ? 'pos' : 'neg') : '', text: m.vendido ? fmt.pct(m.rentabilidad) : '—' }),
          el('td', { text: fmt.days(m.diasEnStock) })
        ]));
      });
      table.appendChild(tb);
      card.appendChild(el('div', { class: 'table-wrap' }, table));
      return card;
    }

    function comparador() {
      var card = el('div', { class: 'card' });
      card.appendChild(el('h3', { text: 'Comparar períodos' }));
      var now = new Date();
      var mesesOpts = [];
      for (var i = 0; i < 24; i++) { var d = new Date(now.getFullYear(), now.getMonth() - i, 1); mesesOpts.push({ value: d.getFullYear() + '-' + pad(d.getMonth() + 1), label: fin.monthLabelLong(d) }); }
      var aniosOpts = [];
      for (var y = now.getFullYear(); y >= now.getFullYear() - 6; y--) aniosOpts.push({ value: String(y), label: String(y) });

      var modo = ui.select([{ value: 'mes', label: 'Mes contra mes' }, { value: 'anio', label: 'Año contra año' }], 'mes');
      var selA = ui.select(mesesOpts, mesesOpts[1] && mesesOpts[1].value);
      var selB = ui.select(mesesOpts, mesesOpts[0] && mesesOpts[0].value);
      var res = el('div', { class: 'cmp-result' });
      function fill() {
        var isMes = modo.value === 'mes';
        var opts = isMes ? mesesOpts : aniosOpts;
        [selA, selB].forEach(function (s, idx) {
          ui.clear(s); opts.forEach(function (o) { var op = el('option', { value: o.value }, o.label); s.appendChild(op); });
          s.selectedIndex = idx === 0 ? Math.min(1, opts.length - 1) : 0;
        });
        recompute();
      }
      function rangeFor(val) {
        if (modo.value === 'mes') { var p = val.split('-'); return fin.monthRange(new Date(+p[0], +p[1] - 1, 1)); }
        return fin.yearRange(new Date(+val, 0, 1));
      }
      function recompute() {
        var a = fin.periodResult(rangeFor(selA.value));
        var b = fin.periodResult(rangeFor(selB.value));
        ui.clear(res);
        res.appendChild(cmpTable(labelFor(selA.value), a, labelFor(selB.value), b));
      }
      function labelFor(val) {
        if (modo.value === 'mes') { var p = val.split('-'); return fin.monthLabelLong(new Date(+p[0], +p[1] - 1, 1)); }
        return val;
      }
      modo.addEventListener('change', fill);
      selA.addEventListener('change', recompute);
      selB.addEventListener('change', recompute);
      card.appendChild(el('div', { class: 'inline-fields' }, [modo, selA, el('span', { class: 'vs', text: 'vs' }), selB]));
      card.appendChild(res);
      fill();
      return card;
    }

    function cmpTable(la, a, lb, b) {
      var rows = [
        ['Ganancias por autos', a.ganancias, b.ganancias],
        ['Gastos de autos', a.gastos, b.gastos],

      ];
      var t = el('table', { class: 'data-table' });
      t.appendChild(el('thead', {}, el('tr', {}, [el('th', { text: 'Concepto' }), el('th', { text: la }), el('th', { text: lb }), el('th', { text: 'Diferencia' })])));
      var body = el('tbody');
      rows.forEach(function (r) {
        var diff = r[1] - r[2];
        body.appendChild(el('tr', {}, [
